<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ARTILLERY DUEL</title>
<style>
  html,body{margin:0;padding:0;background:#05060c;overflow:hidden;height:100%;}
  canvas{display:block;cursor:crosshair;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<input id="vol" type="range" min="0" max="1" step="0.05" title="VOLUME">
<!-- arcade-shared:start -->
<script>
/* Arcade shared runtime.
   Single source of truth for cross-game boilerplate. build-arcade.py injects
   this into every game between the arcade-shared markers (and keeps the copies
   in sync on each run) — edit THIS file, then run: python3 build-arcade.py */
(function () {
  "use strict";

  /* ---- safe storage: never throws (Safari private mode, disabled storage) ---- */
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, String(v)); return true; } catch (e) { return false; } },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} },
    num: function (k) { var n = parseFloat(store.get(k)); return isFinite(n) ? n : 0; },
    json: function (k) { try { return JSON.parse(store.get(k)); } catch (e) { return null; } }
  };

  /* ---- audio: one wrap of the AudioContext constructor gives us both
     a tab-hidden auto-suspend and an arcade-wide master volume ----
     Every context's .destination is rerouted through a shared gain node, so
     the settings panel's master volume applies to every game with no per-game
     wiring; the games' own volume sliders keep working underneath it.
     Only contexts *we* suspended are resumed, so a game's own
     mute-by-suspend behaviour is left alone. */
  var contexts = [];
  var autoSuspended = [];
  var masters = [];
  function masterLevel() {
    if (store.get("arcade_master_muted") === "1") return 0;
    var v = parseFloat(store.get("arcade_master"));
    return isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1;
  }
  function applyMaster() {
    var lvl = masterLevel();
    masters.forEach(function (g) {
      try { g.gain.setTargetAtTime(lvl, g.context.currentTime, 0.02); } catch (e) {}
    });
  }
  ["AudioContext", "webkitAudioContext"].forEach(function (name) {
    var Orig = window[name];
    if (!Orig) return;
    function Patched() {
      var ctx = arguments.length
        ? new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))()
        : new Orig();
      contexts.push(ctx);
      try {
        var realDest = ctx.destination;
        var master = ctx.createGain();
        master.gain.value = masterLevel();
        master.connect(realDest);
        Object.defineProperty(ctx, "destination", {
          get: function () { return master; },
          configurable: true
        });
        masters.push(master);
      } catch (e) { /* master volume is best-effort */ }
      return ctx;
    }
    Patched.prototype = Orig.prototype;
    window[name] = Patched;
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      contexts.forEach(function (ctx) {
        if (ctx.state === "running") {
          autoSuspended.push(ctx);
          ctx.suspend().catch(function () {});
        }
      });
    } else {
      autoSuspended.splice(0).forEach(function (ctx) {
        if (ctx.state === "suspended") ctx.resume().catch(function () {});
      });
    }
  });

  /* ---- reduced motion: tame decorative CSS animation, expose a flag the
     games consult for canvas effects (shake, flashes, particles). The OS
     setting is the default; the settings panel can override it either way
     (arcade_rm: "auto" | "on" | "off"). ---- */
  var rmQuery = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reducedMotion() {
    var o = store.get("arcade_rm");
    if (o === "on") return true;
    if (o === "off") return false;
    return !!(rmQuery && rmQuery.matches);
  }
  var rmStyle = document.createElement("style");
  (document.head || document.documentElement).appendChild(rmStyle);
  function syncRMStyle() {
    rmStyle.textContent = reducedMotion()
      ? "*,*::before,*::after{animation-duration:.01ms !important;" +
        "animation-iteration-count:1 !important;transition-duration:.01ms !important;" +
        "scroll-behavior:auto !important}"
      : "";
  }
  syncRMStyle();
  if (rmQuery && rmQuery.addEventListener) rmQuery.addEventListener("change", syncRMStyle);

  /* ---- on-screen touch controls ----
     Created on demand by a game calling arcade.touch.* at the end of its own
     script. Nothing is shown unless the pointer is coarse (or ?touch=1 forces
     them for testing). Key buttons synthesize keydown/keyup on window+document
     with both .key and .code set, so games keep their existing handlers. */
  var touchOn = (window.matchMedia && matchMedia("(pointer: coarse)").matches) ||
                /[?&]touch=1\b/.test(location.search);
  var touchLayer = null;
  function ensureLayer() {
    if (!touchLayer) {
      touchLayer = document.createElement("div");
      touchLayer.id = "arcade-touch";
      touchLayer.style.cssText =
        "position:fixed;inset:0;z-index:15000;pointer-events:none;" +
        "user-select:none;-webkit-user-select:none";
      (document.body || document.documentElement).appendChild(touchLayer);
    }
    return touchLayer;
  }
  function mkEl(style, size) {
    var el = document.createElement("div");
    el.style.cssText =
      "position:absolute;pointer-events:auto;touch-action:none;box-sizing:border-box;" +
      "width:" + size + "px;height:" + size + "px;border-radius:50%;" +
      "background:rgba(140,160,210,.13);border:1px solid rgba(140,160,210,.45);" +
      "color:rgba(232,236,248,.85);display:flex;align-items:center;justify-content:center;" +
      "font:700 13px/1 system-ui,sans-serif;letter-spacing:1px;" + (style || "");
    return el;
  }
  function sendKey(type, key, code) {
    var ev = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true });
    window.dispatchEvent(ev);
    document.dispatchEvent(ev);
  }
  function touchButton(o) {
    if (!touchOn) return null;
    var el = mkEl(o.style, o.size || 54);
    el.textContent = o.label || "";
    if (o.label) el.dataset.k = o.label;
    var timer = 0;
    function down(e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.style.background = "rgba(140,160,210,.34)";
      if (o.onDown) o.onDown();
      if (o.repeat) timer = setInterval(function () { if (o.onDown) o.onDown(); }, o.repeat);
    }
    function up() {
      el.style.background = "rgba(140,160,210,.13)";
      if (timer) { clearInterval(timer); timer = 0; }
      if (o.onUp) o.onUp();
    }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    ensureLayer().appendChild(el);
    return el;
  }
  function keyButton(o) {
    var held = false;
    return touchButton({
      label: o.label, style: o.style, size: o.size, repeat: o.repeat,
      onDown: function () { held = true; sendKey("keydown", o.key, o.code || o.key); },
      onUp: function () { if (held) { held = false; sendKey("keyup", o.key, o.code || o.key); } }
    });
  }
  function dpad(o) {
    if (!touchOn) return;
    var s = o.size || 52, g = o.gap || 6;
    var bx = o.left != null ? o.left : 16, by = o.bottom != null ? o.bottom : 16;
    function at(cx, cy) { return "left:" + cx + "px;bottom:" + cy + "px"; }
    var m = o.map;
    keyButton({ label: "▲", key: m.up.key, code: m.up.code, size: s, repeat: o.repeat, style: at(bx + s + g, by + 2 * (s + g)) });
    keyButton({ label: "◀", key: m.left.key, code: m.left.code, size: s, repeat: o.repeat, style: at(bx, by + s + g) });
    keyButton({ label: "▶", key: m.right.key, code: m.right.code, size: s, repeat: o.repeat, style: at(bx + 2 * (s + g), by + s + g) });
    keyButton({ label: "▼", key: m.down.key, code: m.down.code, size: s, repeat: o.repeat, style: at(bx + s + g, by) });
  }
  function arrowDpad(o) {
    o = o || {};
    o.map = {
      up: { key: "ArrowUp", code: "ArrowUp" }, down: { key: "ArrowDown", code: "ArrowDown" },
      left: { key: "ArrowLeft", code: "ArrowLeft" }, right: { key: "ArrowRight", code: "ArrowRight" }
    };
    return dpad(o);
  }
  function stick(o) {
    if (!touchOn) return null;
    var size = o.size || 124;
    var base = mkEl(o.style, size);
    if (o.label) base.dataset.k = o.label;
    var knob = document.createElement("div");
    knob.style.cssText =
      "position:absolute;width:44%;height:44%;border-radius:50%;pointer-events:none;" +
      "background:rgba(140,160,210,.4);left:50%;top:50%;transform:translate(-50%,-50%)";
    base.appendChild(knob);
    var active = false;
    function setKnob(nx, ny) {
      knob.style.left = (50 + nx * 32) + "%";
      knob.style.top = (50 + ny * 32) + "%";
    }
    function report(e) {
      var r = base.getBoundingClientRect();
      var dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      var dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      var mag = Math.hypot(dx, dy);
      if (mag > 1) { dx /= mag; dy /= mag; }
      setKnob(dx, dy);
      if (o.onMove) o.onMove(dx, dy, true);
    }
    base.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { base.setPointerCapture(e.pointerId); } catch (err) {}
      active = true;
      report(e);
    });
    base.addEventListener("pointermove", function (e) { if (active) report(e); });
    function end() {
      if (!active) return;
      active = false;
      setKnob(0, 0);
      if (o.onMove) o.onMove(0, 0, false);
    }
    base.addEventListener("pointerup", end);
    base.addEventListener("pointercancel", end);
    ensureLayer().appendChild(base);
    return base;
  }

  /* ---- play-time heartbeat: the hub sorts and labels cards from this ----
     Standalone pages identify themselves by filename; inside the all-in-one
     bundle the overlay stamps data-arcade-game on the iframe. The smoke
     harness's srcdoc frames carry no stamp, so test runs never pollute it. */
  var GAME_ID = (function () {
    try {
      if (window.frameElement && window.frameElement.dataset.arcadeGame)
        return window.frameElement.dataset.arcadeGame;
      if (window.frameElement) return null; /* unstamped frame (smoke harness) */
    } catch (e) { return null; }
    var p = location.pathname.split("/").pop();
    return /\.html$/.test(p) && ["index.html", "arcade.html", "smoke.html"].indexOf(p) === -1 ? p : null;
  })();
  if (GAME_ID) {
    var visSince = document.hidden ? 0 : Date.now();
    var metaFlush = function () {
      var add = 0, now = Date.now();
      if (visSince) { add = (now - visSince) / 1000; visSince = document.hidden ? 0 : now; }
      else if (add === 0) return; /* hidden and idle: not "playing" */
      var meta = store.json("arcade_meta_v1") || {};
      var g = meta[GAME_ID] || (meta[GAME_ID] = { secs: 0 });
      g.secs = Math.round((g.secs || 0) + add);
      g.last = now;
      store.set("arcade_meta_v1", JSON.stringify(meta));
    };
    metaFlush();
    setInterval(metaFlush, 15000);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { metaFlush(); visSince = 0; }
      else visSince = Date.now();
    });
    window.addEventListener("pagehide", metaFlush);
  }

  /* ---- settings panel: gear chip on the right edge; Escape closes.
     Master volume and motion apply to every game through the shared
     runtime, so this is the same panel with the same behaviour everywhere. */
  var panel = null, chip = null;
  function settingsOpen() { return !!(panel && panel.style.display !== "none"); }
  function motionLabel() {
    var o = store.get("arcade_rm");
    return o === "on" ? "MOTION: REDUCED" : o === "off" ? "MOTION: FULL" : "MOTION: AUTO";
  }
  function buildPanel() {
    if (panel) return;
    panel = document.createElement("div");
    panel.id = "arcade-settings";
    panel.style.cssText =
      "position:fixed;inset:0;z-index:16000;display:none;" +
      "background:rgba(4,6,12,.55);user-select:none;-webkit-user-select:none";
    var card = document.createElement("div");
    card.style.cssText =
      "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);" +
      "min-width:260px;padding:22px 26px;border-radius:14px;" +
      "background:rgba(14,17,30,.96);border:1px solid rgba(140,160,210,.4);" +
      "color:#e8ecf8;font:13px/1.5 system-ui,sans-serif";
    card.innerHTML =
      '<div style="font:700 13px/1 system-ui;letter-spacing:3px;margin-bottom:16px">ARCADE SETTINGS</div>' +
      '<label style="font-size:11px;letter-spacing:2px;color:#8b94b0">MASTER VOLUME</label><br>' +
      '<input id="arc-set-vol" type="range" min="0" max="100" style="width:100%;margin:6px 0 14px">' +
      '<button id="arc-set-mute" style="' + btnCss() + '"></button> ' +
      '<button id="arc-set-rm" style="' + btnCss() + '"></button>' +
      '<div style="font-size:11px;color:#8b94b0;margin-top:14px">Applies to every game. ' +
      'Per-game volume controls still work underneath.<br>Esc closes.</div>';
    panel.appendChild(card);
    panel.addEventListener("pointerdown", function (e) { if (e.target === panel) toggleSettings(false); });
    (document.body || document.documentElement).appendChild(panel);

    var vol = card.querySelector("#arc-set-vol");
    var mute = card.querySelector("#arc-set-mute");
    var rm = card.querySelector("#arc-set-rm");
    function syncUI() {
      var v = parseFloat(store.get("arcade_master"));
      vol.value = Math.round((isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1) * 100);
      mute.textContent = store.get("arcade_master_muted") === "1" ? "UNMUTE" : "MUTE";
      rm.textContent = motionLabel();
    }
    vol.addEventListener("input", function () {
      store.set("arcade_master", vol.value / 100);
      store.set("arcade_master_muted", "0");
      applyMaster(); syncUI();
    });
    mute.addEventListener("click", function () {
      store.set("arcade_master_muted", store.get("arcade_master_muted") === "1" ? "0" : "1");
      applyMaster(); syncUI();
    });
    rm.addEventListener("click", function () {
      var o = store.get("arcade_rm");
      store.set("arcade_rm", o === "on" ? "off" : o === "off" ? "auto" : "on");
      syncRMStyle(); syncUI();
    });
    panel.syncUI = syncUI;
  }
  function btnCss() {
    return "font:700 11px/1 system-ui;letter-spacing:2px;color:#cfd8ea;cursor:pointer;" +
      "background:rgba(140,160,210,.12);border:1px solid rgba(140,160,210,.4);" +
      "padding:8px 12px;border-radius:999px";
  }
  function toggleSettings(show) {
    buildPanel();
    var to = show != null ? show : !settingsOpen();
    panel.style.display = to ? "block" : "none";
    if (to) panel.syncUI();
  }
  function mountChip() {
    if (chip || !document.body) return;
    chip = document.createElement("div");
    chip.id = "arcade-settings-chip";
    chip.title = "Arcade settings";
    chip.textContent = "⚙";
    chip.style.cssText =
      "position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:15990;" +
      "width:30px;height:30px;border-radius:50%;display:flex;align-items:center;" +
      "justify-content:center;cursor:pointer;font-size:15px;color:#cfd8ea;" +
      "background:rgba(10,12,20,.6);border:1px solid rgba(140,160,210,.35);" +
      "opacity:.4;transition:opacity .15s;user-select:none;-webkit-user-select:none";
    chip.addEventListener("mouseenter", function () { chip.style.opacity = "1"; });
    chip.addEventListener("mouseleave", function () { chip.style.opacity = ".4"; });
    chip.addEventListener("click", function () { toggleSettings(); });
    document.body.appendChild(chip);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountChip);
  } else {
    mountChip();
  }
  /* capture-phase: while the panel is open, keys belong to the panel */
  window.addEventListener("keydown", function (e) {
    if (!settingsOpen()) return;
    if (e.key === "Escape") toggleSettings(false);
    e.stopImmediatePropagation();
    e.preventDefault();
  }, true);
  window.addEventListener("keyup", function (e) {
    if (settingsOpen()) e.stopImmediatePropagation();
  }, true);

  window.arcade = {
    store: store,
    reducedMotion: reducedMotion,
    settings: { open: function () { toggleSettings(true); }, close: function () { toggleSettings(false); } },
    /* clamp a rAF delta so a backgrounded tab doesn't produce a huge step */
    clampDt: function (dt, max) { return Math.min(Math.max(dt, 0), max || 0.1); },
    /* daily-challenge helpers: one date key and one seed, stable all day,
       shared by every game so "today's run" means the same thing everywhere */
    dailyKey: function () {
      var d = new Date(), m = d.getMonth() + 1, da = d.getDate();
      return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (da < 10 ? "0" : "") + da;
    },
    dailySeed: function () {
      var d = new Date();
      return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    },
    /* mulberry32: tiny deterministic PRNG for seeded runs */
    seededRand: function (seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    touch: {
      available: touchOn,
      sendKey: sendKey,
      button: touchButton,
      key: keyButton,
      dpad: dpad,
      arrowDpad: arrowDpad,
      stick: stick
    },
    /* Run recorder — shared by the ghost racer and replay trophies.

       A game calls start()/sample()/finish() and gets both a local ghost and,
       when the arcade server happens to be serving the page, a shared one.
       Every server call is best-effort: these games are static files that must
       keep working opened straight off the disk, so a failed fetch is silently
       ignored rather than surfaced. */
    run: (function () {
      var RATE_MS = 100;            // 10 Hz is plenty to interpolate a ghost
      var MAX_FRAMES = 4000;        // ~6.5 minutes; matches the server cap
      var cur = null;

      function localKey(game) { return 'arcade_ghost_' + game; }

      function post(path, body) {
        try {
          return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' },
                               body: JSON.stringify(body) })
            .then(function (r) { return r.json(); })
            .catch(function () { return null; });
        } catch (e) { return Promise.resolve(null); }
      }

      return {
        start: function (game, seed) {
          cur = { game: game, seed: seed === undefined ? null : seed, frames: [], last: -1e9 };
        },
        /* Call every frame; it throttles itself. Pass the few numbers needed to
           redraw the ghost — position, lane, whatever the game interpolates. */
        sample: function (t) {
          if (!cur || cur.frames.length >= MAX_FRAMES) return;
          if (t - cur.last < RATE_MS / 1000) return;
          cur.last = t;
          cur.frames.push(Array.prototype.slice.call(arguments, 1).map(function (v) {
            return Math.round((Number(v) || 0) * 100) / 100;   // 2dp keeps ghosts small
          }));
        },
        recording: function () { return !!cur; },
        /* Keep the run if it beat the stored ghost, and offer it to the server. */
        finish: function (score, name) {
          if (!cur || !cur.frames.length) { cur = null; return Promise.resolve(null); }
          var ghost = { game: cur.game, seed: cur.seed, frames: cur.frames,
                        score: Number(score) || 0,
                        name: name || localStorage.getItem('arcade_name_v1') || 'player' };
          cur = null;
          try {
            var prevRaw = localStorage.getItem(localKey(ghost.game));
            var prev = prevRaw ? JSON.parse(prevRaw) : null;
            if (!prev || ghost.score > prev.score) {
              localStorage.setItem(localKey(ghost.game), JSON.stringify(ghost));
            }
          } catch (e) { /* quota or bad JSON — the server copy still matters */ }
          return post('/api/ghost', ghost);
        },
        discard: function () { cur = null; },
        /* Best available ghost: the server's if reachable, else the local one. */
        best: function (game) {
          var local = null;
          try {
            var raw = localStorage.getItem(localKey(game));
            if (raw) local = JSON.parse(raw);
          } catch (e) {}
          try {
            return fetch('/api/ghosts?game=' + encodeURIComponent(game))
              .then(function (r) { return r.json(); })
              .then(function (d) {
                var remote = d && d.list && d.list[0];
                if (remote && (!local || remote.score > local.score)) return remote;
                return local;
              })
              .catch(function () { return local; });
          } catch (e) { return Promise.resolve(local); }
        },
        /* Read a ghost at an arbitrary time, interpolating between samples. */
        at: function (ghost, t) {
          if (!ghost || !ghost.frames || !ghost.frames.length) return null;
          var f = ghost.frames, i = Math.floor(t / (RATE_MS / 1000));
          if (i >= f.length - 1) return f[f.length - 1];
          if (i < 0) return f[0];
          var a = f[i], b = f[i + 1], k = (t / (RATE_MS / 1000)) - i, out = [];
          for (var j = 0; j < a.length; j++) out.push(a[j] + (b[j] - a[j]) * k);
          return out;
        }
      };
    })()
  };
})();
</script>
<!-- arcade-shared:end -->
<script>
'use strict';
/* ARTILLERY DUEL - turn-based artillery vs an adaptive AI or a hot-seat human.
   Destructible terrain, wind, five weapons, shields, between-round shop. */

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W = 0, H = 0;

var GRAV = 300;          // px / s^2
var WINDF = 9;           // wind accel multiplier
var SPEEDK = 8.5;        // power -> launch speed

var ground = null;       // Float32Array of surface y per x column
var stars = [];

var state = 'title';     // title | aim | fly | aiThink | victory | defeat | roundend | matchwin | shop
var mode = 'ai';         // 'ai' | '2p'
var turn = 0;            // 0 = left tank, 1 = right tank / cpu
var wind = 0;
var endT = 0;            // post-impact settle timer
var thinkT = 0;
var paused = false;
var gt = 0;              // global time (shield shimmer)

var streak = 0, best = 0;
try { best = parseInt(localStorage.getItem('art_streak'), 10) || 0; } catch (e) {}
function saveBest() {
  try { localStorage.setItem('art_streak', String(best)); } catch (e) {}
}

var WEAPONS = [
  { name: 'SHELL',   radius: 30, dmg: 34, key: '1' },
  { name: 'HEAVY',   radius: 50, dmg: 60, key: '2' },
  { name: 'CLUSTER', radius: 17, dmg: 15, key: '3' },
  { name: 'NAPALM',  radius: 26, dmg: 18, key: '4' },
  { name: 'DIGGER',  radius: 16, dmg: 22, key: '5' }
];
var SHOP = [
  { label: 'HEAVY SHELL ',  w: 1, price: 60 },
  { label: 'CLUSTER BOMB',  w: 2, price: 50 },
  { label: 'NAPALM      ',  w: 3, price: 80 },
  { label: 'DIGGER      ',  w: 4, price: 60 },
  { label: 'SHIELD 40HP ',  shield: true, price: 100 }

  var n = AC.createBufferSource(), ng = AC.createGain(), f = AC.createBiquadFilter();

  f.type = 'lowpass'; f.frequency.value = 1400;

}

/* ---------------- terrain ---------------- */
function genTerrain() {
  ground = new Float32Array(W);
  var base = H * rnd(0.58, 0.68);
  var n = 5, amp = [], frq = [], ph = [];
  for (var k = 0; k < n; k++) {
    amp.push(H * 0.16 / (k + 1));
    frq.push(rnd(0.8, 1.6) * (k + 1) * Math.PI * 2 / W);
    ph.push(rnd(0, Math.PI * 2));
  }
  for (var x = 0; x < W; x++) {
    var y = base;
    for (k = 0; k < n; k++) y += amp[k] * Math.sin(x * frq[k] + ph[k]);
    ground[x] = clamp(y, H * 0.30, H * 0.92);
  }
  // visual dressing: time of day, stars, clouds
  tod = TODS[Math.floor(Math.random() * TODS.length)];
  skyKey = '';
  stars = [];
  for (var s = 0; s < 120; s++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.55, r: rnd(0.4, 1.4), a: rnd(0.3, 0.9), tw: rnd(0, 6.28), ts: rnd(1, 3) });
  }
  clouds = [];
  var nc = 4 + Math.floor(Math.random() * 3);
  for (var c = 0; c < nc; c++) {
    var puffs = [], np = 4 + Math.floor(Math.random() * 4), bw = rnd(50, 110);
    for (var p = 0; p < np; p++) {
      puffs.push({ dx: rnd(-bw, bw), dy: rnd(-12, 10), r: rnd(16, 34) });
    }
    clouds.push({ x: Math.random() * W, y: H * rnd(0.06, 0.3), puffs: puffs, a: rnd(0.5, 0.95), spd: rnd(-3, 3) });
  }
  birds = [];
  birdT = rnd(6, 16);
  scorches = [];
  terrainDirty = true;
}
function crater(cx, cy, r) {
  var x0 = Math.max(0, Math.floor(cx - r));
  var x1 = Math.min(W - 1, Math.ceil(cx + r));
  for (var x = x0; x <= x1; x++) {
    var dx = x - cx;
    var hh = Math.sqrt(Math.max(0, r * r - dx * dx));
    var top = cy - hh, bot = cy + hh;
    if (ground[x] > top && ground[x] < bot) ground[x] = Math.min(bot, H - 2);
  }
  addScorch(cx, cy, r * 1.25);
  terrainDirty = true;
}
function addScorch(x, y, r) {
  scorches.push({ x: x, y: y, r: r, born: gt, baked: false });
  if (scorches.length > 70) scorches.splice(0, scorches.length - 70);
  terrainDirty = true;
}
function napalmCarve(cx, cy, owner) {
  var hw = 60;
  for (var dx = -hw; dx <= hw; dx++) {
    var x = Math.round(cx) + dx;
    if (x < 0 || x >= W) continue;
    var depth = 11 * Math.sqrt(Math.max(0, 1 - (dx / hw) * (dx / hw)));
    ground[x] = Math.min(H - 2, ground[x] + depth);
  }
  for (dx = -hw + 4; dx <= hw - 4; dx += 7) {
    var fx = Math.round(cx) + dx;
    if (fx < 1 || fx >= W - 1) continue;
    fires.push({ x: fx, life: rnd(3.5, 6.5), owner: owner });
  }
  addScorch(cx, cy + 6, hw * 0.9);
  terrainDirty = true;
}
function diggerShaft(cx, cy) {
  var hw = 8;
  for (var dx = -hw; dx <= hw; dx++) {
    var x = Math.round(cx) + dx;
    if (x < 0 || x >= W) continue;
    var prof = Math.cos(dx / hw * Math.PI / 2);
    var bot = Math.min(H - 2, Math.max(ground[x], cy) + 130 * prof);
    if (ground[x] < bot) ground[x] = bot;
  }
  addScorch(cx, cy + 60, 26);
  terrainDirty = true;
}
function updateFires(dt, dot) {
  for (var i = fires.length - 1; i >= 0; i--) {
    fires[i].life -= dt;
    if (fires[i].life <= 0) fires.splice(i, 1);
  }
  if (!dot || !player || !fires.length) return;
  var tanks = [player, cpu];
  for (var ti = 0; ti < 2; ti++) {
    var t = tanks[ti];
    if (!t.alive) continue;
    for (i = 0; i < fires.length; i++) {
      var f = fires[i];
      if (Math.abs(t.x - f.x) < 9 && Math.abs(groundAt(f.x) - (t.y + 7)) < 24) {
        applyDamage(t, 13 * dt, f.owner);
        if (Math.random() < dt * 10) {

            x: t.x + rnd(-8, 8), y: t.y - rnd(0, 8),

}

/* ---------------- tanks ---------------- */
function mkTank(x, pid, isCpu) {
  return {
    x: x, y: groundAt(x) - 7, hp: 100, cpu: isCpu, pid: pid, shield: 0,
    angle: pid === 1 ? 135 : 55, power: pid === 1 ? 60 : 62,
    falling: false, vy: 0, fallFrom: 0, alive: true, flash: 0,
    recoil: 0, bounce: 0, smokeT: 0
  };
}
function applyDamage(t, dmg, owner) {
  if (dmg <= 0 || !t.alive) return;
  if (typeof owner === 'number' && owner !== t.pid) dealt[owner] += dmg;
  if (t.shield > 0) {
    var ab = Math.min(t.shield, dmg);
    t.shield -= ab;
    dmg -= ab;
    t.flash = Math.max(t.flash, 0.35);
    if (dmg <= 0) return;
  }
  t.hp -= dmg;
  t.flash = 0.5;
}
function settleTank(t, dt) {
  if (!t.alive) return;
  var gy = groundAt(t.x) - 7;
  if (!t.falling && t.y < gy - 2) {
    t.falling = true; t.vy = 0; t.fallFrom = t.y;
  }
  if (t.falling) {
    t.vy += GRAV * dt;
    t.y += t.vy * dt;
    if (t.y >= gy) {
      t.y = gy;
      t.falling = false;
      var fall = t.y - t.fallFrom;
      if (fall > 55) {
        var dmg = Math.round((fall - 55) * 0.3);
        if (dmg > 0) {
          applyDamage(t, dmg);
          flash(tName(t) + ' TOOK ' + dmg + ' FALL DAMAGE');
          spawnDirt(t.x, t.y + 6, 10, 2);
        }
      }
    }
  } else {
    t.y = Math.min(t.y, gy);
    if (t.y < gy) t.y = gy;
  }
  if (t.hp <= 0 && t.alive) {
    t.alive = false; t.hp = 0;
    spawnDirt(t.x, t.y, 50, 5);
    // turret pop + fireball (graphics)
    fxs.push({ type: 'turret', x: t.x, y: t.y - 10, vx: rnd(-40, 40), vy: -rnd(190, 260), rot: 0, vr: rnd(-7, 7), t: 0, dur: 2.2, pid: t.pid });
    fxs.push({ type: 'boom', x: t.x, y: t.y - 4, r: 46, t: 0, dur: 0.8 });
    addScorch(t.x, t.y + 4, 30);
    shake = Math.min(shake + 22, 30);
    sExplode(60);
  }
}

function finishBattle() {

  earned = [Math.round(dealt[0] * 2), Math.round(dealt[1] * 2)];
  if (w >= 0) earned[w] += 120;
  pers[0].cash += earned[0];
  pers[1].cash += earned[1];
  roundWinner = w;
  if (mode === 'ai') {
    if (w === 0) {
      streak++;
      if (streak > best) { best = streak; saveBest(); }
      state = 'victory';
    } else {
      if (streak > best) { best = streak; saveBest(); }
      state = 'defeat';
    }
  } else {

  newWind();

/* ---------------- firing / projectiles ---------------- */
function fire(t, weapon) {
  var a = t.angle * Math.PI / 180;
  var sp = t.power * SPEEDK;
  var bx = t.x + Math.cos(a) * 24;
  var by = t.y - 6 - Math.sin(a) * 24;
  projs.push({
    x: bx, y: by,
    vx: Math.cos(a) * sp, vy: -Math.sin(a) * sp,
    type: weapon, owner: t.cpu ? 1 : 0,
    split: false, whis: null, tAcc: 0, spin: rnd(0, 6.28)
  });
  t.recoil = 1;
  t.bounce = 1;
  fxs.push({ type: 'muzzle', x: bx, y: by, a: a, t: 0, dur: 0.14 });
  sFire();
  shake = Math.min(shake + 3, 8);
  state = 'fly';
  endT = 0.55;
}
function humanFire(t) {
  var P = pers[t.pid];
  if (P.inv[P.wsel] <= 0) { flash('OUT OF ' + WEAPONS[P.wsel].name + ' AMMO'); return; }
  if (P.inv[P.wsel] !== Infinity) P.inv[P.wsel]--;
  fire(t, P.wsel);
}
function explode(x, y, wIdx, owner) {
  var w = WEAPONS[wIdx];
  if (wIdx === 3) napalmCarve(x, y, owner);
  else if (wIdx === 4) diggerShaft(x, y);
  else crater(x, y, w.radius);
  var reach = w.radius * 1.9;
  var tanks = [player, cpu];
  for (var i = 0; i < 2; i++) {
    var t = tanks[i];
    if (!t.alive) continue;
    var d = Math.hypot(t.x - x, t.y - y);
    if (d < reach) {
      var dmg = Math.round(w.dmg * (1 - d / reach));
      if (d < 14) dmg = Math.round(dmg * 1.2);
      applyDamage(t, dmg, owner);
    }
  }
  if (owner === 1 && ai.impactX === null) ai.impactX = x;
  spawnDirt(x, y, Math.round(w.radius * 1.2), w.radius / 12);
  fxs.push({ type: 'boom', x: x, y: y, r: w.radius, t: 0, dur: 0.45 + w.radius * 0.006 });
  spawnSmoke(x, y - 4, Math.round(w.radius / 5) + 3, w.radius);
  shake = Math.min(shake + w.radius * 0.45, 26);
  sExplode(w.radius);
}
function updateProjs(dt) {
  for (var i = projs.length - 1; i >= 0; i--) {
    var p = projs[i];
    // cluster split at apex
    if (p.type === 2 && !p.split && p.vy >= 0) {
      p.split = true;
      whistleStop(p);
      for (var b = 0; b < 5; b++) {
        projs.push({
          x: p.x, y: p.y,
          vx: p.vx + (b - 2) * 36 + rnd(-8, 8),
          vy: p.vy - rnd(10, 50),
          type: 2, owner: p.owner, split: true, bomblet: true, whis: null, tAcc: 0
        });
      }
      projs.splice(i, 1);
      continue;
    }
    var sub = 3, h = dt / sub, dead = false;
    for (var s = 0; s < sub && !dead; s++) {
      p.vx += wind * WINDF * h;
      p.vy += GRAV * h;
      p.x += p.vx * h;
      p.y += p.vy * h;
      // tank direct hits
      var tanks = [player, cpu];
      for (var ti = 0; ti < 2; ti++) {
        var t = tanks[ti];
        if (t.alive && Math.hypot(p.x - t.x, p.y - (t.y - 4)) < 14) {
          explode(p.x, p.y, p.type, p.owner);
          dead = true;
          break;
        }
      }
      if (dead) break;
      // terrain
      if (p.x >= 0 && p.x < W && p.y >= groundAt(p.x)) {
        explode(p.x, groundAt(p.x), p.type, p.owner);
        dead = true;
      } else if (p.y > H + 60) {
        if (p.owner === 1 && ai.impactX === null) ai.impactX = clamp(p.x, -200, W + 200);
        dead = true;
      } else if (p.x < -80 || p.x > W + 80) {
        if (p.owner === 1 && ai.impactX === null) ai.impactX = clamp(p.x, -200, W + 200);
        dead = true;
      }
    }
    // whistle on descent
    if (!dead && p.vy > 60 && !p.bomblet) whistleStart(p);
    if (p.whis) {
      try { p.whis.frequency.value = clamp(1500 - p.vy * 0.9, 350, 1500); } catch (e) {}
    }
    // trail + per-weapon flair (graphics only)
    p.spin = (p.spin || 0) + dt * (p.type === 3 ? 9 : 4);
    p.tAcc += dt;
    if (p.tAcc > 0.024) {
      p.tAcc = 0;
      if (p.type === 3) {
        // napalm: licking flame trail
        trails.push({ x: p.x + rnd(-2, 2), y: p.y + rnd(-2, 2), a: 0.95, c: Math.random() < 0.5 ? '#ff8a2d' : '#ffd96a', r: rnd(2, 4.5), fl: true });
        if (Math.random() < 0.4) {
          parts.push({ x: p.x, y: p.y, vx: rnd(-15, 15) - p.vx * 0.04, vy: rnd(-30, 5), life: rnd(0.25, 0.6), c: '#ff6a1d', r: rnd(1, 2.4), grav: -0.25, windy: 1 });
        }
      } else if (p.type === 4) {
        // digger: drill sparks
        trails.push({ x: p.x, y: p.y, a: 0.8, c: '#c9a0e8', r: 1.6 });
        parts.push({ x: p.x, y: p.y, vx: rnd(-60, 60), vy: rnd(-60, 60), life: rnd(0.12, 0.3), c: Math.random() < 0.5 ? '#ffe9b0' : '#ffb15e', r: rnd(0.8, 1.6) });
      } else if (p.bomblet) {
        trails.push({ x: p.x, y: p.y, a: 0.6, c: '#bfe8a8', r: 1.3 });
      } else {
        // shell / heavy: hot tracer
        trails.push({ x: p.x, y: p.y, a: 0.95, c: p.type === 1 ? '#ffc37a' : '#ffe9b0', r: p.type === 1 ? 2.6 : 1.9 });

}

/* ---------------- particles ---------------- */
function spawnDirt(x, y, n, pow) {
  for (var i = 0; i < n; i++) {
    var a = rnd(Math.PI * 1.05, Math.PI * 1.95);
    var sp = rnd(40, 160) * (0.6 + pow * 0.15);
    parts.push({
      x: x + rnd(-4, 4), y: y + rnd(-4, 4),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rnd(0.5, 1.3),
      c: Math.random() < 0.3 ? '#d8a04a' : (Math.random() < 0.5 ? '#8a6b4a' : '#5e4a34'),
      r: rnd(1, 3.2)
    });
  }
}
function spawnSmoke(x, y, n, r) {
  for (var i = 0; i < n; i++) {
    parts.push({
      x: x + rnd(-r * 0.3, r * 0.3), y: y + rnd(-r * 0.2, r * 0.1),
      vx: rnd(-14, 14), vy: -rnd(18, 46),
      life: rnd(1.2, 2.6), maxLife: 2.6,
      c: Math.random() < 0.5 ? 'rgba(70,66,62,' : 'rgba(44,42,40,',
      r: rnd(4, 9), smoke: true, grav: -0.06, windy: 1
    });
  }
}
function updateParts(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.vy += GRAV * dt * (p.grav === undefined ? 1 : p.grav);
    if (p.windy) p.vx += wind * WINDF * 0.6 * dt;
    if (p.smoke) p.r += dt * 5;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0 || p.y > H + 20) parts.splice(i, 1);
  }
  for (i = trails.length - 1; i >= 0; i--) {
    trails[i].a -= dt * (trails[i].fl ? 1.8 : 0.9);
    if (trails[i].a <= 0) trails.splice(i, 1);
  }
}
function updateFx(dt) {
  for (var i = fxs.length - 1; i >= 0; i--) {
    var f = fxs[i];
    f.t += dt;
    if (f.type === 'turret') {
      f.vy += GRAV * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.rot += f.vr * dt;
      if (f.y > groundAt(f.x) - 2) { f.y = groundAt(f.x) - 2; f.vy = 0; f.vx *= 0.6; f.vr *= 0.5; }
    }
    if (f.t >= f.dur) fxs.splice(i, 1);
  }
}

/* ---------------- AI ---------------- */
function aiPlan() {
  var diff = Math.min(streak, 7);              // ramps with your streak
  var d = cpu.x - player.x;
  if (ai.shots === 0) {
    // ballistic estimate at ~45 deg, crude wind compensation
    var v = Math.sqrt(Math.max(d, 100) * GRAV);
    ai.power = clamp(v / SPEEDK + wind * 0.9 + rnd(-9 + diff, 9 - diff), 25, 100);
  } else if (ai.impactX !== null) {
    var miss = ai.impactX - player.x;          // >0 means fell short (right of player)
    ai.lastMiss = miss;
    var k = 0.026 + diff * 0.005;              // faster convergence at higher streak
    var noise = rnd(-1, 1) * Math.max(1.2, 7 - diff);
    ai.power = clamp(ai.power + miss * k + wind * 0.25 + noise, 22, 100);
    ai.angle = clamp(ai.angle + rnd(-1.5, 1.5), 120, 150);
  }
  ai.impactX = null;
  ai.weapon = 0;
  if (ai.lastMiss !== null && Math.abs(ai.lastMiss) < 30 && ai.heavy > 0 && streak >= 2) {
    ai.weapon = 1;
    ai.heavy--;
  }
  cpu.power = ai.power;
  ai.targetAngle = ai.angle;
}
function aiUpdate(dt) {
  cpu.angle = lerp(cpu.angle, ai.targetAngle, 1 - Math.pow(0.02, dt));
  thinkT -= dt;
  if (thinkT <= 0) {
    cpu.angle = ai.targetAngle;
    ai.shots++;
    fire(cpu, ai.weapon);
  }
}

/* ---------------- update ---------------- */
function update(dt) {
  gt += dt;
  if (msgT > 0) msgT -= dt;
  if (paused) return;
  if (shake > 0) shake = Math.max(0, shake - dt * 34);
  if (player) { settleTank(player, dt); settleTank(cpu, dt); }
  if (player && player.flash > 0) player.flash -= dt;
  if (cpu && cpu.flash > 0) cpu.flash -= dt;
  updateScenery(dt);
  updateParts(dt);
  updateFx(dt);
  updateFires(dt, state === 'aim' || state === 'fly' || state === 'aiThink');
  if ((state === 'aim' || state === 'aiThink') && player && (!player.alive || !cpu.alive)) {
    finishBattle();
    return;
  }

  if (state === 'aiThink') aiUpdate(dt);

  if (state === 'fly') {
    updateProjs(dt);
    // camera pan to follow high shells
    var minY = H;
    for (var i = 0; i < projs.length; i++) minY = Math.min(minY, projs[i].y);
    camYT = (projs.length && minY < H * 0.22) ? clamp(H * 0.22 - minY, 0, H * 0.8) : 0;
    if (projs.length === 0 && !player.falling && !cpu.falling) {
      endT -= dt;
      if (endT <= 0) endTurn();
    } else {
      endT = 0.55;
    }
  } else {
    camYT = 0;
  }
  camY = lerp(camY, camYT, 1 - Math.pow(0.004, dt));
}

/* ---------------- scenery (graphics only) ---------------- */
function updateScenery(dt) {
  // clouds drift with the wind as a visual cue
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    c.x += (wind * 4 + c.spd) * dt;
    if (c.x < -180) c.x = W + 170;
    if (c.x > W + 180) c.x = -170;
  }
  // birds cross occasionally (not at night)
  birdT -= dt;
  if (birdT <= 0 && tod !== 'night' && birds.length === 0) {
    birdT = rnd(10, 26);
    var fromL = Math.random() < 0.5;
    var n = 2 + Math.floor(Math.random() * 4);
    var by = H * rnd(0.08, 0.26), bv = rnd(34, 55) * (fromL ? 1 : -1);
    for (var b = 0; b < n; b++) {
      birds.push({ x: (fromL ? -20 : W + 20) - b * 16 * (fromL ? 1 : -1), y: by + rnd(-14, 14), vx: bv, ph: rnd(0, 6.28) });
    }
  }
  for (i = birds.length - 1; i >= 0; i--) {
    birds[i].x += birds[i].vx * dt;
    birds[i].ph += dt * 9;
    if (birds[i].x < -60 || birds[i].x > W + 60) birds.splice(i, 1);
  }
  // tank recoil / bounce decay, damage smoke + flames
  var tanks = player ? [player, cpu] : [];
  for (i = 0; i < tanks.length; i++) {
    var t = tanks[i];
    if (t.recoil > 0) t.recoil = Math.max(0, t.recoil - dt * 4.5);
    if (t.bounce > 0) t.bounce = Math.max(0, t.bounce - dt * 3.2);
    t.smokeT -= dt;
    if (t.smokeT <= 0) {
      if (!t.alive) {
        // burning wreck
        t.smokeT = rnd(0.05, 0.12);
        spawnSmoke(t.x + rnd(-8, 8), t.y - 8, 1, 10);
        if (Math.random() < 0.7) {
          parts.push({ x: t.x + rnd(-10, 10), y: t.y - rnd(0, 6), vx: rnd(-10, 10), vy: -rnd(25, 70), life: rnd(0.25, 0.6), c: Math.random() < 0.5 ? '#ff8a2d' : '#ffd96a', r: rnd(1.4, 3), grav: -0.3, windy: 1 });
        }
      } else if (t.hp < 30) {
        // smoke column + flames below 30% HP
        t.smokeT = rnd(0.08, 0.2);
        spawnSmoke(t.x + rnd(-5, 5), t.y - 10, 1, 7);
        if (Math.random() < 0.45) {
          parts.push({ x: t.x + rnd(-7, 7), y: t.y - rnd(2, 8), vx: rnd(-8, 8), vy: -rnd(20, 55), life: rnd(0.2, 0.5), c: '#ff9a3d', r: rnd(1, 2.4), grav: -0.3, windy: 1 });
        }
      } else {
        t.smokeT = 0.1;
      }
    }
  }
  // ground-fire embers
  for (i = 0; i < fires.length; i++) {
    if (Math.random() < dt * 2.2) {
      var f = fires[i];
      parts.push({ x: f.x + rnd(-3, 3), y: groundAt(f.x) - rnd(2, 10), vx: rnd(-8, 8), vy: -rnd(25, 60), life: rnd(0.5, 1.4), c: Math.random() < 0.6 ? '#ffb15e' : '#ff6a1d', r: rnd(0.8, 1.8), grav: -0.25, windy: 1 });
    }
  }
  // bake fully cooled scorch glows into the terrain cache
  for (i = scorches.length - 1; i >= 0; i--) {
    if (!scorches[i].baked && gt - scorches[i].born > 6) scorches[i].baked = true;
  }
}

/* ---------------- drawing ---------------- */
function glowSprite(color, r) {
  var key = color + r;
  if (glowCache[key]) return glowCache[key];
  var c = document.createElement('canvas');
  c.width = c.height = r * 2;
  var x = c.getContext('2d');
  var g = x.createRadialGradient(r, r, 0, r, r, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, r * 2, r * 2);
  glowCache[key] = c;
  return c;
}
function drawSky() {
  var P = PAL[tod];
  var key = tod + ':' + W + 'x' + H;
  if (skyKey !== key) {
    skyKey = key;
    skyG = ctx.createLinearGradient(0, 0, 0, H);
    skyG.addColorStop(0, P.sky[0]);
    skyG.addColorStop(0.4, P.sky[1]);
    skyG.addColorStop(0.75, P.sky[2]);
    skyG.addColorStop(1, P.sky[3]);
  }
  ctx.fillStyle = skyG;
  ctx.fillRect(0, 0, W, H);
  // stars (twinkle), weighted by palette
  if (P.stars > 0) {
    ctx.fillStyle = '#e8ecf6';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.a * P.stars * (0.6 + 0.4 * Math.sin(gt * s.ts + s.tw));
      ctx.fillRect(s.x, s.y + camY * 0.3, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }
  // sun / moon
  if (P.moon) {
    var mx = W * 0.78, my = H * 0.16 + camY * 0.3;
    ctx.drawImage(glowSprite('rgba(200,215,255,0.28)', 60), mx - 60, my - 60);
    ctx.fillStyle = '#e8ecf2';
    ctx.beginPath(); ctx.arc(mx, my, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(165,178,200,0.55)';
    ctx.beginPath(); ctx.arc(mx - 7, my - 4, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 6, my + 7, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 4, my - 9, 2.2, 0, Math.PI * 2); ctx.fill();
  } else if (P.sun) {
    var sx2 = W * P.sunX, sy2 = H * P.sunY + camY * 0.3;
    ctx.drawImage(glowSprite(P.sun === '#fff6d8' ? 'rgba(255,246,216,0.5)' : 'rgba(255,170,90,0.45)', 90), sx2 - 90, sy2 - 90);
    ctx.fillStyle = P.sun;
    ctx.beginPath(); ctx.arc(sx2, sy2, tod === 'noon' ? 20 : 26, 0, Math.PI * 2); ctx.fill();

}
function drawClouds(P) {
  for (var i = 0; i < clouds.length; i++) {

    ctx.globalAlpha = c.a;
    ctx.fillStyle = P.cloud;
    for (var j = 0; j < c.puffs.length; j++) {
      var p = c.puffs[j];

function drawBirds() {

  t.beginPath();
  t.moveTo(0, ground[0]);
  for (x = 0; x < W; x += 2) t.lineTo(x, ground[x]);

  t.strokeStyle = P.grassHi;

  ctx.font = '700 11px ' + F_STEN;
  ctx.fillStyle = '#8fd8ff';
  if (player.shield > 0) {
    ctx.textAlign = 'left';
    ctx.fillText('SHIELD ' + Math.ceil(player.shield), 20, 56);
  }
  if (cpu.shield > 0) {
    ctx.textAlign = 'right';
    ctx.fillText('SHIELD ' + Math.ceil(cpu.shield), W - 20, 56);
  }

  // wind sock, top center
  var cx0 = W / 2;
  drawWindSock(cx0, 2);

  // artillery dial gauge, bottom center (active human tank)
  var cur = (mode === '2p') ? activeTank() : player;
  var P = pers[cur.pid];
  drawDial(cx0, H - 26, cur);
  var wname = WEAPONS[P.wsel].name;
  var am = P.inv[P.wsel] === Infinity ? '--' : ('x' + P.inv[P.wsel]);
  ctx.textAlign = 'center';
  ctx.font = '700 12px ' + F_STEN;
  ctx.fillStyle = '#ffe9b0';
  ctx.fillText('[ ' + wname + ' ' + am + ' ]', cx0, H - 80);
  ctx.font = '9px ' + F_STEN;
  ctx.fillStyle = 'rgba(216,221,200,.55)';
  ctx.fillText('ARROWS AIM - SPACE FIRE - TAB/1-5 WEAPON - P PAUSE - M MUTE', cx0, H - 8);

  // streak (AI mode) / match score (2P), bottom right (hub link lives bottom-left)
  ctx.textAlign = 'right';
  ctx.font = '700 12px ' + F_STEN;
  ctx.fillStyle = '#d8ddc8';
  if (mode === '2p') {
    ctx.fillText('P1 ' + wins[0] + ' - ' + wins[1] + ' P2   FIRST TO 3', W - 16, H - 18);
  } else {
    ctx.fillText('STREAK ' + streak + '   BEST ' + best, W - 16, H - 18);
  }

  if (mode === 'ai' && (state === 'aiThink' || (state === 'fly' && turn === 1))) {
    ctx.textAlign = 'center';
    ctx.font = '700 13px ' + F_STEN;
    ctx.fillStyle = 'rgba(220,150,140,.85)';
    ctx.fillText('ENEMY TURN', W / 2, 92);
  }
  if (mode === '2p') {
    ctx.textAlign = 'center';
    ctx.font = '700 13px ' + F_STEN;
    ctx.fillStyle = turn === 0 ? 'rgba(140,180,230,.9)' : 'rgba(230,175,100,.9)';
    ctx.fillText('PLAYER ' + (turn + 1) + ' TURN', W / 2, 92);
  }
}
function panel(lines, title) {
  ctx.fillStyle = 'rgba(8,10,8,.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  // stencil-style title with flanking bars
  ctx.font = '900 42px ' + F_STEN;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText(title, W / 2 + 3, H * 0.32 + 3);
  ctx.fillStyle = '#e4e0c8';
  ctx.fillText(title, W / 2, H * 0.32);
  var tw = ctx.measureText(title).width;
  ctx.fillStyle = '#b4493d';
  ctx.fillRect(W / 2 - tw / 2 - 70, H * 0.32 - 14, 48, 5);
  ctx.fillRect(W / 2 + tw / 2 + 22, H * 0.32 - 14, 48, 5);
  ctx.font = '13px ' + F_STEN;
  ctx.fillStyle = '#cfd4bc';
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], W / 2, H * 0.32 + 44 + i * 24);
  }
}
function drawTitle() {
  panel([
    'Destroy the enemy tank. Wind shifts every turn.',
    '',
    'ARROW KEYS ....... adjust angle and power (SHIFT = fine)',
    'DRAG FROM TANK ... aim by mouse',
    'SPACE ............ fire    TAB / 1-5 ... weapon',
    'P ................ pause   M ........... mute',
    '',
    'Earn cash from damage dealt. Spend it in the shop',
    'between rounds: shells, napalm, diggers, shields.'
  ], 'ARTILLERY DUEL');
  var bw = 190, bh = 46, gap = 40;
  var x0 = W / 2 - bw - gap / 2;
  var by = H * 0.32 + 44 + 9 * 24 + 14;
  modeBtns = [
    { x: x0, y: by, w: bw, h: bh, m: 'ai', label: '[1] VS AI' },
    { x: x0 + bw + gap, y: by, w: bw, h: bh, m: '2p', label: '[2] VS PLAYER' }
  ];
  for (var i = 0; i < modeBtns.length; i++) {
    var b = modeBtns[i];
    ctx.fillStyle = 'rgba(28,30,22,.94)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = i === 0 ? '#5d8fc4' : '#d99a3d';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w, b.h);
    // stencil corner notches
    ctx.fillStyle = i === 0 ? '#5d8fc4' : '#d99a3d';
    ctx.fillRect(b.x + 3, b.y + 3, 7, 2);
    ctx.fillRect(b.x + 3, b.y + 3, 2, 7);
    ctx.fillRect(b.x + b.w - 10, b.y + b.h - 5, 7, 2);
    ctx.fillRect(b.x + b.w - 5, b.y + b.h - 10, 2, 7);
    ctx.fillStyle = '#e9edf5';
    ctx.textAlign = 'center';
    ctx.font = '700 16px ' + F_STEN;
    ctx.fillText(b.label, b.x + b.w / 2, b.y + bh / 2 + 5);
  }
  ctx.font = '12px ' + F_STEN;
  ctx.fillStyle = 'rgba(216,221,200,.6)';
  ctx.fillText('PRESS 1 OR 2 - SPACE STARTS VS AI', W / 2, by + bh + 26);
}
function drawShop() {
  ctx.fillStyle = 'rgba(8,10,8,.82)';
  ctx.fillRect(0, 0, W, H);
  var P = pers[shopIdx];
  // supply crate panel
  var cw = Math.min(680, W - 60), chh = Math.min(430, H - 80);
  var cx2 = W / 2 - cw / 2, cy2 = H / 2 - chh / 2;
  // planks
  var plank = 34;
  for (var py2 = 0; py2 < chh; py2 += plank) {
    var tone = 0.9 + 0.12 * Math.sin(py2 * 1.7);
    ctx.fillStyle = 'rgb(' + Math.round(104 * tone) + ',' + Math.round(78 * tone) + ',' + Math.round(50 * tone) + ')';
    ctx.fillRect(cx2, cy2 + py2, cw, Math.min(plank - 2, chh - py2));
    // wood grain
    ctx.strokeStyle = 'rgba(60,42,24,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = cx2 + 14; gx < cx2 + cw - 14; gx += 60) {
      ctx.moveTo(gx + (py2 % 50), cy2 + py2 + 6);
      ctx.quadraticCurveTo(gx + 25, cy2 + py2 + plank / 2, gx + (py2 % 30), cy2 + py2 + plank - 8);
    }
    ctx.stroke();
  }
  // corner braces + bolts
  ctx.strokeStyle = '#3c3326';
  ctx.lineWidth = 6;
  ctx.strokeRect(cx2 + 3, cy2 + 3, cw - 6, chh - 6);
  ctx.fillStyle = '#2a241a';
  var bolts = [[10, 10], [cw - 10, 10], [10, chh - 10], [cw - 10, chh - 10], [cw / 2, 10], [cw / 2, chh - 10]];
  for (var bb = 0; bb < bolts.length; bb++) {
    ctx.beginPath();
    ctx.arc(cx2 + bolts[bb][0], cy2 + bolts[bb][1], 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // stencil header
  ctx.textAlign = 'center';
  ctx.font = '900 30px ' + F_STEN;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillText('SUPPLY MANIFEST', W / 2 + 2, cy2 + 44);
  ctx.fillStyle = '#e8dfc2';
  ctx.fillText('SUPPLY MANIFEST', W / 2, cy2 + 42);
  ctx.font = '700 14px ' + F_STEN;
  ctx.fillStyle = shopIdx === 1 ? '#f0b65a' : '#a8c8ec';
  ctx.fillText(mode === '2p' ? 'REQUISITION - PLAYER ' + (shopIdx + 1) : 'REQUISITION - YOUR ARSENAL', W / 2, cy2 + 66);
  ctx.fillStyle = '#ffe9b0';
  ctx.fillText('FUNDS $' + P.cash, W / 2, cy2 + 88);
  var y0 = cy2 + 122, lh = 36;
  shopLayout = { items: [], doneY: 0 };
  var notes = [
    'big crater',
    'splits at apex',
    'wide burning arc, damage over time',
    'drills a deep shaft',
    'absorbs 40 dmg, one battle'
  ];
  for (var i = 0; i < SHOP.length; i++) {
    var it = SHOP[i];
    var y = y0 + i * lh;
    var owned = it.shield ? (P.shieldNext ? 'READY' : '-') : ('x' + P.inv[it.w]);
    var afford = P.cash >= it.price;
    // manifest row stripe
    ctx.fillStyle = i % 2 === 0 ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.08)';
    ctx.fillRect(cx2 + 18, y - 20, cw - 36, 28);
    // stamped checkbox
    ctx.strokeStyle = afford ? '#e8dfc2' : 'rgba(232,223,194,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx2 + 28, y - 15, 14, 14);
    ctx.font = '700 13px ' + F_STEN;
    ctx.textAlign = 'left';
    ctx.fillStyle = afford ? '#f0ead2' : 'rgba(232,223,194,0.4)';
    ctx.fillText('[' + (i + 1) + '] ' + it.label.replace(/\s+$/, ''), cx2 + 54, y - 3);
    ctx.fillStyle = afford ? '#ffe9b0' : 'rgba(255,233,176,0.4)';
    ctx.fillText('$' + it.price, cx2 + 230, y - 3);
    ctx.fillStyle = afford ? '#cdd6b8' : 'rgba(205,214,184,0.4)';
    ctx.fillText(owned, cx2 + 288, y - 3);
    ctx.font = '11px ' + F_STEN;
    ctx.fillText(notes[i], cx2 + 345, y - 3);
    shopLayout.items.push({ y0: y - 20, y1: y + 8, idx: i });
  }
  shopLayout.doneY = y0 + SHOP.length * lh + 6;
  ctx.textAlign = 'center';
  ctx.font = '700 14px ' + F_STEN;
  ctx.fillStyle = '#ffe9b0';
  ctx.fillText('PRESS 1-5 TO BUY  -  ENTER FOR NEXT BATTLE', W / 2, shopLayout.doneY + 26);
  // stamped marking
  ctx.save();
  ctx.translate(cx2 + cw - 86, cy2 + chh - 44);
  ctx.rotate(-0.14);
  ctx.strokeStyle = 'rgba(180,73,61,0.75)';
  ctx.lineWidth = 2;
  ctx.strokeRect(-52, -14, 104, 28);
  ctx.font = '900 13px ' + F_STEN;
  ctx.fillStyle = 'rgba(180,73,61,0.85)';
  ctx.fillText('ORDNANCE', 0, 5);
  ctx.restore();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  var sx = (Math.random() - 0.5) * shake;
  var sy = (Math.random() - 0.5) * shake;
  drawSky();
  ctx.save();
  ctx.translate(sx, camY + sy);
  drawTerrain();
  if (player) {
    drawFires();
    drawTank(player);
    drawTank(cpu);
    drawProjs();
    drawFx();
    drawParts();
  }
  ctx.restore();

  if (state === 'title') {
    drawTitle();
  } else if (state === 'victory') {
    panel([
      'Enemy tank destroyed.',
      'Win streak: ' + streak + '   Best: ' + best,
      'Cash earned: $' + earned[0] + '   Total: $' + pers[0].cash,
      '',
      'The next gunner has been watching you...',
      '',
      '- PRESS SPACE TO VISIT THE SHOP -'
    ], 'VICTORY');
  } else if (state === 'defeat') {
    panel([
      'Your tank was destroyed.',
      'Final streak: ' + streak + '   Best: ' + best,
      '',
      '- PRESS SPACE TO TRY AGAIN -'
    ], 'DEFEAT');
  } else if (state === 'roundend') {
    panel([
      'Score: P1 ' + wins[0] + ' - ' + wins[1] + ' P2   (first to 3)',
      'P1 earned $' + earned[0] + '   P2 earned $' + earned[1],
      '',
      '- PRESS SPACE TO VISIT THE SHOP -'
    ], roundWinner < 0 ? 'DRAW' : 'PLAYER ' + (roundWinner + 1) + ' WINS THE ROUND');
  } else if (state === 'matchwin') {
    panel([
      'Match score: P1 ' + wins[0] + ' - ' + wins[1] + ' P2',
      '',
      '- PRESS SPACE FOR TITLE SCREEN -'
    ], 'PLAYER ' + (matchWinner + 1) + ' WINS THE MATCH');
  } else if (state === 'shop') {
    drawShop();
  } else {
    drawHUD();
  }

  // transient message (shown over gameplay and panels)
  if (msgT > 0) {
    ctx.globalAlpha = clamp(msgT, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '700 16px ' + F_STEN;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(msg, W / 2 + 1.5, H * 0.18 + 1.5);
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText(msg, W / 2, H * 0.18);
    ctx.globalAlpha = 1;
  }

  if (paused) {
    ctx.fillStyle = 'rgba(8,10,8,.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e4e0c8';
    ctx.font = '900 36px ' + F_STEN;
    ctx.fillText('PAUSED', W / 2, H * 0.45);
    ctx.font = '14px ' + F_STEN;
    ctx.fillStyle = '#cfd4bc';
    ctx.fillText('PRESS P TO RESUME', W / 2, H * 0.45 + 30);
  }
}

/* ---------------- resize ---------------- */
var DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  var ow = W, old = ground;
  W = Math.max(640, window.innerWidth);
  H = Math.max(420, window.innerHeight);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  if (old && ow > 1) {
    var ng = new Float32Array(W);
    for (var x = 0; x < W; x++) {
      var fx = x / (W - 1) * (ow - 1);
      var i0 = Math.floor(fx), i1 = Math.min(ow - 1, i0 + 1);
      ng[x] = lerp(old[i0], old[i1], fx - i0);
    }
    ground = ng;
    terrainDirty = true;
    skyKey = '';
    if (player) {
      player.x = Math.round(player.x / ow * W);
      cpu.x = Math.round(cpu.x / ow * W);
    }
  } else {
    genTerrain();
  }
}
window.addEventListener('resize', resize);
resize();
genTerrain();

/* ---------------- main loop ---------------- */
var last = performance.now();
function loop(now) {
  var dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
