    ctx.fillStyle = night ? '#0c1220' : '#15202e';
    ctx.beginPath();
    ctx.moveTo(x - wpx * 0.24, y - h * 0.6);
    ctx.lineTo(x - wpx * 0.17, y - h * 0.88);
    ctx.lineTo(x + wpx * 0.17, y - h * 0.88);
    ctx.lineTo(x + wpx * 0.24, y - h * 0.6);
    ctx.closePath();
    ctx.fill();
    if (wpx > 18) {
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath();
      ctx.moveTo(x - wpx * 0.14, y - h * 0.62);
      ctx.lineTo(x - wpx * 0.04, y - h * 0.86);
      ctx.lineTo(x + wpx * 0.02, y - h * 0.86);
      ctx.lineTo(x - wpx * 0.08, y - h * 0.62);
      ctx.closePath();
      ctx.fill();
    }
    // racing stripe + wing mark a rival
    if (car.isRival) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(x - wpx * 0.045, y - h * 0.58, wpx * 0.09, h * 0.28);
      ctx.fillStyle = lerpColor(color, '#000000', 0.45);
      ctx.fillRect(x - wpx * 0.4, y - h * 0.98, wpx * 0.8, Math.max(1, h * 0.06));
      ctx.fillRect(x - wpx * 0.34, y - h * 0.92, Math.max(1, wpx * 0.04), h * 0.1);
      ctx.fillRect(x + wpx * 0.3, y - h * 0.92, Math.max(1, wpx * 0.04), h * 0.1);
    }
    // taillights: flare when braking into corners, glow at night
    var lit = cornering || night;
    ctx.fillStyle = lit ? '#ff3b2e' : '#b03028';
    ctx.fillRect(x - wpx * 0.42, y - h * 0.5, wpx * 0.16, h * 0.08);
    ctx.fillRect(x + wpx * 0.26, y - h * 0.5, wpx * 0.16, h * 0.08);
    if (lit && wpx > 8) {
      ctx.fillStyle = 'rgba(255,70,50,0.3)';
      ctx.fillRect(x - wpx * 0.46, y - h * 0.54, wpx * 0.24, h * 0.16);
      ctx.fillRect(x + wpx * 0.22, y - h * 0.54, wpx * 0.24, h * 0.16);
    }
    // bumper
    ctx.fillStyle = '#24242a';
    ctx.fillRect(x - wpx * 0.44, y - h * 0.16, wpx * 0.88, h * 0.1);
    ctx.restore();
  }

  function drawPlayerCar() {
    var w = 230;
    var h = 112;
    var speedPct = speed / MAX_SPEED;
    var bounce = (Math.random() * 2 - 1) * speedPct * 2.2;
    var cx = W / 2;
    var cy = H - 26 + bounce;
    var dir = steerVis < -0.3 ? -1 : (steerVis > 0.3 ? 1 : 0);
    var lean = steerVis * 6 + driftVis * 10;     // upper body weight shift
    var spin = Math.floor(position / 60) % 2 === 0;

    ctx.save();
    if (crashT > 0) {
      ctx.translate(cx, cy - h * 0.4);
      ctx.rotate(spinAngle);
      ctx.translate(-cx, -(cy - h * 0.4));
    } else if (dir !== 0 || driftVis * driftVis > 0.01) {
      ctx.translate(cx, cy);
      ctx.rotate(dir * 0.05 + driftVis * 0.28);
      ctx.translate(-cx, -cy);
    }

    // drop shadow (spreads as the car bounces)
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 4, w * 0.56 + Math.abs(bounce) * 3, 14 + Math.abs(bounce), 0, 0, Math.PI * 2);
    ctx.fill();

    // rear wheels with rotation flicker
    ctx.fillStyle = '#0c0c10';
    ctx.fillRect(cx - w * 0.52, cy - 32, 40, 34);
    ctx.fillRect(cx + w * 0.52 - 40, cy - 32, 40, 34);
    ctx.fillStyle = spin ? '#3a3a42' : '#232329';
    ctx.fillRect(cx - w * 0.52 + 5, spin ? cy - 24 : cy - 14, 30, 6);
    ctx.fillRect(cx + w * 0.52 - 35, spin ? cy - 14 : cy - 24, 30, 6);
    ctx.fillStyle = '#5a5a64';
    ctx.fillRect(cx - w * 0.52 + 14, cy - 20, 12, 10);
    ctx.fillRect(cx + w * 0.52 - 26, cy - 20, 12, 10);

    // twin exhaust flames while boosting
    if (boostT > 0 && crashT <= 0) {
      var fl = clamp(boostT / 1.1, 0, 1) * (0.7 + Math.random() * 0.5);
      ctx.fillStyle = 'rgba(255,170,60,' + (0.75 * fl).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(cx - w * 0.22, cy - 6, 9 + 10 * fl, 5 + 3 * fl, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + w * 0.22, cy - 6, 9 + 10 * fl, 5 + 3 * fl, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,245,200,' + (0.8 * fl).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(cx - w * 0.22, cy - 6, 4 + 4 * fl, 2.5, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + w * 0.22, cy - 6, 4 + 4 * fl, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // lower body with painted gradient
    var bodyGrad = ctx.createLinearGradient(0, cy - 48, 0, cy);
    bodyGrad.addColorStop(0, '#e03a28');
    bodyGrad.addColorStop(0.6, '#c41f1f');
    bodyGrad.addColorStop(1, '#8c1212');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.47, cy);
    ctx.lineTo(cx - w * 0.44, cy - 46);
    ctx.lineTo(cx + w * 0.44, cy - 46);
    ctx.lineTo(cx + w * 0.47, cy);
    ctx.closePath();
    ctx.fill();

    // side intakes
    ctx.fillStyle = '#5e0c0c';
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.46, cy - 10);
    ctx.lineTo(cx - w * 0.33, cy - 26);
    ctx.lineTo(cx - w * 0.33, cy - 12);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.46, cy - 10);
    ctx.lineTo(cx + w * 0.33, cy - 26);
    ctx.lineTo(cx + w * 0.33, cy - 12);
    ctx.closePath();
    ctx.fill();

    // engine deck (leans with steering and drift)
    ctx.fillStyle = '#a81a1a';
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.44, cy - 46);
    ctx.lineTo(cx - w * 0.3 + lean, cy - 72);
    ctx.lineTo(cx + w * 0.3 + lean, cy - 72);
    ctx.lineTo(cx + w * 0.44, cy - 46);
    ctx.closePath();
    ctx.fill();
    // deck vents
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    for (var v = -2; v <= 2; v++) {
      ctx.fillRect(cx + v * 14 + lean * 0.8 - 4, cy - 64, 8, 12);
    }

    // cockpit glass with a sweeping glint
    ctx.fillStyle = '#121d2c';
    ctx.fillRect(cx - w * 0.17 + lean, cy - 69, w * 0.34, 19);
    var gl = ((gTime * 0.7) % 1.4) - 0.2;
    if (gl > 0 && gl < 1) {
      ctx.fillStyle = 'rgba(190,220,255,0.3)';
      var gx = cx - w * 0.17 + lean + gl * w * 0.3;
      ctx.beginPath();
      ctx.moveTo(gx, cy - 69);
      ctx.lineTo(gx + 10, cy - 69);
      ctx.lineTo(gx + 2, cy - 50);
      ctx.lineTo(gx - 8, cy - 50);
      ctx.closePath();
      ctx.fill();
    }
    // driver helmet
    ctx.fillStyle = '#e8e3d4';
    ctx.beginPath();
    ctx.arc(cx + lean, cy - 70, 8, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#c41f1f';
    ctx.fillRect(cx + lean - 8, cy - 72, 16, 3);

    // spoiler with highlight edge
    ctx.fillStyle = '#7d1010';
    ctx.fillRect(cx - w * 0.38 + lean, cy - 83, w * 0.76, 9);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(cx - w * 0.38 + lean, cy - 83, w * 0.76, 3);
    ctx.fillStyle = '#5e0c0c';
    ctx.fillRect(cx - w * 0.3 + lean, cy - 74, 8, 10);
    ctx.fillRect(cx + w * 0.3 + lean - 8, cy - 74, 8, 10);

    // full-width taillight bar (bright while braking)
    ctx.fillStyle = braking ? '#ff2d20' : '#8c241c';
    ctx.fillRect(cx - w * 0.4, cy - 40, w * 0.8, 7);
    ctx.fillStyle = braking ? '#ffb0a0' : 'rgba(255,255,255,0.12)';
    ctx.fillRect(cx - w * 0.4, cy - 40, w * 0.8, 2);
    if (braking) {
      ctx.fillStyle = 'rgba(255,60,40,0.3)';
      ctx.fillRect(cx - w * 0.46, cy - 46, w * 0.92, 20);
    }

    // bumper, diffuser fins + plate
    ctx.fillStyle = '#1e1e24';
    ctx.fillRect(cx - w * 0.43, cy - 14, w * 0.86, 11);
    ctx.fillStyle = '#101014';
    for (var d = -3; d <= 3; d++) ctx.fillRect(cx + d * 22 - 3, cy - 12, 6, 9);
    ctx.fillStyle = '#d8d2c0';
    ctx.fillRect(cx - 24, cy - 33, 48, 13);
    ctx.fillStyle = '#333';
    ctx.font = '700 10px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('RL-5', cx, cy - 26);

    ctx.restore();
  }

  function drawSmoke() {
    for (var i = 0; i < smoke.length; i++) {
      var p = smoke[i];
      var t = p.age / p.life;
      var px = p.x + p.vx * p.age, py = p.y + p.vy * p.age;
      var r = p.r * (1 + t * 1.8);
      ctx.globalAlpha = (1 - t) * 0.38;
      ctx.fillStyle = '#c9c9d2';
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = (1 - t) * 0.2;
      ctx.fillStyle = '#f2f2f6';
      ctx.beginPath();
      ctx.arc(px - r * 0.3, py - r * 0.3, r * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------- road rendering ---------------- */

  /* translucent stand-in for the recorded run — deliberately not a real car,
     it has no collision and must read as a replay, not a rival */
  function drawGhostCar(cx, cy, w) {
    if (!(w > 0) || !isFinite(cx) || !isFinite(cy)) return;
    var h = w * 0.52;
    ctx.save();
    ctx.globalAlpha = 0.42;
    ctx.fillStyle = '#5ce1ff';
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy);
    ctx.lineTo(cx - w * 0.38, cy - h * 0.62);
    ctx.lineTo(cx + w * 0.38, cy - h * 0.62);
    ctx.lineTo(cx + w / 2, cy);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = '#bff3ff';
    ctx.lineWidth = Math.max(1, w * 0.035);
    ctx.stroke();
    ctx.restore();
  }

  function renderRoad(fogColor) {
    var ghostSeg = null, ghostPct = 0;
    // a ghost more than a draw-distance ahead (or any distance behind) is out
    // of shot; without this check a lap-old ghost would wrap into view and
    // look like it was racing alongside
    var gRel = ghostDist - distanceTotal;
    if (ghost && !ghostDone && trackLength > 0 && gRel > -SEG_LEN && gRel < SEG_LEN * DRAW_DIST) {
      var gz = ghostDist % trackLength;
      if (gz < 0) gz += trackLength;
      ghostSeg = findSegment(gz);
      ghostPct = (gz % SEG_LEN) / SEG_LEN;
    }
    var baseSeg = findSegment(position);
    var basePct = (position % SEG_LEN) / SEG_LEN;
    var playerSeg = findSegment(position + PLAYER_Z);
    var playerPct = ((position + PLAYER_Z) % SEG_LEN) / SEG_LEN;
    var playerY = lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);

    var maxy = H;
    var x = 0;
    var dx = -(baseSeg.curve * basePct);
    var n, seg;

    for (n = 0; n < DRAW_DIST; n++) {
      seg = segments[(baseSeg.index + n) % segments.length];
      seg.looped = seg.index < baseSeg.index;
      seg.fog = expFog(n / DRAW_DIST, FOG_DENSITY);
      seg.clip = maxy;

      var camZ = position - (seg.looped ? trackLength : 0);
      project(seg.p1, playerX * ROAD_WIDTH - x, playerY + CAM_HEIGHT, camZ);
      project(seg.p2, playerX * ROAD_WIDTH - x - dx, playerY + CAM_HEIGHT, camZ);

      x += dx;
      dx += seg.curve;

      if (seg.p1.camera.z <= CAM_DEPTH ||
          seg.p2.screen.y >= seg.p1.screen.y ||
          seg.p2.screen.y >= maxy) continue;

      renderSegmentStrip(seg, fogColor);
      maxy = seg.p2.screen.y;
    }

    // back-to-front: roadside sprites and traffic
    for (n = DRAW_DIST - 1; n > 0; n--) {
      seg = segments[(baseSeg.index + n) % segments.length];
      if (seg.p1.camera.z <= CAM_DEPTH) continue;

      var i, spr, scale, sx, sy;
      for (i = 0; i < seg.sprites.length; i++) {
        spr = seg.sprites[i];
        scale = seg.p1.screen.scale;
        sx = seg.p1.screen.x + scale * spr.offset * ROAD_WIDTH * W / 2;
        sy = seg.p1.screen.y;
        drawSprite(spr, seg, scale, sx, sy);
      }
      for (i = 0; i < seg.cars.length; i++) {
        var car = seg.cars[i];
        scale = lerp(seg.p1.screen.scale, seg.p2.screen.scale, car.percent);
        sx = lerp(seg.p1.screen.x, seg.p2.screen.x, car.percent) +
             scale * car.offset * ROAD_WIDTH * W / 2;
        sy = lerp(seg.p1.screen.y, seg.p2.screen.y, car.percent);
        drawTrafficCar(sx, sy, scale * 640 * W / 2, car, seg);
      }
      // the ghost sits in whichever segment its distance lands in, so it is
      // drawn in the same back-to-front order as the traffic and occludes
      // correctly behind hills
      if (ghost && !ghostDone && seg === ghostSeg) {
        scale = lerp(seg.p1.screen.scale, seg.p2.screen.scale, ghostPct);
        sx = lerp(seg.p1.screen.x, seg.p2.screen.x, ghostPct) +
             scale * ghostX * ROAD_WIDTH * W / 2;
        sy = lerp(seg.p1.screen.y, seg.p2.screen.y, ghostPct);
        drawGhostCar(sx, sy, scale * 640 * W / 2);
      }
    }
  }

  function renderSegmentStrip(seg, fogColor) {
    var p1 = seg.p1.screen, p2 = seg.p2.screen;
    var x1 = p1.x, y1 = p1.y, w1 = p1.w;
    var x2 = p2.x, y2 = p2.y, w2 = p2.w;
    var c = seg.colors;

    var r1 = w1 / Math.max(6, 2 * LANES);
    var r2 = w2 / Math.max(6, 2 * LANES);

    // grass strip
    ctx.fillStyle = c.grass;
    ctx.fillRect(0, y2, W, y1 - y2);

    // rumble strips
    polygon(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, c.rumble);
    polygon(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, c.rumble);

    // road
    polygon(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, c.road);

    // continuous edge lines between asphalt and rumble
    var e1 = w1 * 0.012 + 0.6, e2 = w2 * 0.012 + 0.6;
    polygon(x1 - w1, y1, x1 - w1 + e1 * 2, y1, x2 - w2 + e2 * 2, y2, x2 - w2, y2, c.edge);
    polygon(x1 + w1 - e1 * 2, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 - e2 * 2, y2, c.edge);

    // drift skid marks laid on the asphalt
    var sk = skidBySeg[seg.index];
    if (sk) {
      var skCol = 'rgba(12,12,16,' + (sk.alpha * 0.55).toFixed(3) + ')';
      for (var si = -1; si <= 1; si += 2) {
        var o1 = sk.offset + si * 0.07;
        var o2 = o1 + sk.dir * 0.05;
        polygon(x1 + w1 * o1 - w1 * 0.02, y1, x1 + w1 * o1 + w1 * 0.02, y1,
                x2 + w2 * o2 + w2 * 0.02, y2, x2 + w2 * o2 - w2 * 0.02, y2, skCol);
      }
    }

    // lane markings (with a reflective shine at night)
    if (c.lane) {
      var l1 = w1 / 32, l2 = w2 / 32;
      var lanew1 = w1 * 2 / LANES, lanew2 = w2 * 2 / LANES;
      var lanex1 = x1 - w1 + lanew1, lanex2 = x2 - w2 + lanew2;
      for (var lane = 1; lane < LANES; lane++) {
        if (seg.zi === 2) {
          ctx.globalAlpha = 0.3;
          polygon(lanex1 - l1 * 1.7, y1, lanex1 + l1 * 1.7, y1, lanex2 + l2 * 1.7, y2, lanex2 - l2 * 1.7, y2, '#8fa8ff');
          ctx.globalAlpha = 1;
        }
        polygon(lanex1 - l1 / 2, y1, lanex1 + l1 / 2, y1, lanex2 + l2 / 2, y2, lanex2 - l2 / 2, y2, c.lane);
        lanex1 += lanew1;
        lanex2 += lanew2;
      }
    }

    // fog
    if (seg.fog < 1) {
      ctx.globalAlpha = 1 - seg.fog;
      ctx.fillStyle = fogColor;
      ctx.fillRect(0, y2, W, y1 - y2);
      ctx.globalAlpha = 1;
    }
  }

  /* ---------------- HUD ---------------- */

  function fmtTime(t) {
    return Math.ceil(t).toString();
  }

  function drawHUD() {
    var meters = Math.floor(distanceTotal / UNITS_PER_M);
    var kmh = Math.round(speed / MAX_SPEED * 320);
    var seg = findSegment(position + PLAYER_Z);
    var zoneName = ZONES[seg.zi].name;
    var bestShown = Math.max(best, meters);

    // top bar
    ctx.fillStyle = 'rgba(8,10,18,0.62)';
    ctx.fillRect(0, 0, W, 56);
    ctx.strokeStyle = 'rgba(140,160,210,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 56.5);
    ctx.lineTo(W, 56.5);
    ctx.stroke();

    ctx.textBaseline = 'middle';

    // damage bar + slipstream flag, under the top bar
    if (damage > 0.001) {
      var dw = 92, dx = W - dw - 22, dy = 64;
      ctx.fillStyle = 'rgba(8,10,18,0.55)';
      ctx.fillRect(dx - 2, dy - 2, dw + 4, 12);
      ctx.fillStyle = damage > 0.6 ? '#ff4d3d' : damage > 0.3 ? '#ffb13d' : '#ffd94d';
      ctx.fillRect(dx, dy, dw * damage, 8);
      ctx.strokeStyle = 'rgba(160,180,220,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(dx - 0.5, dy - 0.5, dw + 1, 9);
      ctx.textAlign = 'right';
      ctx.font = '700 11px "Courier New", monospace';
      ctx.fillStyle = '#8fa0c4';
      ctx.fillText('DAMAGE', dx - 8, dy + 4);
    }
    if (draftT > 0) {
      ctx.textAlign = 'center';
      ctx.font = '700 15px "Courier New", monospace';
      ctx.fillStyle = Math.floor(gTime * 12) % 2 === 0 ? '#7df29b' : '#bdf7cf';
      ctx.fillText('\u00bb SLIPSTREAM \u00ab', W / 2, 78);
    }

    // time
    ctx.textAlign = 'left';
    ctx.font = '700 13px "Courier New", monospace';
    ctx.fillStyle = '#8fa0c4';
    ctx.fillText('TIME', 22, 18);
    var low = timeLeft < 10;
    ctx.font = '700 30px "Courier New", monospace';
    ctx.fillStyle = low && Math.floor(timeLeft * 4) % 2 === 0 ? '#ff4d3d' : '#f2f5ff';
    ctx.fillText(fmtTime(timeLeft), 22, 40);

    // race position (left-center)
    ctx.textAlign = 'center';
    ctx.font = '700 13px "Courier New", monospace';
    ctx.fillStyle = '#8fa0c4';
    ctx.fillText('POS', W * 0.27, 18);
    ctx.font = '700 26px "Courier New", monospace';
    if (posFlash > 0 && Math.floor(posFlash * 8) % 2 === 0) {
      ctx.fillStyle = posGain ? '#7df29b' : '#ff4d3d';
    } else {
      ctx.fillStyle = racePos === 1 ? '#ffd94d' : '#f2f5ff';
    }
    ctx.fillText(racePos + '/' + TOTAL_RACERS, W * 0.27, 40);

    // zone + distance (center)
    ctx.font = '700 13px "Courier New", monospace';
    ctx.fillStyle = '#8fa0c4';
    ctx.fillText(zoneName, W / 2, 18);
    ctx.font = '700 24px "Courier New", monospace';
    ctx.fillStyle = '#f2f5ff';
    ctx.fillText(meters + ' m', W / 2, 40);

    // drift style (right-center)
    ctx.font = '700 13px "Courier New", monospace';
    ctx.fillStyle = '#8fa0c4';
    ctx.fillText('STYLE', W * 0.73, 18);
    ctx.font = '700 26px "Courier New", monospace';
    ctx.fillStyle = drifting ? '#ffd94d' : '#f2f5ff';
    ctx.fillText(String(stylePoints), W * 0.73, 40);
    if (styleFlash > 0) {
      ctx.globalAlpha = clamp(styleFlash / 1.4, 0, 1);
      ctx.font = '700 14px "Courier New", monospace';
      ctx.fillStyle = '#7df29b';
      ctx.fillText('+' + styleFlashAmt + ' STYLE', W * 0.73, 72);
      ctx.globalAlpha = 1;
    } else if (drifting) {
      ctx.font = '700 14px "Courier New", monospace';
      ctx.fillStyle = '#ffd94d';
      ctx.fillText('DRIFT!', W * 0.73, 72);
    }

    // speed (right)
    ctx.textAlign = 'right';
    ctx.font = '700 13px "Courier New", monospace';
    ctx.fillStyle = '#8fa0c4';
    ctx.fillText('KM/H', W - 22, 18);
    ctx.font = '700 30px "Courier New", monospace';
    ctx.fillStyle = '#f2f5ff';
    ctx.fillText(String(kmh), W - 22, 40);

    // best (under bar, right side)
    ctx.font = '700 12px "Courier New", monospace';
    ctx.fillStyle = 'rgba(220,228,250,0.75)';
    ctx.fillText('BEST ' + bestShown + ' m', W - 22, 72);

    // gap to the ghost, in metres, signed
    if (ghost && state === 'playing') {
      var gap = Math.round((distanceTotal - ghostDist) / UNITS_PER_M);
      ctx.fillStyle = gap >= 0 ? 'rgba(126,240,160,0.9)' : 'rgba(92,225,255,0.9)';
      ctx.fillText((ghostDone ? 'GHOST OUT' : (gap >= 0 ? '+' : '') + gap + ' m vs ' +
                   String(ghost.name || 'ghost').toUpperCase()), W - 22, 90);
    }
    if (SND.muted) {
      ctx.textAlign = 'left';
      ctx.fillText('SOUND OFF [M]', 22, 72);
    }

    // checkpoint flash
    if (checkpointFlash > 0) {
      var a = clamp(checkpointFlash / 1.6, 0, 1);
      var pulse = 1 + (1 - a) * 0.25;
      ctx.save();
      ctx.globalAlpha = Math.min(1, a * 2);
      ctx.translate(W / 2, H * 0.3);
      ctx.scale(pulse, pulse);
      ctx.textAlign = 'center';
      ctx.font = '700 44px "Courier New", monospace';
      ctx.fillStyle = '#ffd94d';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 6;
      ctx.strokeText('CHECKPOINT', 0, 0);
      ctx.fillText('CHECKPOINT', 0, 0);
      ctx.font = '700 26px "Courier New", monospace';
      ctx.strokeText('+' + CHECK_BONUS + 's', 0, 40);
      ctx.fillText('+' + CHECK_BONUS + 's', 0, 40);
      ctx.restore();
    }

    // passing flash: big new position
    if (posFlash > 0 && checkpointFlash <= 0 && leadBanner <= 0) {
      var pa = clamp(posFlash / 1.2, 0, 1);
      ctx.save();
      ctx.globalAlpha = Math.min(1, pa * 2);
      ctx.textAlign = 'center';
      ctx.font = '700 40px "Courier New", monospace';
      ctx.fillStyle = posGain ? '#7df29b' : '#ff4d3d';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 6;
      var ptxt = (posGain ? 'POS ' : 'LOST POS ') + racePos + '/' + TOTAL_RACERS;
      ctx.strokeText(ptxt, W / 2, H * 0.3);
      ctx.fillText(ptxt, W / 2, H * 0.3);
      ctx.restore();
    }

    // taking the lead banner
    if (leadBanner > 0) {
      var la = clamp(leadBanner / 3, 0, 1);
      var lpulse = 1 + Math.sin(leadBanner * 9) * 0.04;
      ctx.save();
      ctx.globalAlpha = Math.min(1, la * 3);
      ctx.translate(W / 2, H * 0.3);
      ctx.scale(lpulse, lpulse);
      ctx.textAlign = 'center';
      ctx.font = '700 48px "Courier New", monospace';
      ctx.fillStyle = '#ffd94d';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 7;
      ctx.strokeText('RACE LEADER!', 0, 0);
      ctx.fillText('RACE LEADER!', 0, 0);
      ctx.font = '700 22px "Courier New", monospace';
      ctx.fillStyle = '#f2f5ff';
      ctx.strokeText('P1 - STAY AHEAD', 0, 42);
      ctx.fillText('P1 - STAY AHEAD', 0, 42);
      ctx.restore();
    }
  }

  function drawPaused() {
    ctx.fillStyle = 'rgba(5,7,14,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 48px "Courier New", monospace';
    ctx.fillStyle = '#f2f5ff';
    ctx.fillText('PAUSED', W / 2, H * 0.44);
    ctx.font = '700 18px "Courier New", monospace';
    ctx.fillStyle = '#8fa0c4';
    ctx.fillText('PRESS P TO RESUME', W / 2, H * 0.56);
  }

  function drawTitle() {
    ctx.fillStyle = 'rgba(5,7,14,0.62)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '700 64px "Courier New", monospace';
    ctx.fillStyle = '#ff4d3d';
    ctx.fillText('REDLINE RUN', W / 2, H * 0.24);
    ctx.font = '700 15px "Courier New", monospace';
    ctx.fillStyle = '#8fa0c4';
    ctx.fillText('AN OUTRUN-STYLE CHECKPOINT CHASE', W / 2, H * 0.33);

    ctx.fillStyle = '#dfe6ff';
    ctx.font = '700 16px "Courier New", monospace';
    var lines = [
      'ARROWS / WASD ... STEER, GAS, BRAKE',
      'BRAKE + STEER ... DRIFT FOR STYLE AND BOOST',
      'P ............... PAUSE      M ... MUTE',
      '',
      N_RIVALS + ' RIVALS START AHEAD - CLIMB TO P1',
      'REACH CHECKPOINTS BEFORE TIME RUNS OUT',
      'EACH ONE ADDS +' + CHECK_BONUS + ' SECONDS',
      'STAY ON THE ROAD - TRAFFIC HITS SPIN YOU OUT'
    ];
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, H * 0.44 + i * 24);
    }

    if (best > 0) {
      ctx.fillStyle = '#ffd94d';
      ctx.fillText('BEST DISTANCE: ' + best + ' m', W / 2, H * 0.44 + lines.length * 24 + 14);
    }

    if (Math.floor(Date.now() / 500) % 2 === 0) {
      ctx.font = '700 22px "Courier New", monospace';
      ctx.fillStyle = '#f2f5ff';
      ctx.fillText('PRESS ENTER TO START', W / 2, H * 0.91);
    }
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(5,7,14,0.66)';
    ctx.fillRect(0, 0, W, H);

    var meters = Math.floor(distanceTotal / UNITS_PER_M);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = '700 56px "Courier New", monospace';
    ctx.fillStyle = '#ff4d3d';
    ctx.fillText('TIME UP', W / 2, H * 0.3);

    ctx.font = '700 22px "Courier New", monospace';
    ctx.fillStyle = racePos === 1 ? '#ffd94d' : '#dfe6ff';
    ctx.fillText('FINISHED P' + racePos + '/' + TOTAL_RACERS +
                 '   STYLE ' + stylePoints, W / 2, H * 0.39);

    ctx.font = '700 26px "Courier New", monospace';
    ctx.fillStyle = '#f2f5ff';
    ctx.fillText('DISTANCE  ' + meters + ' m', W / 2, H * 0.48);

    ctx.font = '700 20px "Courier New", monospace';
    if (newRecord) {
      ctx.fillStyle = '#ffd94d';
      ctx.fillText('NEW RECORD', W / 2, H * 0.57);
    } else {
      ctx.fillStyle = '#8fa0c4';
      ctx.fillText('BEST  ' + best + ' m', W / 2, H * 0.57);
    }

    if (Math.floor(Date.now() / 500) % 2 === 0) {
      ctx.font = '700 20px "Courier New", monospace';
      ctx.fillStyle = '#dfe6ff';
      ctx.fillText('PRESS ENTER OR R TO RESTART', W / 2, H * 0.74);
    }
  }

  /* ---------------- frame ---------------- */

  function render() {
    bucketCars();

    ctx.save();
    if (shakeT > 0) {
      var mag = shakeT * 16;
      ctx.translate((Math.random() * 2 - 1) * mag, (Math.random() * 2 - 1) * mag);
    }

    var zb = zoneBlendNow();
    var fogColor = drawSky(zb);
    renderRoad(fogColor);

    if (state !== 'title') {
      drawSmoke();
      drawPlayerCar();
    }

    ctx.restore();

    if (state === 'playing') {
      drawHUD();
      if (showTouch) drawTouchControls();
      if (paused) drawPaused();
    }
    else if (state === 'title') drawTitle();
    else drawGameOver();
  }

  var lastT = null, acc = 0;
  function frame(ts) {
    if (lastT === null) lastT = ts;
    var dt = Math.min(0.1, (ts - lastT) / 1000);
    lastT = ts;
    acc += dt;
    while (acc >= FPS_STEP) {
      if (!paused) update(FPS_STEP);
      acc -= FPS_STEP;
    }
    render();
    requestAnimationFrame(frame);
  }

  buildTrack();
  resetCars();
  resetRivals();
  requestAnimationFrame(frame);
})();
</script>
