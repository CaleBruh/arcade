    if (sel) {
      ctx.shadowColor = c.c;
      ctx.shadowBlur = 14;
    }
    ctx.strokeStyle = sel ? c.c : '#2a2e3c';
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;

    ctx.font = 'bold 34px ' + MONO;
    ctx.shadowColor = c.c;
    ctx.shadowBlur = sel ? 18 : 8;
    ctx.fillStyle = c.c;
    ctx.fillText('@', bx + bw / 2, by + 56 + (sel ? Math.sin(now * 0.004) * 2 : 0));
    ctx.shadowBlur = 0;
    ctx.font = 'bold 18px ' + MONO;
    ctx.fillText(`${i + 1}. ${c.name}`, bx + bw / 2, by + 92);
    ctx.font = '13px ' + MONO;
    let ly = by + 124;
    for (const line of c.lines) {
      ctx.fillStyle = sel ? '#b4b4c4' : '#9a9aa8';
      ctx.fillText(line, bx + bw / 2, ly);
      ly += 22;
    }
    if (sel) {
      ctx.fillStyle = c.c;
      ctx.font = 'bold 12px ' + MONO;
      ctx.fillText('- CHOSEN -', bx + bw / 2, by + bh - 16);
    }
  }

  // daily challenge toggle
  const dy = by + bh + 34;
  titleBtns.daily = { x: cx - 260, y: dy - 16, w: 520, h: 24 };
  ctx.font = '14px ' + MONO;
  if (dailyMode) { ctx.shadowColor = 'rgba(79,216,255,0.6)'; ctx.shadowBlur = 8; }
  ctx.fillStyle = dailyMode ? '#4fd8ff' : '#6a6a78';
  ctx.fillText(`[D] daily challenge: ${dailyMode ? 'ON' : 'OFF'}   (seed ${todayStr()} — same dungeon for everyone today)`, cx, dy);
  ctx.shadowBlur = 0;

  // start button
  const sw = 300, sh = 46;
  const sx = cx - sw / 2, sy = dy + 22;
  titleBtns.start = { x: sx, y: sy, w: sw, h: sh };
  const sg = ctx.createLinearGradient(0, sy, 0, sy + sh);
  sg.addColorStop(0, '#272b3e');
  sg.addColorStop(1, '#171a28');
  ctx.fillStyle = sg;
  ctx.fillRect(sx, sy, sw, sh);
  ctx.shadowColor = 'rgba(255,190,90,' + (0.35 + 0.25 * Math.sin(now * 0.003)) + ')';
  ctx.shadowBlur = 16;
  ctx.strokeStyle = '#ffd766';
  ctx.lineWidth = 2;
  ctx.strokeRect(sx + 1, sy + 1, sw - 2, sh - 2);
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
  ctx.font = 'bold 16px ' + MONO;
  ctx.fillStyle = '#ffd766';
  ctx.fillText('DESCEND  [Enter]', cx, sy + 29);

  ctx.font = '12px ' + MONO;
  ctx.fillStyle = '#5a5a68';
  ctx.fillText('1/2/3 or arrow keys: choose class     D: toggle daily     Enter: begin', cx, sy + sh + 28);
}

function renderWon(now) {
  ctx.fillStyle = 'rgba(4,8,12,0.9)';
  ctx.fillRect(0, 0, CANW, CANH);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const cx = CANW / 2;

  // slowly turning golden light rays
  ctx.save();
  ctx.translate(cx, 60);
  const rt = now * 0.00022;
  for (let i = 0; i < 9; i++) {
    const a = rt + i * (Math.PI / 4.5);
    ctx.fillStyle = 'rgba(255,214,110,' + (0.03 + 0.025 * Math.sin(now * 0.001 + i)) + ')';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * 1500, Math.sin(a) * 1500);
    ctx.lineTo(Math.cos(a + 0.12) * 1500, Math.sin(a + 0.12) * 1500);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  const wg = ctx.createRadialGradient(cx, 170, 20, cx, 170, 480);
  wg.addColorStop(0, 'rgba(255,200,90,0.12)');
  wg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, CANW, CANH);
  let y = 130;

  ctx.font = '15px ' + MONO;
  const crown = [
    ['  .  .  .  .  .  ',  '#4fd8ff'],
    [' /|  |  |  |  |\\ ', '#4fd8ff'],
    ['|   THE CROWN    |', '#ffd766'],
    ['|  OF THE DEPTHS |', '#ffd766'],
    [' \\______________/ ','#4fd8ff'],
  ];
  for (const [line, col] of crown) { ctx.fillStyle = col; ctx.fillText(line, cx, y); y += 20; }
  y += 30;

  ctx.font = 'bold 30px ' + MONO;
  ctx.shadowColor = 'rgba(255,200,90,0.8)';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#ffd766';
  ctx.fillText('VICTORY', cx, y);
  ctx.shadowBlur = 0;
  y += 34;
  ctx.font = '16px ' + MONO;
  ctx.fillStyle = '#4fd8ff';
  ctx.fillText('The Drowned King is slain. The Sunken Depths are yours.', cx, y); y += 36;

  ctx.font = '15px ' + MONO;
  ctx.fillStyle = '#c9c9d4';
  ctx.fillText(`${className()}${dailyMode ? '  (daily challenge ' + dailySeed + ')' : ''}`, cx, y); y += 24;
  ctx.fillText(`Depth: ${depth}    Level: ${player.level}    Kills: ${kills}`, cx, y); y += 22;
  ctx.fillText(`Gold: ${gold}    Turns: ${turns}    Best depth: ${best}`, cx, y); y += 44;

  ctx.fillStyle = '#8a8a9a';
  ctx.fillText('The depths do not end here. Endless mode continues below...', cx, y); y += 34;
  ctx.font = 'bold 16px ' + MONO;
  ctx.shadowColor = 'rgba(255,190,90,0.5)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffd766';
  ctx.fillText('KEEP DESCENDING  [Enter]', cx, y);
  ctx.shadowBlur = 0;
}

function renderDead() {
  ctx.fillStyle = 'rgba(4,4,8,0.9)';
  ctx.fillRect(0, 0, CANW, CANH);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  const cx = CANW / 2;
  let y = 110;

  ctx.font = '15px Menlo, Consolas, monospace';
  const killer = (lastKiller || 'dungeon').slice(0, 16);
  const pad = Math.max(0, 16 - killer.length);
  const kLine = ' '.repeat(Math.floor(pad / 2)) + killer + ' '.repeat(Math.ceil(pad / 2));
  const stone = [
    ['    ________________    ', '#9a9aa8'],
    ['   /                \\   ', '#9a9aa8'],
    ['  /     R  I  P      \\  ', '#9a9aa8'],
    [' |                    | ', '#9a9aa8'],
    [' |     @ the bold     | ', '#c9c9d4'],
    [' |                    | ', '#9a9aa8'],
    [' |    slain by the    | ', '#9a9aa8'],
    [' |  ' + kLine + '  | ',     '#ff7a7a'],
    [' |                    | ', '#9a9aa8'],
    ['_|____________________|_', '#9a9aa8'],
  ];
  for (const [line, col] of stone) { ctx.fillStyle = col; ctx.fillText(line, cx, y); y += 20; }
  y += 24;

  ctx.font = 'bold 26px Menlo, Consolas, monospace';
  ctx.fillStyle = '#ff4f4f';
  ctx.fillText('YOU HAVE DIED', cx, y); y += 36;

  ctx.font = '15px Menlo, Consolas, monospace';
  ctx.fillStyle = '#c9c9d4';
  ctx.fillText(`${className()}, slain by: ${lastKiller || 'the dungeon'}${won ? '  (victor over the Drowned King)' : ''}`, cx, y); y += 26;
  ctx.fillText(`Depth reached: ${depth}    Best ever: ${best}${dailyMode ? '    Daily best: ' + loadDaily().depth : ''}`, cx, y); y += 22;
  ctx.fillText(`Level ${player.level}    Kills: ${kills}    Gold: ${gold}    Turns: ${turns}`, cx, y); y += 44;

  // new run button
  const bw = 260, bh = 44;
  const bx = cx - bw / 2, by = y;
  deadBtn = { x: bx, y: by, w: bw, h: bh };
  ctx.fillStyle = '#1d2130';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#ffd766';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
  ctx.lineWidth = 1;
  ctx.font = 'bold 16px Menlo, Consolas, monospace';
  ctx.fillStyle = '#ffd766';
  ctx.fillText('RISE AGAIN  [Enter]', cx, by + 28);
}

function render(now) {
  ctx.fillStyle = '#07070b';
  ctx.fillRect(0, 0, CANW, CANH);
  if (state === 'title') { renderTitle(); return; }
  renderMap(now);
  renderSidebar();
  renderLog();
  if (invOpen) renderInventory();
  if (state === 'won') renderWon();
  if (state === 'dead') renderDead();
}

/* ---------------- main loop ---------------- */
function frame(now) {
  if (state === 'play' && !invOpen && heldMoveKey && keysDown[heldMoveKey] && now >= nextRepeatAt) {
    doMove(heldMoveKey);
    nextRepeatAt = now + REPEAT_RATE;
  }
  render(now);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
