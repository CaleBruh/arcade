<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASTLE RAYCAST</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #screen{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;cursor:crosshair;}
  #mm{position:fixed;top:12px;right:14px;z-index:400;image-rendering:pixelated;display:none;
      border:1px solid rgba(140,160,210,.35);border-radius:4px;}
  #hud{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:0;
      font:700 10px/1 "Courier New",monospace;letter-spacing:2px;color:#6d7890;white-space:nowrap;
      background:linear-gradient(180deg,#2a2f3a 0%,#1a1e28 8%,#12151e 55%,#0a0c12 100%);
      border:1px solid #3a4152;border-top:2px solid #4a5268;
      box-shadow:0 0 0 1px #05060a,0 6px 18px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.07);
      padding:7px 6px 8px;border-radius:4px;z-index:400;pointer-events:none;}
  #hud span{display:flex;flex-direction:column;align-items:center;gap:4px;
      padding:2px 16px;border-right:1px solid #2a3040;position:relative;}
  #hud span:last-child{border-right:none;}
  #hud span::before{content:"";position:absolute;left:2px;top:-4px;width:2px;height:2px;
      background:#555f75;border-radius:50%;box-shadow:inset 0 0 1px #000;}
  #hud b{color:#ffdf8a;font-size:17px;letter-spacing:1px;
      text-shadow:0 0 6px rgba(255,200,90,.55),0 0 14px rgba(255,170,50,.25);
      background:linear-gradient(180deg,#07080c,#0d1018);border:1px solid #262c3a;
      border-radius:3px;padding:3px 7px 2px;min-width:38px;text-align:center;
      box-shadow:inset 0 2px 5px rgba(0,0,0,.85);}
  #note{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:400;
      font:700 12px/1 "Courier New",monospace;letter-spacing:2px;color:#ffe9a3;
      pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.9);opacity:0;}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 38%,rgba(22,30,52,.88) 0%,rgba(5,6,10,.95) 70%);
      z-index:500;text-align:center;cursor:pointer;
      font-family:"Courier New",monospace;color:#cfd8ea;}
  #overlay::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);}
  #overlay h1{font-size:36px;letter-spacing:9px;margin:0 0 6px;color:#f4f7ff;
      text-shadow:0 0 22px rgba(120,160,255,.5),0 0 4px rgba(200,220,255,.8),0 3px 0 rgba(0,0,0,.6);}
  #overlay h2{font-size:15px;letter-spacing:5px;margin:0 0 22px;color:#8fa3c8;font-weight:400;
      text-shadow:0 1px 0 #000;}
  #overlay h2::before,#overlay h2::after{content:"\2014";color:#3d4a66;margin:0 10px;}
  #overlay .ctl{display:inline-block;text-align:left;font-size:12px;letter-spacing:2px;line-height:2.1;
      color:#aab6cf;border:1px solid rgba(140,160,210,.3);border-radius:6px;padding:16px 26px;margin-bottom:22px;
      background:linear-gradient(180deg,rgba(16,20,32,.9),rgba(8,10,16,.9));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.6);}
  #overlay .ctl b{color:#ffe9a3;display:inline-block;min-width:150px;
      text-shadow:0 0 8px rgba(255,210,120,.35);}
  #overlay .stats{display:inline-block;min-width:250px;margin-bottom:22px;text-align:left;
      border:1px solid rgba(140,160,210,.3);border-radius:6px;padding:14px 26px;
      background:linear-gradient(180deg,rgba(16,20,32,.9),rgba(8,10,16,.9));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.6);}
  #overlay .stats .row{display:flex;justify-content:space-between;align-items:baseline;gap:34px;
      font-size:11px;letter-spacing:3px;color:#8fa3c8;padding:6px 0;
      border-bottom:1px dashed rgba(140,160,210,.14);}
  #overlay .stats .row:last-child{border-bottom:none;}
  #overlay .stats .row em{font-style:normal;color:#ffe9a3;font-size:15px;letter-spacing:2px;
      text-shadow:0 0 9px rgba(255,210,120,.45);}
  #overlay .go{font-size:13px;letter-spacing:3px;color:#ffe9a3;animation:blink 1.2s steps(2) infinite;}
  @keyframes blink{50%{opacity:.25;}}
  #overlay .vol{font-size:12px;letter-spacing:2px;color:#aab6cf;margin-bottom:18px;}
  #overlay .vol input[type=range]{width:150px;vertical-align:middle;accent-color:#ffe9a3;cursor:pointer;}
  #touch{position:fixed;inset:0;z-index:450;display:none;pointer-events:none;}
  #stickBase{position:absolute;left:36px;bottom:110px;width:96px;height:96px;border-radius:50%;
      border:2px solid rgba(200,215,240,.35);background:rgba(20,24,36,.22);}
  #stickKnob{position:absolute;left:30px;top:30px;width:36px;height:36px;border-radius:50%;
      background:rgba(200,215,240,.4);}
  .tbtn{position:absolute;width:62px;height:62px;border-radius:50%;pointer-events:auto;
      border:2px solid rgba(200,215,240,.35);background:rgba(20,24,36,.32);color:#cfd8ea;
      font:700 11px/58px "Courier New",monospace;text-align:center;letter-spacing:1px;
      -webkit-user-select:none;user-select:none;touch-action:none;}
  #btnFire{right:28px;bottom:96px;}
  #btnUse{right:104px;bottom:152px;}
  #btnWpn{right:104px;bottom:40px;}
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<canvas id="mm"></canvas>
<div id="hud">
  <span>HEALTH <b id="uhp">100</b></span>
  <span>AMMO <b id="uam">24</b></span>
  <span>SHELLS <b id="ush">0</b></span>
  <span>FLOOR <b id="ulv">1</b></span>
  <span>KILLS <b id="ukl">0/0</b></span>
</div>
<div id="note"></div>
<div id="overlay"></div>
<div id="touch">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div class="tbtn" id="btnFire">FIRE</div>
  <div class="tbtn" id="btnUse">USE</div>
  <div class="tbtn" id="btnWpn">WPN</div>
</div>

<!-- arcade-shared:start -->
<script>
/* Arcade shared runtime.
   Single source of truth for cross-game boilerplate. build-arcade.py injects
   this into every game between the arcade-shared markers (and keeps the copies
   in sync on each run) — edit THIS file, then run: python3 build-arcade.py */
(function () {
  "use strict";

  /* ---- safe storage: never throws (Safari private mode, disabled storage) ---- */
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, String(v)); return true; } catch (e) { return false; } },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} },
    num: function (k) { var n = parseFloat(store.get(k)); return isFinite(n) ? n : 0; },
    json: function (k) { try { return JSON.parse(store.get(k)); } catch (e) { return null; } }
  };

  /* ---- audio: one wrap of the AudioContext constructor gives us both
     a tab-hidden auto-suspend and an arcade-wide master volume ----
     Every context's .destination is rerouted through a shared gain node, so
     the settings panel's master volume applies to every game with no per-game
     wiring; the games' own volume sliders keep working underneath it.
     Only contexts *we* suspended are resumed, so a game's own
     mute-by-suspend behaviour is left alone. */
  var contexts = [];
  var autoSuspended = [];
  var masters = [];
  function masterLevel() {
    if (store.get("arcade_master_muted") === "1") return 0;
    var v = parseFloat(store.get("arcade_master"));
    return isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1;
  }
  function applyMaster() {
    var lvl = masterLevel();
    masters.forEach(function (g) {
      try { g.gain.setTargetAtTime(lvl, g.context.currentTime, 0.02); } catch (e) {}
    });
  }
  ["AudioContext", "webkitAudioContext"].forEach(function (name) {
    var Orig = window[name];
    if (!Orig) return;
    function Patched() {
      var ctx = arguments.length
        ? new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))()
        : new Orig();
      contexts.push(ctx);
      try {
        var realDest = ctx.destination;
        var master = ctx.createGain();
        master.gain.value = masterLevel();
        master.connect(realDest);
        Object.defineProperty(ctx, "destination", {
          get: function () { return master; },
          configurable: true
        });
        masters.push(master);
      } catch (e) { /* master volume is best-effort */ }
      return ctx;
    }
    Patched.prototype = Orig.prototype;
    window[name] = Patched;
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      contexts.forEach(function (ctx) {
        if (ctx.state === "running") {
          autoSuspended.push(ctx);
          ctx.suspend().catch(function () {});
        }
      });
    } else {
      autoSuspended.splice(0).forEach(function (ctx) {
        if (ctx.state === "suspended") ctx.resume().catch(function () {});
      });
    }
  });

  /* ---- reduced motion: tame decorative CSS animation, expose a flag the
     games consult for canvas effects (shake, flashes, particles). The OS
     setting is the default; the settings panel can override it either way
     (arcade_rm: "auto" | "on" | "off"). ---- */
  var rmQuery = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reducedMotion() {
    var o = store.get("arcade_rm");
    if (o === "on") return true;
    if (o === "off") return false;
    return !!(rmQuery && rmQuery.matches);
  }
  var rmStyle = document.createElement("style");
  (document.head || document.documentElement).appendChild(rmStyle);
  function syncRMStyle() {
    rmStyle.textContent = reducedMotion()
      ? "*,*::before,*::after{animation-duration:.01ms !important;" +
        "animation-iteration-count:1 !important;transition-duration:.01ms !important;" +
        "scroll-behavior:auto !important}"
      : "";
  }
  syncRMStyle();
  if (rmQuery && rmQuery.addEventListener) rmQuery.addEventListener("change", syncRMStyle);

  /* ---- on-screen touch controls ----
     Created on demand by a game calling arcade.touch.* at the end of its own
     script. Nothing is shown unless the pointer is coarse (or ?touch=1 forces
     them for testing). Key buttons synthesize keydown/keyup on window+document
     with both .key and .code set, so games keep their existing handlers. */
  var touchOn = (window.matchMedia && matchMedia("(pointer: coarse)").matches) ||
                /[?&]touch=1\b/.test(location.search);
  var touchLayer = null;
  function ensureLayer() {
    if (!touchLayer) {
      touchLayer = document.createElement("div");
      touchLayer.id = "arcade-touch";
      touchLayer.style.cssText =
        "position:fixed;inset:0;z-index:15000;pointer-events:none;" +
        "user-select:none;-webkit-user-select:none";
      (document.body || document.documentElement).appendChild(touchLayer);
    }
    return touchLayer;
  }
  function mkEl(style, size) {
    var el = document.createElement("div");
    el.style.cssText =
      "position:absolute;pointer-events:auto;touch-action:none;box-sizing:border-box;" +
      "width:" + size + "px;height:" + size + "px;border-radius:50%;" +
      "background:rgba(140,160,210,.13);border:1px solid rgba(140,160,210,.45);" +
      "color:rgba(232,236,248,.85);display:flex;align-items:center;justify-content:center;" +
      "font:700 13px/1 system-ui,sans-serif;letter-spacing:1px;" + (style || "");
    return el;
  }
  function sendKey(type, key, code) {
    var ev = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true });
    window.dispatchEvent(ev);
    document.dispatchEvent(ev);
  }
  function touchButton(o) {
    if (!touchOn) return null;
    var el = mkEl(o.style, o.size || 54);
    el.textContent = o.label || "";
    if (o.label) el.dataset.k = o.label;
    var timer = 0;
    function down(e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.style.background = "rgba(140,160,210,.34)";
      if (o.onDown) o.onDown();
      if (o.repeat) timer = setInterval(function () { if (o.onDown) o.onDown(); }, o.repeat);
    }
    function up() {
      el.style.background = "rgba(140,160,210,.13)";
      if (timer) { clearInterval(timer); timer = 0; }
      if (o.onUp) o.onUp();
    }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    ensureLayer().appendChild(el);
    return el;
  }
  function keyButton(o) {
    var held = false;
    return touchButton({
      label: o.label, style: o.style, size: o.size, repeat: o.repeat,
      onDown: function () { held = true; sendKey("keydown", o.key, o.code || o.key); },
      onUp: function () { if (held) { held = false; sendKey("keyup", o.key, o.code || o.key); } }
    });
  }
  function dpad(o) {
    if (!touchOn) return;
    var s = o.size || 52, g = o.gap || 6;
    var bx = o.left != null ? o.left : 16, by = o.bottom != null ? o.bottom : 16;
    function at(cx, cy) { return "left:" + cx + "px;bottom:" + cy + "px"; }
    var m = o.map;
    keyButton({ label: "▲", key: m.up.key, code: m.up.code, size: s, repeat: o.repeat, style: at(bx + s + g, by + 2 * (s + g)) });
    keyButton({ label: "◀", key: m.left.key, code: m.left.code, size: s, repeat: o.repeat, style: at(bx, by + s + g) });
    keyButton({ label: "▶", key: m.right.key, code: m.right.code, size: s, repeat: o.repeat, style: at(bx + 2 * (s + g), by + s + g) });
    keyButton({ label: "▼", key: m.down.key, code: m.down.code, size: s, repeat: o.repeat, style: at(bx + s + g, by) });
  }
  function arrowDpad(o) {
    o = o || {};
    o.map = {
      up: { key: "ArrowUp", code: "ArrowUp" }, down: { key: "ArrowDown", code: "ArrowDown" },
      left: { key: "ArrowLeft", code: "ArrowLeft" }, right: { key: "ArrowRight", code: "ArrowRight" }
    };
    return dpad(o);
  }
  function stick(o) {
    if (!touchOn) return null;
    var size = o.size || 124;
    var base = mkEl(o.style, size);
    if (o.label) base.dataset.k = o.label;
    var knob = document.createElement("div");
    knob.style.cssText =
      "position:absolute;width:44%;height:44%;border-radius:50%;pointer-events:none;" +
      "background:rgba(140,160,210,.4);left:50%;top:50%;transform:translate(-50%,-50%)";
    base.appendChild(knob);
    var active = false;
    function setKnob(nx, ny) {
      knob.style.left = (50 + nx * 32) + "%";
      knob.style.top = (50 + ny * 32) + "%";
    }
    function report(e) {
      var r = base.getBoundingClientRect();
      var dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      var dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      var mag = Math.hypot(dx, dy);
      if (mag > 1) { dx /= mag; dy /= mag; }
      setKnob(dx, dy);
      if (o.onMove) o.onMove(dx, dy, true);
    }
    base.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { base.setPointerCapture(e.pointerId); } catch (err) {}
      active = true;
      report(e);
    });
    base.addEventListener("pointermove", function (e) { if (active) report(e); });
    function end() {
      if (!active) return;
      active = false;
      setKnob(0, 0);
      if (o.onMove) o.onMove(0, 0, false);
    }
    base.addEventListener("pointerup", end);
    base.addEventListener("pointercancel", end);
    ensureLayer().appendChild(base);
    return base;
  }

  /* ---- play-time heartbeat: the hub sorts and labels cards from this ----
     Standalone pages identify themselves by filename; inside the all-in-one
     bundle the overlay stamps data-arcade-game on the iframe. The smoke
     harness's srcdoc frames carry no stamp, so test runs never pollute it. */
  var GAME_ID = (function () {
    try {
      if (window.frameElement && window.frameElement.dataset.arcadeGame)
        return window.frameElement.dataset.arcadeGame;
      if (window.frameElement) return null; /* unstamped frame (smoke harness) */
    } catch (e) { return null; }
    var p = location.pathname.split("/").pop();
    return /\.html$/.test(p) && ["index.html", "arcade.html", "smoke.html"].indexOf(p) === -1 ? p : null;
  })();
  if (GAME_ID) {
    var visSince = document.hidden ? 0 : Date.now();
    var metaFlush = function () {
      var add = 0, now = Date.now();
      if (visSince) { add = (now - visSince) / 1000; visSince = document.hidden ? 0 : now; }
      else if (add === 0) return; /* hidden and idle: not "playing" */
      var meta = store.json("arcade_meta_v1") || {};
      var g = meta[GAME_ID] || (meta[GAME_ID] = { secs: 0 });
      g.secs = Math.round((g.secs || 0) + add);
      g.last = now;
      store.set("arcade_meta_v1", JSON.stringify(meta));
    };
    metaFlush();
    setInterval(metaFlush, 15000);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { metaFlush(); visSince = 0; }
      else visSince = Date.now();
    });
    window.addEventListener("pagehide", metaFlush);
  }

  /* ---- settings panel: gear chip on the right edge; Escape closes.
     Master volume and motion apply to every game through the shared
     runtime, so this is the same panel with the same behaviour everywhere. */
  var panel = null, chip = null;
  function settingsOpen() { return !!(panel && panel.style.display !== "none"); }
  function motionLabel() {
    var o = store.get("arcade_rm");
    return o === "on" ? "MOTION: REDUCED" : o === "off" ? "MOTION: FULL" : "MOTION: AUTO";
  }
  function buildPanel() {
    if (panel) return;
    panel = document.createElement("div");
    panel.id = "arcade-settings";
    panel.style.cssText =
      "position:fixed;inset:0;z-index:16000;display:none;" +
      "background:rgba(4,6,12,.55);user-select:none;-webkit-user-select:none";
    var card = document.createElement("div");
    card.style.cssText =
      "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);" +
      "min-width:260px;padding:22px 26px;border-radius:14px;" +
      "background:rgba(14,17,30,.96);border:1px solid rgba(140,160,210,.4);" +
      "color:#e8ecf8;font:13px/1.5 system-ui,sans-serif";
    card.innerHTML =
      '<div style="font:700 13px/1 system-ui;letter-spacing:3px;margin-bottom:16px">ARCADE SETTINGS</div>' +
      '<label style="font-size:11px;letter-spacing:2px;color:#8b94b0">MASTER VOLUME</label><br>' +
      '<input id="arc-set-vol" type="range" min="0" max="100" style="width:100%;margin:6px 0 14px">' +
      '<button id="arc-set-mute" style="' + btnCss() + '"></button> ' +
      '<button id="arc-set-rm" style="' + btnCss() + '"></button>' +
      '<div style="font-size:11px;color:#8b94b0;margin-top:14px">Applies to every game. ' +
      'Per-game volume controls still work underneath.<br>Esc closes.</div>';
    panel.appendChild(card);
    panel.addEventListener("pointerdown", function (e) { if (e.target === panel) toggleSettings(false); });
    (document.body || document.documentElement).appendChild(panel);

    var vol = card.querySelector("#arc-set-vol");
    var mute = card.querySelector("#arc-set-mute");
    var rm = card.querySelector("#arc-set-rm");
    function syncUI() {
      var v = parseFloat(store.get("arcade_master"));
      vol.value = Math.round((isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1) * 100);
      mute.textContent = store.get("arcade_master_muted") === "1" ? "UNMUTE" : "MUTE";
      rm.textContent = motionLabel();
    }
    vol.addEventListener("input", function () {
      store.set("arcade_master", vol.value / 100);
      store.set("arcade_master_muted", "0");
      applyMaster(); syncUI();
    });
    mute.addEventListener("click", function () {
      store.set("arcade_master_muted", store.get("arcade_master_muted") === "1" ? "0" : "1");
      applyMaster(); syncUI();
    });
    rm.addEventListener("click", function () {
      var o = store.get("arcade_rm");
      store.set("arcade_rm", o === "on" ? "off" : o === "off" ? "auto" : "on");
      syncRMStyle(); syncUI();
    });
    panel.syncUI = syncUI;
  }
  function btnCss() {
    return "font:700 11px/1 system-ui;letter-spacing:2px;color:#cfd8ea;cursor:pointer;" +
      "background:rgba(140,160,210,.12);border:1px solid rgba(140,160,210,.4);" +
      "padding:8px 12px;border-radius:999px";
  }
  function toggleSettings(show) {
    buildPanel();
    var to = show != null ? show : !settingsOpen();
    panel.style.display = to ? "block" : "none";
    if (to) panel.syncUI();
  }
  function mountChip() {
    if (chip || !document.body) return;
    chip = document.createElement("div");
    chip.id = "arcade-settings-chip";
    chip.title = "Arcade settings";
    chip.textContent = "⚙";
    chip.style.cssText =
      "position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:15990;" +
      "width:30px;height:30px;border-radius:50%;display:flex;align-items:center;" +
      "justify-content:center;cursor:pointer;font-size:15px;color:#cfd8ea;" +
      "background:rgba(10,12,20,.6);border:1px solid rgba(140,160,210,.35);" +
      "opacity:.4;transition:opacity .15s;user-select:none;-webkit-user-select:none";
    chip.addEventListener("mouseenter", function () { chip.style.opacity = "1"; });
    chip.addEventListener("mouseleave", function () { chip.style.opacity = ".4"; });
    chip.addEventListener("click", function () { toggleSettings(); });
    document.body.appendChild(chip);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountChip);
  } else {
    mountChip();
  }
  /* capture-phase: while the panel is open, keys belong to the panel */
  window.addEventListener("keydown", function (e) {
    if (!settingsOpen()) return;
    if (e.key === "Escape") toggleSettings(false);
    e.stopImmediatePropagation();
    e.preventDefault();
  }, true);
  window.addEventListener("keyup", function (e) {
    if (settingsOpen()) e.stopImmediatePropagation();
  }, true);

  window.arcade = {
    store: store,
    reducedMotion: reducedMotion,
    settings: { open: function () { toggleSettings(true); }, close: function () { toggleSettings(false); } },
    /* clamp a rAF delta so a backgrounded tab doesn't produce a huge step */
    clampDt: function (dt, max) { return Math.min(Math.max(dt, 0), max || 0.1); },

    run: (function () {

        sample: function (t) {

                        score: Number(score) || 0,

          try {
            var prevRaw = localStorage.getItem(localKey(ghost.game));
            var prev = prevRaw ? JSON.parse(prevRaw) : null;
            if (!prev || ghost.score > prev.score) {
              localStorage.setItem(localKey(ghost.game), JSON.stringify(ghost));
            }

          return post('/api/ghost', ghost);

        discard: function () { cur = null; },
        /* Best available ghost: the server's if reachable, else the local one. */
        best: function (game) {

            var raw = localStorage.getItem(localKey(game));

              .then(function (r) { return r.json(); })

                if (remote && (!local || remote.score > local.score)) return remote;
                return local;

        at: function (ghost, t) {

// and worn flagstone floor receding into cool fog at the horizon
var bg = (function(){
  var c = document.createElement('canvas'); c.width = W; c.height = H;
  var x = c.getContext('2d'), gr, i, y;
  // ceiling: cool blue-black falling to fog
  gr = x.createLinearGradient(0, 0, 0, H / 2);
  gr.addColorStop(0, '#2c313c'); gr.addColorStop(0.75, '#141822'); gr.addColorStop(1, '#0c0f18');
  x.fillStyle = gr; x.fillRect(0, 0, W, H / 2);
  // perspective panel seams, denser toward the horizon
  for (i = 1; i < 14; i++){
    y = Math.round(H / 2 - (H * 0.52) / i);
    if (y < 0) continue;
    var fade = Math.max(0.03, 0.17 - i * 0.012);
    x.fillStyle = 'rgba(0,0,0,' + fade.toFixed(3) + ')';
    x.fillRect(0, y, W, 1);
    x.fillStyle = 'rgba(160,180,220,' + (fade * 0.4).toFixed(3) + ')';
    x.fillRect(0, y + 1, W, 1);
  }
  // faint cool light panels overhead
  for (i = 0; i < 6; i++){
    var px0 = 20 + i * 54, pw = 26 - i * 2;
    x.fillStyle = 'rgba(140,170,220,0.05)';
    x.fillRect(px0, 4 + i * 2, pw, 10);
  }
  // ceiling grain
  for (i = 0; i < 260; i++){
    y = (Math.random() * (H / 2)) | 0;
    x.fillStyle = (i & 1) ? 'rgba(0,0,0,0.1)' : 'rgba(170,190,230,0.04)';
    x.fillRect((Math.random() * W) | 0, y, 2, 1);
  }
  // floor: warm worn stone falling away into the same cool fog
  gr = x.createLinearGradient(0, H / 2, 0, H);
  gr.addColorStop(0, '#0d1018'); gr.addColorStop(0.3, '#1a1712'); gr.addColorStop(1, '#4a4034');
  x.fillStyle = gr; x.fillRect(0, H / 2, W, H / 2);
  // perspective noise bands suggesting flagstone rows
  for (i = 1; i < 16; i++){
    y = Math.round(H / 2 + (H * 0.52) / i);
    if (y >= H) continue;
    var a = Math.max(0.03, 0.2 - i * 0.013);
    x.fillStyle = 'rgba(0,0,0,' + a.toFixed(3) + ')';
    x.fillRect(0, y, W, 1);

    x.fillRect(0, y + 1, W, 1);
  }
  // floor grain + occasional stains
  for (i = 0; i < 340; i++){
    y = H / 2 + ((Math.random() * (H / 2)) | 0);
    var deep = (y - H / 2) / (H / 2);
    x.fillStyle = (i & 1) ? 'rgba(0,0,0,' + (0.06 + deep * 0.1).toFixed(3) + ')'
                          : 'rgba(210,180,140,' + (deep * 0.05).toFixed(3) + ')';
    x.fillRect((Math.random() * W) | 0, y, 1 + ((Math.random() * 3) | 0), 1);
  }
  // horizon fog glow band
  gr = x.createLinearGradient(0, H / 2 - 9, 0, H / 2 + 9);
  gr.addColorStop(0, 'rgba(16,22,38,0)');
  gr.addColorStop(0.5, 'rgba(22,30,52,0.55)');
  gr.addColorStop(1, 'rgba(16,22,38,0)');

var AC = null, MG = null, muted = false;
var volume = 0.7;
try {
  var vs0 = parseFloat(localStorage.getItem('arcade_volume'));
  if (isFinite(vs0)) volume = Math.min(1, Math.max(0, vs0));
} catch (e) {}
function ac(){
  if (!AC){
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MG = AC.createGain();
    MG.gain.value = volume;
    MG.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function setVolume(v){
  volume = Math.min(1, Math.max(0, v));
  if (MG) MG.gain.value = volume;
  try { localStorage.setItem('arcade_volume', String(volume)); } catch (e) {}
}
function tone(f0, f1, dur, type, vol, when){
  if (muted) return;
  try {
    var c = ac(), o = c.createOscillator(), gn = c.createGain();
    var t = c.currentTime + (when || 0);
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(MG);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noiseB(dur, vol, fq, when){
  if (muted) return;
  try {
    var c = ac(), n = c.createBufferSource();
    var b = c.createBuffer(1, Math.max(1, (c.sampleRate * dur) | 0), c.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    n.buffer = b;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fq; f.Q.value = 0.8;
    var gn = c.createGain(); gn.gain.value = vol;
    n.connect(f); f.connect(gn); gn.connect(MG);
    n.start(c.currentTime + (when || 0));
  } catch (e) {}
}

function saveBest(n){

    if (n > b) localStorage.setItem('rc_best_level', String(n));

function tileAt(x, y){
  if (x < 0 || y < 0 || x >= GW || y >= GH) return 1;
  return grid[y * GW + x];
}
function doorAt(x, y){ return doors.get(y * GW + x); }

function loadLevel(i){
  li = i;
  var rows = MAPS[i].m;
  GH = rows.length;
  GW = 0;
  for (var r = 0; r < GH; r++) if (rows[r].length > GW) GW = rows[r].length;
  grid = new Uint8Array(GW * GH);
  explored = new Uint8Array(GW * GH);
  doors = new Map(); enemies = []; items = []; parts = [];
  kills = 0;
  secretsTotal = 0; secretsFound = 0; pushes = [];
  p.keyGold = false; p.keySilver = false;
  for (var y = 0; y < GH; y++){
    var row = rows[y];
    for (var x = 0; x < GW; x++){
      var ch = x < row.length ? row[x] : '1';
      var t = 0;
      if (ch === '1') t = 1;
      else if (ch === '2') t = 2;
      else if (ch === '3') t = 3;
      else if (ch === '4' || ch === '5' || ch === '6'){ t = ch.charCodeAt(0) - 48; secretsTotal++; }
      else if (ch === 'D'){ t = 8; doors.set(y * GW + x, { open: 0, opening: false, lock: null }); }
      else if (ch === 'G'){ t = 10; doors.set(y * GW + x, { open: 0, opening: false, lock: 'gold' }); }
      else if (ch === 'S'){ t = 11; doors.set(y * GW + x, { open: 0, opening: false, lock: 'silver' }); }
      else if (ch === 'X') t = 9;
      else if (ch === 'P'){ p.x = x + 0.5; p.y = y + 0.5; }
      else if (ch === 'g') enemies.push({ x: x + 0.5, y: y + 0.5, hp: 2, state: 'idle', t: 0, cool: 1, animT: Math.random() * 9 });
      else if (ch === 'h') items.push({ x: x + 0.5, y: y + 0.5, kind: 'h', taken: false });
      else if (ch === 'a') items.push({ x: x + 0.5, y: y + 0.5, kind: 'a', taken: false });
      else if (ch === 'k') items.push({ x: x + 0.5, y: y + 0.5, kind: 'k', taken: false });
      else if (ch === 's') items.push({ x: x + 0.5, y: y + 0.5, kind: 's', taken: false });
      else if (ch === 'w') items.push({ x: x + 0.5, y: y + 0.5, kind: 'w', taken: false });
      else if (ch === 'c') items.push({ x: x + 0.5, y: y + 0.5, kind: 'c', taken: false });
      grid[y * GW + x] = t;
    }
  }
  totalEnemies = enemies.length;
  // baked sector lighting: deterministic per tile, some corridors run dim,
  // a few zones carry a failing fixture that flickers (visual only)
  lightMap = new Float32Array(GW * GH);
  flickMap = new Uint8Array(GW * GH);
  for (y = 0; y < GH; y++){
    for (x = 0; x < GW; x++){
      var hsh = ((x * 73856093) ^ (y * 19349663) ^ ((i + 1) * 83492791)) >>> 0;
      var lt = 1;
      if (hsh % 7 === 0) lt = 0.8;
      if (hsh % 13 === 0) lt = 0.62;
      if (hsh % 23 === 0){ lt = 0.72; flickMap[y * GW + x] = 1; }
      lightMap[y * GW + x] = lt;
    }
  }
  p.dx = 1; p.dy = 0; p.plx = 0; p.ply = 0.66;
  mm.width = GW * 5; mm.height = GH * 5;
  mm.style.width = (GW * 10) + 'px';
}

function startLevel(i){
  loadLevel(i);
  if (p.ammo < 16) p.ammo = 16;
  if (p.hasShotgun && p.shells < 4) p.shells = 4;
  paused = false;
  state = 'playing';
  ov.style.display = 'none';

// ============================================================= COLLISION
function canMove(x, y){
  var r = 0.22;
  for (var tx = Math.floor(x - r); tx <= Math.floor(x + r); tx++){
    for (var ty = Math.floor(y - r); ty <= Math.floor(y + r); ty++){
      var t = tileAt(tx, ty);
      if (t === 0) continue;
      if (isDoorTile(t)){ var d = doorAt(tx, ty); if (d && d.open >= 0.9) continue; }
      lastBlock = { x: tx, y: ty, t: t };
      return false;
    }
  }
  return true;
}
function canMoveEnt(x, y, self){
  var r = 0.28;
  for (var tx = Math.floor(x - r); tx <= Math.floor(x + r); tx++){
    for (var ty = Math.floor(y - r); ty <= Math.floor(y + r); ty++){
      var t = tileAt(tx, ty);
      if (t === 0) continue;
      if (isDoorTile(t)){ var d = doorAt(tx, ty); if (d && d.open >= 0.9) continue; }
      return false;
    }
  }
  for (var i = 0; i < enemies.length; i++){
    var o = enemies[i];
    if (o === self || o.state === 'dead' || o.state === 'die') continue;
    if (Math.hypot(o.x - x, o.y - y) < 0.55) return false;
  }
  return true;
}
function hasKeyFor(lock){ return lock === 'gold' ? p.keyGold : p.keySilver; }
function openDoor(d){
  if (!d) return;
  if (d.lock && !hasKeyFor(d.lock)){
    if (lockMsgT <= 0){
      lockMsgT = 0.9; SND.locked();
      note('LOCKED - NEED THE ' + d.lock.toUpperCase() + ' KEY');
    }
    return;
  }
  if (!d.opening && d.open < 1){ d.opening = true; SND.door(); }
}
function bump(){
  if (!lastBlock) return;
  if (isDoorTile(lastBlock.t)) openDoor(doorAt(lastBlock.x, lastBlock.y));
  else if (lastBlock.t === 9) completeLevel();
}
function movePlayer(nx, ny){
  lastBlock = null;
  if (canMove(nx, p.y)) p.x = nx; else bump();
  lastBlock = null;
  if (canMove(p.x, ny)) p.y = ny; else bump();
}
function useKey(){
  if (state !== 'playing' || paused) return;
  var dists = [0.6, 1.1];
  for (var i = 0; i < dists.length; i++){
    var tx = Math.floor(p.x + p.dx * dists[i]);
    var ty = Math.floor(p.y + p.dy * dists[i]);
    var t = tileAt(tx, ty);
    if (isDoorTile(t)){ openDoor(doorAt(tx, ty)); return; }
    if (t === 9){ completeLevel(); return; }
    if (t >= 4 && t <= 6){ pushWall(tx, ty, t); return; }
  }
}
function pushWall(tx, ty, t){
  for (var i = 0; i < pushes.length; i++)
    if (pushes[i].x === tx && pushes[i].y === ty) return;
  var dx = 0, dy = 0;
  if (Math.abs(p.dx) > Math.abs(p.dy)) dx = p.dx > 0 ? 1 : -1;
  else dy = p.dy > 0 ? 1 : -1;
  if (tileAt(tx + dx, ty + dy) !== 0){ SND.locked(); note('IT WILL NOT BUDGE'); return; }
  pushes.push({ x: tx, y: ty, t: t, dx: dx, dy: dy, steps: 0, timer: 0.12 });
  secretsFound++;
  SND.secret();
  note('A SECRET PASSAGE OPENS');
}
function updatePushes(dt){
  for (var i = pushes.length - 1; i >= 0; i--){
    var w = pushes[i];
    w.timer -= dt;
    if (w.timer > 0) continue;
    var nx = w.x + w.dx, ny = w.y + w.dy;
    if (tileAt(nx, ny) !== 0){ pushes.splice(i, 1); continue; }
    var occupied = (Math.floor(p.x) === nx && Math.floor(p.y) === ny);
    for (var j = 0; j < enemies.length && !occupied; j++){
      var e = enemies[j];
      if (e.state !== 'dead' && Math.floor(e.x) === nx && Math.floor(e.y) === ny) occupied = true;
    }
    if (occupied){ w.timer = 0.2; continue; }
    grid[ny * GW + nx] = w.t;
    grid[w.y * GW + w.x] = 0;
    w.x = nx; w.y = ny; w.steps++;
    SND.door();
    if (w.steps >= 2) pushes.splice(i, 1);
    else w.timer = 0.32;
  }
}

// ============================================================= COMBAT
function los(x0, y0, x1, y1){
  var dx = x1 - x0, dy = y1 - y0;
  var dist = Math.hypot(dx, dy);
  var steps = Math.max(1, Math.ceil(dist * 4));
  for (var i = 1; i < steps; i++){
    var t = i / steps;
    var tx = Math.floor(x0 + dx * t), ty = Math.floor(y0 + dy * t);
    var tl = tileAt(tx, ty);
    if (tl === 0) continue;
    if (isDoorTile(tl)){
      var d = doorAt(tx, ty);
      if (d && d.open > 0.7) continue;
      return false;
    }
    return false;
  }
  return true;
}
function damagePlayer(d, sx, sy){
  if (state !== 'playing') return;
  p.hp -= d; hurtT = 1; SND.hurt();
  hurtFrom = (sx !== undefined) ? aimAngle(sx - p.x, sy - p.y) : 0;
  if (p.hp <= 0){ p.hp = 0; showGameOver(); }
}
function alertNear(r){
  for (var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if (e.state === 'idle' && Math.hypot(e.x - p.x, e.y - p.y) < r){ e.state = 'chase'; e.cool = 0.8; }
  }
}
function hitEnemy(e, dmg){
  e.hp -= dmg;
  if (e.hp <= 0){
    e.state = 'die'; e.t = 0.45; kills++; SND.edie();
  } else {
    e.state = 'chase'; e.cool = Math.min(e.cool, 0.5);
  }
}
function aimAngle(dx, dy){
  var a = Math.atan2(dy, dx) - Math.atan2(p.dy, p.dx);
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
function switchWeapon(w){
  if (state !== 'playing' || paused || w === p.weapon) return;
  if (w === 1 && !p.hasShotgun){ note('NO SHOTGUN YET'); return; }
  p.weapon = w;
  fireCool = Math.max(fireCool, 0.25);
  SND.click();
  note(w === 1 ? 'SHOTGUN READY' : 'PISTOL READY');
}
function shoot(){
  if (state !== 'playing' || paused || fireCool > 0) return;
  if (p.weapon === 1){ shootShotgun(); return; }
  fireCool = 0.28;
  if (p.ammo <= 0){ SND.click(); note('OUT OF AMMO'); return; }
  p.ammo--; recoil = 1; flashT = 0.07; SND.shot();
  spawnCasing(0);
  alertNear(9);
  var best = null, bd = 1e9;
  for (var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if (e.state === 'dead' || e.state === 'die') continue;
    var dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
    if (d > 18 || d < 0.01) continue;
    if (Math.abs(aimAngle(dx, dy)) > Math.atan2(0.42, d)) continue;
    if (!los(p.x, p.y, e.x, e.y)) continue;
    if (d < bd){ bd = d; best = e; }
  }
  if (best) hitEnemy(best, Math.random() < 0.45 ? 2 : 1);
}
function shootShotgun(){
  fireCool = 0.95;
  if (p.shells <= 0){ SND.click(); note('OUT OF SHELLS'); fireCool = 0.4; return; }
  p.shells--; recoil = 1.6; flashT = 0.1; SND.sshot();
  spawnCasing(1);
  alertNear(11);
  for (var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if (e.state === 'dead' || e.state === 'die') continue;
    var dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
    if (d > 9 || d < 0.01) continue;
    if (Math.abs(aimAngle(dx, dy)) > 0.26 + 0.3 / Math.max(1, d)) continue;
    if (!los(p.x, p.y, e.x, e.y)) continue;
    hitEnemy(e, d < 2.5 ? 3 : d < 5 ? 2 : 1);
  }
}
// ejected casings - purely cosmetic screen-space particles
function spawnCasing(kind){
  parts.push({
    x: W / 2 + 8, y: H - 52,
    vx: 55 + Math.random() * 45, vy: -95 - Math.random() * 40,
    rot: Math.random() * 6.28, vr: 9 + Math.random() * 8,
    life: 0.9, kind: kind
  });
  if (kind === 1){
    parts.push({
      x: W / 2 + 6, y: H - 50,
      vx: 40 + Math.random() * 30, vy: -70 - Math.random() * 30,
      rot: Math.random() * 6.28, vr: -8 - Math.random() * 6,
      life: 0.8, kind: 2
    });
  }
}
function updateParts(dt){
  for (var i = parts.length - 1; i >= 0; i--){
    var q = parts[i];
    q.life -= dt;
    if (q.life <= 0 || q.y > H + 8){ parts.splice(i, 1); continue; }
    q.vy += 520 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.rot += q.vr * dt;
  }
}
function drawParts(){
  for (var i = 0; i < parts.length; i++){
    var q = parts[i];
    g.save();
    g.translate(q.x, q.y);
    g.rotate(q.rot);
    g.globalAlpha = Math.min(1, q.life * 3);
    if (q.kind === 1){                       // shotgun shell: red hull, brass head
      g.fillStyle = '#b84040'; g.fillRect(-3, -2, 6, 4);
      g.fillStyle = '#c9a23f'; g.fillRect(-3, -2, 2, 4);
    } else if (q.kind === 2){                // smoke wad
      g.fillStyle = 'rgba(190,190,200,0.5)';
      g.fillRect(-2, -2, 4, 4);
    } else {                                 // pistol brass
      g.fillStyle = '#c9a23f'; g.fillRect(-2, -1, 5, 2);
      g.fillStyle = '#ffe9a3'; g.fillRect(-2, -1, 1, 2);
    }
    g.restore();
  }
  g.globalAlpha = 1;
}

// ============================================================= UPDATE
function updateEnemies(dt){
  for (var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    e.animT += dt;
    if (e.state === 'dead') continue;
    if (e.state === 'die'){ e.t -= dt; if (e.t <= 0) e.state = 'dead'; continue; }
    var dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy);
    if (e.state === 'idle'){
      if (dist < 10 && los(e.x, e.y, p.x, p.y)){
        e.state = 'chase'; e.cool = 0.6 + Math.random() * 0.7; SND.alert();
      }
      continue;
    }
    if (e.state === 'aim'){
      e.t -= dt;
      if (!los(e.x, e.y, p.x, p.y)){ e.state = 'chase'; e.cool = 0.4; continue; }
      if (e.t <= 0){
        e.state = 'fire'; e.t = 0.16; SND.eshot();
        var pHit = Math.max(0.15, 0.8 - dist * 0.05);
        if (Math.random() < pHit) damagePlayer(4 + ((Math.random() * 9) | 0), e.x, e.y);
      }
      continue;
    }
    if (e.state === 'fire'){
      e.t -= dt;
      if (e.t <= 0){ e.state = 'chase'; e.cool = 0.9 + Math.random() * 0.9; }
      continue;
    }
    // chase
    e.cool -= dt;
    var sees = los(e.x, e.y, p.x, p.y);
    if (sees && e.cool <= 0 && dist < 11){ e.state = 'aim'; e.t = 0.4; continue; }
    if (dist > 1.6){
      var sp = 1.55 * dt;
      var nx = e.x + (dx / dist) * sp, ny = e.y + (dy / dist) * sp;
      if (canMoveEnt(nx, e.y, e)) e.x = nx;
      if (canMoveEnt(e.x, ny, e)) e.y = ny;
    }
  }
}
function updateItems(){
  for (var i = 0; i < items.length; i++){
    var it = items[i];
    if (it.taken) continue;
    if (Math.hypot(it.x - p.x, it.y - p.y) < 0.65){
      if (it.kind === 'h'){
        if (p.hp >= 100) continue;
        p.hp = Math.min(100, p.hp + 25); note('+25 HEALTH');
      } else if (it.kind === 'a'){
        if (p.ammo >= 99) continue;
        p.ammo = Math.min(99, p.ammo + 8); note('+8 AMMO');
      } else if (it.kind === 'k'){
        p.keyGold = true; note('PICKED UP THE GOLD KEY');
      } else if (it.kind === 's'){
        p.keySilver = true; note('PICKED UP THE SILVER KEY');
      } else if (it.kind === 'w'){
        if (p.hasShotgun){
          if (p.shells >= 50) continue;

function rot(a){
  var c = Math.cos(a), s = Math.sin(a);
  var dx = p.dx * c - p.dy * s; p.dy = p.dx * s + p.dy * c; p.dx = dx;
  var px = p.plx * c - p.ply * s; p.ply = p.plx * s + p.ply * c; p.plx = px;
}
function update(dt){
  fireCool = Math.max(0, fireCool - dt);
  recoil = Math.max(0, recoil - dt * 5);
  flashT = Math.max(0, flashT - dt);
  hurtT = Math.max(0, hurtT - dt * 2.2);
  lockMsgT = Math.max(0, lockMsgT - dt);
  doors.forEach(function(d){
    if (d.opening && d.open < 1) d.open = Math.min(1, d.open + dt * 1.6);
  });
  updatePushes(dt);
  if (touchFire) shoot();
  var ms = 3.4 * dt, ts = 2.6 * dt;
  if (K.ArrowLeft) rot(-ts);
  if (K.ArrowRight) rot(ts);
  var f = 0, s = 0;
  if (K.KeyW || K.ArrowUp) f += 1;
  if (K.KeyS || K.ArrowDown) f -= 1;
  if (K.KeyA) s -= 1;
  if (K.KeyD) s += 1;
  f += tMoveF; s += tMoveS;
  if (f || s){
    var l = Math.hypot(f, s);
    if (l > 1){ f /= l; s /= l; }
    movePlayer(p.x + (p.dx * f - p.dy * s) * ms, p.y + (p.dy * f + p.dx * s) * ms);
    bob += dt * 9; mv = Math.min(1, mv + dt * 8);
  } else {
    mv = Math.max(0, mv - dt * 6);
  }
  updateEnemies(dt);
  updateItems();
  updateParts(dt);
  noteT = Math.max(0, noteT - dt);
}

function castWalls(){
  var flashBoost = flashT > 0 ? Math.min(1, flashT * 14) : 0;
  for (var x = 0; x < W; x++){
    var cx = 2 * x / W - 1;
    var rdx = p.dx + p.plx * cx, rdy = p.dy + p.ply * cx;
    var mapX = Math.floor(p.x), mapY = Math.floor(p.y);
    var ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
    var stepX, sdx, stepY, sdy;
    if (rdx < 0){ stepX = -1; sdx = (p.x - mapX) * ddx; } else { stepX = 1; sdx = (mapX + 1 - p.x) * ddx; }
    if (rdy < 0){ stepY = -1; sdy = (p.y - mapY) * ddy; } else { stepY = 1; sdy = (mapY + 1 - p.y) * ddy; }
    var side = 0, hit = 0, tile = 0, perp = 0, wallX = 0, tex = null, steps = 0;
    while (!hit && steps++ < 80){
      if (sdx < sdy){ sdx += ddx; mapX += stepX; side = 0; }
      else { sdy += ddy; mapY += stepY; side = 1; }
      tile = tileAt(mapX, mapY);
      if (mapX >= 0 && mapY >= 0 && mapX < GW && mapY < GH) explored[mapY * GW + mapX] = 1;
      if (tile === 0) continue;
      if (isDoorTile(tile)){
        var dr = doors.get(mapY * GW + mapX);
        if (!dr || dr.open >= 1) continue;
        var dist;
        if (side === 0) dist = (mapX - p.x + (1 - stepX) / 2 + stepX * 0.5) / rdx;
        else dist = (mapY - p.y + (1 - stepY) / 2 + stepY * 0.5) / rdy;
        var hx = p.x + rdx * dist, hy = p.y + rdy * dist;
        if (Math.floor(hx) !== mapX || Math.floor(hy) !== mapY) continue;
        wallX = (side === 0 ? hy : hx); wallX -= Math.floor(wallX);
        wallX += dr.open;
        if (wallX >= 1) continue;
        perp = dist;
        tex = (tile === 10 ? TXG : tile === 11 ? TXS : TXD)[side];
        hit = 1;
      } else {
        if (side === 0) perp = (mapX - p.x + (1 - stepX) / 2) / rdx;
        else perp = (mapY - p.y + (1 - stepY) / 2) / rdy;
        wallX = (side === 0 ? p.y + perp * rdy : p.x + perp * rdx);
        wallX -= Math.floor(wallX);
        tex = (tile === 9 ? TXX : (tile >= 4 && tile <= 6) ? TXP[tile] : TXW[tile])[side];
        hit = 1;
      }
    }
    if (!hit){ zbuf[x] = 1e9; continue; }
    perp = Math.max(perp, 0.02);
    zbuf[x] = perp;
    var texX = (wallX * TEX) | 0;
    if (!isDoorTile(tile)){
      if (side === 0 && rdx > 0) texX = TEX - texX - 1;
      if (side === 1 && rdy < 0) texX = TEX - texX - 1;
    }
    var lh = H / perp, ds = (H - lh) / 2;
    g.drawImage(tex, texX, 0, 1, TEX, x, ds, 1, lh);
    // cool blue-black distance fog combined with baked sector light;
    // flicker zones pulse, and muzzle flash briefly lights nearby walls
    var lt = 1;
    if (mapX >= 0 && mapY >= 0 && mapX < GW && mapY < GH){
      var lidx = mapY * GW + mapX;
      lt = lightMap[lidx];
      if (flickMap[lidx]) lt *= flickVal;
    }
    var dk = Math.min(0.9, Math.max(0, (perp - 1.4) / 12) + (1 - lt) * 0.55);
    if (flashBoost > 0) dk = Math.max(0, dk - flashBoost * Math.max(0, 1 - perp / 5.5) * 0.6);
    if (dk > 0.02){
      g.fillStyle = 'rgba(9,12,24,' + dk.toFixed(2) + ')';
      g.fillRect(x, Math.max(0, ds), 1, Math.min(H, Math.ceil(lh)));
    } else if (flashBoost > 0 && perp < 3){
      g.fillStyle = 'rgba(255,200,110,' + (flashBoost * 0.08).toFixed(2) + ')';
      g.fillRect(x, Math.max(0, ds), 1, Math.min(H, Math.ceil(lh)));
    }
  }
}
function guardCanvas(e){
  if (e.state === 'dead') return SPR.dead;
  if (e.state === 'die') return SPR.die;
  if (e.state === 'aim') return SPR.aim;
  if (e.state === 'fire') return SPR.fire;
  if (e.state === 'chase') return (Math.floor(e.animT * 5) % 2) ? SPR.walk2 : SPR.walk1;
  return SPR.walk1;
}
function drawSprites(){
  var list = [];
  var i, e, it, dx, dy;
  for (i = 0; i < enemies.length; i++){
    e = enemies[i];
    dx = e.x - p.x; dy = e.y - p.y;
    list.push({ x: e.x, y: e.y, c: guardCanvas(e), sc: 1, d: dx * dx + dy * dy });
  }
  for (i = 0; i < items.length; i++){
    it = items[i];
    if (it.taken) continue;
    dx = it.x - p.x; dy = it.y - p.y;
    var ic, isc = 0.55;
    var glint = ((nowT * 2.4 + it.x * 0.7 + it.y * 1.3) % 3) < 0.5;  // periodic sparkle
    if (it.kind === 'h') ic = SPR.med;
    else if (it.kind === 'a') ic = SPR.amm;
    else if (it.kind === 'k'){ ic = glint ? SPR.keyGoldS : SPR.keyGold; isc = 0.5; }
    else if (it.kind === 's'){ ic = glint ? SPR.keySilverS : SPR.keySilver; isc = 0.5; }
    else if (it.kind === 'w'){ ic = SPR.sgun; isc = 0.6; }
    else ic = SPR.shell;
    list.push({ x: it.x, y: it.y, c: ic, sc: isc, d: dx * dx + dy * dy,
                bob: true, ph: it.x * 3.1 + it.y * 1.7 });
  }
  list.sort(function(a, b){ return b.d - a.d; });
  var invDet = 1 / (p.plx * p.dy - p.dx * p.ply);
  for (i = 0; i < list.length; i++){
    var s = list[i];
    var sx = s.x - p.x, sy = s.y - p.y;
    var tx = invDet * (p.dy * sx - p.dx * sy);
    var ty = invDet * (-p.ply * sx + p.plx * sy);
    if (ty <= 0.08) continue;
    var screenX = (W / 2) * (1 + tx / ty);
    var fullH = Math.abs(H / ty);
    var size = fullH * s.sc;
    var shift = (fullH - size) / 2;
    var y0 = H / 2 - size / 2 + shift;
    if (s.bob) y0 += Math.sin(nowT * 2.6 + s.ph) * size * 0.05;
    var x0 = screenX - size / 2;
    var a = Math.min(1, Math.max(0.12, 1.35 - ty / 14));
    g.globalAlpha = a;
    var st0 = Math.max(0, Math.floor(x0));
    var st1 = Math.min(W - 1, Math.ceil(x0 + size));
    for (var st = st0; st <= st1; st++){
      if (ty >= zbuf[st]) continue;
      var texX = Math.floor((st - x0) / size * TEX);
      if (texX < 0 || texX >= TEX) continue;
      g.drawImage(s.c, texX, 0, 1, TEX, st, y0, 1, size);
    }
    g.globalAlpha = 1;
  }
}

  if (e.repeat) return;
  K[e.code] = true;
  if (e.code === 'KeyM'){ muted = !muted; note(muted ? 'SOUND OFF' : 'SOUND ON'); }
  else if (e.code === 'KeyG'){ cycleRes(); note('RENDER ' + W + '\u00d7' + H); }
  else if (e.code === 'Tab' && state === 'playing'){
    mmOn = !mmOn; mm.style.display = mmOn ? 'block' : 'none';
  }
  else if (e.code === 'KeyP'){ if (state === 'playing') paused = !paused; }
  else if (e.code === 'Digit1'){ switchWeapon(0); }
  else if (e.code === 'Digit2'){ switchWeapon(1); }
  else if (e.code === 'KeyQ'){ switchWeapon(p.weapon === 0 ? 1 : 0); }
  else if (e.code === 'Enter'){ if (state !== 'playing') advance(); }
  else if (e.code === 'Space'){ if (state === 'playing') shoot(); }
  else if (e.code === 'KeyE'){ if (state === 'playing') useKey(); }
});
addEventListener('keyup', function(e){ K[e.code] = false; });
addEventListener('blur', function(){ for (var k in K) K[k] = false; });

cv.addEventListener('mousedown', function(){
  if (state !== 'playing' || paused) return;
  if (document.pointerLockElement === cv) shoot();
  else if (cv.requestPointerLock) cv.requestPointerLock();
  else shoot();
});
addEventListener('mousemove', function(e){
  if (document.pointerLockElement === cv && state === 'playing' && !paused) rot(e.movementX * 0.0022);
});

// ============================================================= TOUCH
var touchUI = document.getElementById('touch');
var stickBase = document.getElementById('stickBase');
var stickKnob = document.getElementById('stickKnob');
var touchShown = false;
var stickId = -1, stickCX = 0, stickCY = 0;
var turnId = -1, turnLX = 0;
function showTouch(){
  if (touchShown) return;
  touchShown = true;
  touchUI.style.display = 'block';
}
function bindBtn(id, down, up){
  var el = document.getElementById(id);
  el.addEventListener('touchstart', function(ev){
    ev.preventDefault(); ev.stopPropagation(); showTouch(); down();
  }, { passive: false });
  el.addEventListener('touchend', function(ev){
    ev.preventDefault(); ev.stopPropagation(); if (up) up();
  }, { passive: false });
  el.addEventListener('touchcancel', function(){ if (up) up(); });
}
bindBtn('btnFire', function(){ touchFire = true; shoot(); }, function(){ touchFire = false; });
bindBtn('btnUse', function(){ useKey(); });
bindBtn('btnWpn', function(){ switchWeapon(p.weapon === 0 ? 1 : 0); });
function resetStick(){
  stickId = -1; tMoveF = 0; tMoveS = 0;
  stickKnob.style.left = '30px'; stickKnob.style.top = '30px';
  stickBase.style.left = '36px'; stickBase.style.top = 'auto'; stickBase.style.bottom = '110px';
}
addEventListener('touchstart', function(ev){
  showTouch();
  if (state !== 'playing') return;      // let overlay taps click through
  var grab = false;
  for (var i = 0; i < ev.changedTouches.length; i++){
    var t = ev.changedTouches[i];
    if (t.clientX < innerWidth / 2){
      if (stickId === -1){
        stickId = t.identifier; stickCX = t.clientX; stickCY = t.clientY;
        stickBase.style.left = (t.clientX - 48) + 'px';
        stickBase.style.top = (t.clientY - 48) + 'px';
        stickBase.style.bottom = 'auto';
        grab = true;
      }
    } else if (turnId === -1){
      turnId = t.identifier; turnLX = t.clientX;
      grab = true;
    }
  }
  if (grab && ev.cancelable) ev.preventDefault();
}, { passive: false });
addEventListener('touchmove', function(ev){
  if (state !== 'playing') return;
  var handled = false;
  for (var i = 0; i < ev.changedTouches.length; i++){
    var t = ev.changedTouches[i];
    if (t.identifier === stickId){
      var dx = t.clientX - stickCX, dy = t.clientY - stickCY;
      var m = Math.hypot(dx, dy);
      if (m > 44){ dx = dx / m * 44; dy = dy / m * 44; }
      stickKnob.style.left = (30 + dx) + 'px';
      stickKnob.style.top = (30 + dy) + 'px';
      tMoveF = Math.abs(dy) > 8 ? -dy / 44 : 0;
      tMoveS = Math.abs(dx) > 8 ? dx / 44 : 0;
      handled = true;
    } else if (t.identifier === turnId){
      if (!paused) rot((t.clientX - turnLX) * 0.006);
      turnLX = t.clientX;
      handled = true;
    }
  }
  if (handled && ev.cancelable) ev.preventDefault();
}, { passive: false });
function endTouch(ev){
  for (var i = 0; i < ev.changedTouches.length; i++){
    var t = ev.changedTouches[i];
    if (t.identifier === stickId) resetStick();
    else if (t.identifier === turnId) turnId = -1;
  }
}
addEventListener('touchend', endTouch);
addEventListener('touchcancel', endTouch);

// ============================================================= MAIN LOOP
var last = 0;
function frame(ts){
  var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  last = ts;
  nowT = ts / 1000;
  if (state === 'playing' && !paused) update(dt);
  else noteT = Math.max(0, noteT - dt);
  render();
  requestAnimationFrame(frame);
}
loadLevel(0);
showTitle();
requestAnimationFrame(frame);
</script>
