  } else {
    pText('LEFT / RIGHT or A / D ....... carve', cy - 64, 13, '#cfd8ea');
    pText('DOWN or S ................... tuck', cy - 42, 13, '#cfd8ea');
    pText('UP / SPACE in the air ...... trick', cy - 20, 13, '#cfd8ea');
  }
  pText('gates = combo · chained tricks multiply', cy + 6, 13, '#8fa2c4');
  pText('ramps = air · M mute · P pause', cy + 24, 13, '#8fa2c4');
  pText('do not get eaten.', cy + 46, 13, '#d98079');
  pText('BEST ' + best + ' m', cy + 74, 15, '#eef3fa');
  var db = (daily && daily.date === todayStr) ? daily.dist + ' m' : '--';
  pText((isTouch ? 'TAP HERE' : 'D') + ' — DAILY CHALLENGE  ·  best today ' + db, cy + 106, 13, '#7ea8e8');
  if ((gTime * 1.5 | 0) % 2 === 0) pText(isTouch ? 'TAP TO SKI' : 'PRESS ENTER', cy + 148, 17, '#ffffff');
  // decorative skier
  ctx.save();
  ctx.translate(W / 2 + 185, cy - 125);
  ctx.rotate(0.3);
  ctx.strokeStyle = '#d9372f'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(-14, -2); ctx.moveTo(8, -14); ctx.lineTo(14, -2); ctx.stroke();
  ctx.fillStyle = '#d9372f'; ctx.fillRect(-7, -20, 14, 18);
  ctx.fillStyle = '#f0c8a0'; ctx.beginPath(); ctx.arc(0, -26, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#17315e'; ctx.beginPath(); ctx.arc(0, -28, 6, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#c23b2e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-6, 2); ctx.lineTo(-6, 22); ctx.moveTo(6, 2); ctx.lineTo(6, 22); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.restore();
}

function drawOver(){
  var cy = H * 0.5;
  panel(W / 2 - 230, cy - 160, 460, 340);
  pText('EATEN.', cy - 108, 40, '#d98079');
  pText(dailyMode ? 'daily challenge · ' + todayStr : 'the mountain always wins', cy - 80, 12, '#8fa2c4');
  pText('DISTANCE  ' + Math.floor(dist) + ' m' + (newBest ? '   ★ NEW BEST ★' : ''), cy - 36, 16, '#eef3fa');
  pText('STYLE     ' + style, cy - 10, 14, '#cfd8ea');
  pText('GATES     ' + gatesPassed + '  (best combo x' + bestCombo + ')', cy + 14, 14, '#cfd8ea');
  pText('TRICKS    ' + tricksDone, cy + 38, 14, '#cfd8ea');
  if (dailyMode && daily && daily.date === todayStr){
    pText('DAILY BEST ' + daily.dist + ' m  ·  ALL-TIME ' + best + ' m', cy + 62, 14, '#7ea8e8');
  } else {
    pText('BEST      ' + best + ' m', cy + 62, 14, '#8fa2c4');
  }
  pText(isTouch ? '' : 'T — TITLE', cy + 90, 12, '#8fa2c4');
  if ((gTime * 1.5 | 0) % 2 === 0) pText(isTouch ? 'TAP — RESTART' : 'ENTER / R — RESTART', cy + 128, 15, '#ffffff');
}

/* ---------------- main draw ---------------- */
function draw(){
  ctx.save();
  if (shake > 0 && !arcade.reducedMotion()){
    ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
  }

  drawSnow();
  drawPatches();
  drawTrail();
  for (var i = 0; i < ramps.length; i++) drawRamp(ramps[i]);

  // painter's sort for upright things
  var items = [];
  for (var a = 0; a < obs.length; a++){
    (function(o){
      items.push({ y: o.y, f: function(){
        if (o.t === 'tree') drawTree(o);
        else if (o.t === 'rock') drawRock(o);
        else if (o.t === 'mogul') drawMogul(o);
        else drawStump(o);
      }});
    })(obs[a]);
  }
  for (var b = 0; b < gates.length; b++){
    (function(g){ items.push({ y: g.y, f: function(){ drawGate(g); } }); })(gates[b]);
  }
  for (var c = 0; c < npcs.length; c++){
    (function(u){ items.push({ y: u.y, f: function(){
      if (u.t === 'skier') drawLittleSkier(u);
      else if (u.t === 'boarder') drawBoarder(u);
      else drawDog(u);
    }});})(npcs[c]);
  }
  if (state === 'play' || state === 'eaten' || state === 'over'){
    if (!(state === 'eaten' || (state === 'over' && eater))){
      items.push({ y: player.wy, f: drawPlayer });
    }
    for (var d2 = 0; d2 < monsters.length; d2++){
      (function(m){
        items.push({ y: m.wy, f: function(){ drawMonster(m, m === eater); } });
      })(monsters[d2]);
    }
  }
  items.sort(function(p1, p2){ return p1.y - p2.y; });
  for (var e2 = 0; e2 < items.length; e2++) items[e2].f();

  if (state === 'play' && !player.air && player.tumble <= 0) drawScarf();
  drawFloats();
  ctx.restore();

  if (state === 'play' || state === 'eaten'){
    drawBlizzard();
    drawFlourish();
  }

  if (state === 'title') drawTitle();
  else if (state === 'over') drawOver();
  else drawHUD();

  if (state === 'play' && paused) drawPause();
}

/* ---------------- loop ---------------- */
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
