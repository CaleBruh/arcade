<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battleship</title>
<style>
  :root {
    --bg: #04090f;
    --bg2: #0a1826;
    --panel: #1b2630;
    --panel-deep: #121a22;
    --brass: #c9a45c;
    --brass-hi: #f0d794;
    --brass-dk: #6e5524;
    --label: #a98e4e;
    --text: #d9e7f2;
    --accent: #46d0ff;
    --sea-deep: #052036;
    --sea-mid: #0a3a63;
    --sea-light: #14558d;
    --hit: #ff4d3d;
    --hit-deep: #b3170c;
    --miss: #bfe6ff;
    --ship: #66788a;
    --ship-hi: #a4b6c6;
    --ship-dk: #37424d;
    --ok: #35d27a;
    --bad: #ff5a5a;
    --sunk: #1d1512;
    --cell: 36px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    background:
      radial-gradient(1100px 520px at 50% -8%, #123250 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,170,220,.025) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(120,170,220,.025) 0 1px, transparent 1px 44px),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 12px 40px;
  }
  header { text-align: center; margin-bottom: 16px; }
  h1 {
    font-size: 32px;
    letter-spacing: 9px;
    font-weight: 700;
    background: linear-gradient(180deg, var(--brass-hi) 0%, var(--brass) 48%, #8a6a2d 62%, #e8cf8a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.8)) drop-shadow(0 0 16px rgba(201,164,92,.25));
  }
  #phase-msg {
    margin-top: 7px;
    font-size: 15px;
    min-height: 22px;
    color: var(--text);
    letter-spacing: 1px;
  }
  #phase-msg strong { color: var(--accent); }

  #layout {
    display: flex;
    gap: 26px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ---------- brass-and-steel panels ---------- */
  .board-wrap, #controls, #log-wrap {
    position: relative;
    background:
      radial-gradient(circle 4px at 10px 10px,                     #e7d49a 0 1.2px, #5f4b1e 2px, transparent 3.4px),
      radial-gradient(circle 4px at calc(100% - 10px) 10px,        #e7d49a 0 1.2px, #5f4b1e 2px, transparent 3.4px),
      radial-gradient(circle 4px at 10px calc(100% - 10px),        #e7d49a 0 1.2px, #5f4b1e 2px, transparent 3.4px),
      radial-gradient(circle 4px at calc(100% - 10px) calc(100% - 10px), #e7d49a 0 1.2px, #5f4b1e 2px, transparent 3.4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, var(--panel) 0%, var(--panel-deep) 100%);
    border: 1px solid var(--brass-dk);
    border-radius: 10px;
    padding: 14px 16px 18px;
    box-shadow:
      inset 0 0 0 1px rgba(201,164,92,.18),
      inset 0 1px 0 rgba(255,255,255,.06),
      0 10px 34px rgba(0,0,0,.55);
  }
  .board-wrap h2 {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--label);
    text-align: center;
    margin-bottom: 10px;
    font-weight: 700;
    text-shadow: 0 -1px 0 rgba(0,0,0,.9), 0 1px 0 rgba(255,235,180,.14);
  }

  /* ---------- radar emblem ---------- */
  .radar {
    position: absolute;
    top: 9px;
    right: 11px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(201,164,92,.55);
    overflow: hidden;
    background:
      radial-gradient(circle, transparent 0 29%, rgba(90,220,150,.3) 30% 33%, transparent 34% 60%, rgba(90,220,150,.3) 61% 64%, transparent 65%),
      linear-gradient(rgba(90,220,150,.25), rgba(90,220,150,.25)) center / 100% 1px no-repeat,
      linear-gradient(rgba(90,220,150,.25), rgba(90,220,150,.25)) center / 1px 100% no-repeat,
      radial-gradient(circle at 50% 50%, #0c2b1d 0%, #06160f 100%);
    box-shadow: inset 0 0 6px rgba(0,0,0,.8), 0 0 8px rgba(70,200,130,.18);
  }
  .radar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(110,255,170,.8) 0deg, rgba(110,255,170,.1) 70deg, transparent 100deg 360deg);
    animation: sweep 3.4s linear infinite;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  /* ---------- boards & animated sea ---------- */
  .board {
    position: relative;
    display: grid;
    grid-template-columns: 22px repeat(10, var(--cell));
    grid-template-rows: 22px repeat(10, var(--cell));
    gap: 2px;
    user-select: none;
  }
  .board::before {
    content: "";
    position: absolute;
    left: 24px; top: 24px; right: 0; bottom: 0;
    border-radius: 6px;
    background:
      radial-gradient(140% 90% at 20% 0%, rgba(80,170,255,.16), transparent 55%),
      repeating-linear-gradient(115deg, rgba(120,200,255,.06) 0 14px, transparent 14px 32px),
      repeating-linear-gradient(245deg, rgba(40,130,220,.09) 0 10px, transparent 10px 26px),
      linear-gradient(160deg, var(--sea-light) 0%, var(--sea-mid) 45%, var(--sea-deep) 100%);
    background-size: 100% 100%, 240% 240%, 240% 240%, 100% 100%;
    box-shadow: inset 0 0 22px rgba(0,8,18,.65);
    animation: seadrift 16s linear infinite;
  }
  @keyframes seadrift {
    0%   { background-position: 0 0, 0 0, 0 0, 0 0; }
    100% { background-position: 0 0, 230px 168px, -190px 146px, 0 0; }
  }
  .board::after {
    content: "";
    position: absolute;
    left: 24px; top: 24px; right: 0; bottom: 0;
    border-radius: 6px;
    pointer-events: none;
    z-index: 2;
    background: linear-gradient(105deg,
      transparent 30%,
      rgba(190,230,255,.09) 45%,
      rgba(225,242,255,.15) 50%,
      rgba(190,230,255,.09) 55%,
      transparent 70%);
    background-size: 300% 100%;
    mix-blend-mode: screen;
    animation: shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 130% 0; }
    100% { background-position: -130% 0; }
  }

  /* engraved coordinate labels */
  .lbl {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    font-family: Georgia, "Times New Roman", serif;
    color: #8d7a45;
    text-shadow: 0 -1px 0 rgba(0,0,0,.85), 0 1px 0 rgba(255,236,190,.14);
  }

  .cell {
    position: relative;
    z-index: 1;
    background: rgba(4,18,34,.22);
    border: 1px solid rgba(10,40,70,.6);
    border-radius: 3px;
    transition: background .15s, box-shadow .15s, transform .45s ease, filter .45s ease;
  }

  /* targeting crosshair */
  .board.enemy.active .cell:not(.hit):not(.miss) { cursor: crosshair; }
  .board.enemy.active .cell:not(.hit):not(.miss):hover {
    background: rgba(70,208,255,.14);
    box-shadow: inset 0 0 0 1px rgba(70,208,255,.85), 0 0 12px rgba(70,208,255,.35);
  }
  .board.enemy.active .cell:not(.hit):not(.miss):hover::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(var(--accent), var(--accent)) center / 1px 100% no-repeat,
      linear-gradient(var(--accent), var(--accent)) center / 100% 1px no-repeat;
    opacity: .75;
  }
  .board.enemy.active .cell:not(.hit):not(.miss):hover::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px dashed var(--accent);
    border-radius: 50%;
    animation: lockspin 1.6s linear infinite;
  }
  @keyframes lockspin { to { transform: rotate(360deg); } }

  #player-board.placing .cell { cursor: pointer; }

  /* ---------- ship silhouettes ---------- */
  .cell.ship {
    background: linear-gradient(180deg, var(--ship-hi) 0%, var(--ship) 46%, var(--ship-dk) 100%);
    border-color: #1d242b;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 3px rgba(0,0,0,.45),
      0 2px 5px rgba(0,0,0,.5);
  }
  /* deck line + hatch details along the hull */
  .cell.ship.h {
    background:
      linear-gradient(0deg, transparent 44%, rgba(16,22,28,.75) 44% 47%, rgba(230,240,248,.18) 47% 49%, transparent 49%),
      radial-gradient(circle at 50% 30%, rgba(236,244,250,.45) 0 1.6px, rgba(20,26,32,.6) 2.2px, transparent 3.2px),
      linear-gradient(180deg, var(--ship-hi) 0%, var(--ship) 46%, var(--ship-dk) 100%);
  }
  .cell.ship.v {
    background:
      linear-gradient(90deg, transparent 44%, rgba(16,22,28,.75) 44% 47%, rgba(230,240,248,.18) 47% 49%, transparent 49%),
      radial-gradient(circle at 30% 50%, rgba(236,244,250,.45) 0 1.6px, rgba(20,26,32,.6) 2.2px, transparent 3.2px),
      linear-gradient(90deg, var(--ship-hi) 0%, var(--ship) 46%, var(--ship-dk) 100%);
  }
  /* bow / stern rounding by position */
  .cell.ship.h.seg-first { border-radius: 62% 3px 3px 62% / 50% 3px 3px 50%; }
  .cell.ship.h.seg-last  { border-radius: 3px 55% 55% 3px / 3px 50% 50% 3px; }
  .cell.ship.v.seg-first { border-radius: 62% 62% 3px 3px / 50% 50% 3px 3px; }
  .cell.ship.v.seg-last  { border-radius: 3px 3px 55% 55% / 3px 3px 50% 50%; }
  .cell.ship.single      { border-radius: 50%; }
  /* merge internal borders so the hull reads as one piece */
  .cell.ship.h:not(.seg-last)  { border-right-color: transparent; }
  .cell.ship.h:not(.seg-first) { border-left-color: transparent; }
  .cell.ship.v:not(.seg-last)  { border-bottom-color: transparent; }
  .cell.ship.v:not(.seg-first) { border-top-color: transparent; }
  /* hull connectors bridging the grid gap */
  .cell.ship.h:not(.seg-last):not(.hit)::before {
    content: "";
    position: absolute;
    top: 2px; bottom: 2px; right: -5px; width: 6px;
    background: linear-gradient(180deg, var(--ship-hi), var(--ship) 46%, var(--ship-dk));
  }
  .cell.ship.v:not(.seg-last):not(.hit)::before {
    content: "";
    position: absolute;
    left: 2px; right: 2px; bottom: -5px; height: 6px;
    background: linear-gradient(90deg, var(--ship-hi), var(--ship) 46%, var(--ship-dk));
  }

  .cell.preview-ok  { background: var(--ok) !important;  box-shadow: inset 0 0 0 2px #baffd9; }
  .cell.preview-bad { background: var(--bad) !important; box-shadow: inset 0 0 0 2px #ffd0d0; }

  /* ---------- misses: sonar ripples ---------- */
  .board .cell.miss {
    background:
      radial-gradient(circle at 50% 50%, rgba(205,235,255,.95) 0 1.8px, rgba(205,235,255,.25) 2.6px, transparent 3.6px),
      rgba(12,48,84,.4);
    overflow: hidden;
  }
  .board .cell.miss::before,
  .board .cell.miss::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1px solid rgba(170,225,255,.85);
    animation: sonar 2.8s ease-out infinite;
  }
  .board .cell.miss::after { animation-delay: 1.4s; }
  @keyframes sonar {
    0%   { transform: scale(.3); opacity: .95; }
    70%  { opacity: .25; }
    100% { transform: scale(3.6); opacity: 0; }
  }

  /* ---------- hits: fire & smoke, scorched steel ---------- */
  .board .cell.hit {
    background: radial-gradient(circle at 50% 75%, rgba(80,40,18,.92) 0%, rgba(26,13,6,.95) 60%, #0d0603 100%);
    border-color: #000;
    box-shadow:
      inset 0 0 9px rgba(0,0,0,.9),
      inset 0 0 0 1px rgba(255,120,40,.22),
      0 0 10px rgba(255,110,30,.25);
    animation: boom .5s cubic-bezier(.2,1.6,.4,1);
  }
  .board .cell.hit::before {
    content: "";
    position: absolute;
    left: 15%; right: 15%; top: 12%; bottom: 16%;
    background:
      radial-gradient(60% 55% at 50% 80%, #fff3b0 0%, #ffc34d 32%, #ff7a1a 58%, rgba(255,60,0,.45) 78%, transparent 84%),
      radial-gradient(42% 62% at 32% 70%, #ffde7a 0%, #ff9a2a 45%, transparent 75%),
      radial-gradient(42% 62% at 68% 72%, #ffd060 0%, #ff8420 45%, transparent 75%);
    background-repeat: no-repeat;
    filter: drop-shadow(0 0 6px rgba(255,120,20,.8));
    transform-origin: 50% 92%;
    animation: flick .5s ease-in-out infinite alternate;
  }
  .board .cell.hit::after {
    content: "";
    position: absolute;
    left: 50%; top: -6px;
    width: 7px; height: 7px;
    margin-left: -3px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(135,135,145,.55), rgba(90,90,100,0) 70%);
    box-shadow: -6px 4px 0 1px rgba(115,115,125,.35), 5px 7px 0 0 rgba(100,100,110,.3);
    filter: blur(1px);
    animation: smoke 1.9s linear infinite;
  }
  @keyframes boom {
    0%   { transform: scale(0); opacity: 0; }
    55%  { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes flick {
    0%   { transform: scaleY(1) scaleX(1); opacity: .95; }
    50%  { transform: scaleY(1.16) scaleX(.9) translateY(-1px); opacity: 1; }
    100% { transform: scaleY(.88) scaleX(1.07); opacity: .85; }
  }
  @keyframes smoke {
    0%   { transform: translateY(9px) scale(.45); opacity: 0; }
    30%  { opacity: .7; }
    100% { transform: translateY(-15px) scale(1.7); opacity: 0; }
  }

  /* ---------- sunk: dark, listing wreck ---------- */
  .board .cell.sunk {
    background: linear-gradient(170deg, #241b16 0%, #120c09 55%, #070404 100%);
    border-color: #000;
    transform: rotate(-2.5deg) scale(.95) translateY(1px);
    filter: saturate(.55) brightness(.85);
    box-shadow: inset 0 0 10px rgba(0,0,0,.95);
    animation: sunkflash .8s ease-out;
  }
  .board .cell.sunk::before { opacity: .4; animation-duration: .9s; }
  .board .cell.sunk::after  { opacity: .9; animation-duration: 1.4s; }
  @keyframes sunkflash {
    0%, 30% { filter: brightness(2.1) saturate(1); }
    100%    { filter: brightness(.85) saturate(.55); }
  }

  /* ---------- mid column ---------- */
  #mid {
    width: 250px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #controls, #log-wrap { padding: 14px; }
  #ship-to-place {
    text-align: center;
    margin-bottom: 10px;
    font-size: 14px;
    min-height: 40px;
  }
  #ship-to-place .ship-name { color: var(--accent); font-weight: bold; letter-spacing: 1px; }
  .ship-preview {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-top: 6px;
  }
  .ship-preview span {
    width: 16px; height: 16px;
    background: linear-gradient(180deg, var(--ship-hi), var(--ship) 50%, var(--ship-dk));
    border-radius: 3px;
    border: 1px solid #1d242b;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3);
  }
  button {
    display: block;
    width: 100%;
    padding: 9px 10px;
    margin-top: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e6dfc9;
    background: linear-gradient(180deg, #3a4a5c 0%, #273442 55%, #1d2833 100%);
    border: 1px solid #141b23;
    border-radius: 7px;
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 0 0 1px rgba(201,164,92,.14),
      0 3px 8px rgba(0,0,0,.4);
    transition: filter .12s, transform .08s;
  }
  button:hover { filter: brightness(1.22); }
  button:active { transform: translateY(1px); }
  #new-game-btn {
    background: linear-gradient(180deg, #7a5c22 0%, #5a4316 55%, #453310 100%);
    border-color: #2e2208;
    color: #f4e7c3;
  }

  #power-bar { margin-top: 10px; display: flex; gap: 8px; align-items: center;
    justify-content: center; flex-wrap: wrap; font-family: inherit; }
  #intel-readout { font-size: 12px; letter-spacing: 2px; color: var(--accent); font-weight: 700; }
  .pw { display: inline-block; width: auto; flex: 0 0 auto; margin-top: 0;
    font: 700 11px/1 inherit; letter-spacing: 1.5px; cursor: pointer;
    color: #cfe4ff; background: rgba(90,140,210,.14); border: 1px solid rgba(120,170,230,.45);
    padding: 7px 11px; border-radius: 999px; transition: opacity .15s, background .15s; }
  .pw b { color: #ffd166; }
  .pw:disabled { opacity: .35; cursor: not-allowed; }
  .pw.armed { background: rgba(255,209,102,.22); border-color: #ffd166; color: #fff; }
  #pw-hint { font-size: 11px; color: var(--label); letter-spacing: 1px; }
  .cell .contact { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font: 700 11px/1 monospace; color: #8ee6ff;
    background: rgba(60,180,230,.16); pointer-events: none; }
  #difficulty-row { margin-top: 12px; text-align: center; }
  #difficulty-row .diff-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--label);
    text-shadow: 0 -1px 0 rgba(0,0,0,.8);
  }
  #difficulty-btns { display: flex; gap: 8px; }
  #difficulty-btns button { margin-top: 6px; }
  .diff-btn.sel {
    background: linear-gradient(180deg, #1f6ea8 0%, #14507e 100%);
    border-color: var(--accent);
    color: #eaf7ff;
    box-shadow: 0 0 10px rgba(70,208,255,.4), inset 0 0 0 1px rgba(70,208,255,.5);
  }
  #difficulty-ind {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--label);
    text-transform: uppercase;
  }

  /* ---------- battle log ---------- */
  #log-wrap h3 {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--label);
    margin-bottom: 8px;
    text-align: center;
    text-shadow: 0 -1px 0 rgba(0,0,0,.9), 0 1px 0 rgba(255,235,180,.14);
  }
  #log {
    height: 260px;
    overflow-y: auto;
    font-size: 12.5px;
    line-height: 1.5;
    padding-right: 4px;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: #3a4a5c; border-radius: 4px; }
  #log::-webkit-scrollbar-track { background: rgba(0,0,0,.3); }
  #log .entry {
    display: flex;
    gap: 7px;
    align-items: baseline;
    padding: 3px 0 3px 8px;
    border-left: 2px solid transparent;
    border-bottom: 1px solid rgba(201,164,92,.08);
    animation: fadein .3s ease-out;
  }
  #log .ts {
    font: 700 10px/1.5 "Courier New", monospace;
    color: #6d7f91;
    flex: none;
  }
  #log .you { color: #9fdcff; border-left-color: #2c89c9; }
  #log .foe { color: #ffb3a7; border-left-color: #b3402f; }
  #log .sys { color: #ffd98a; border-left-color: #8a6a2d; }
  #log .sunk-msg { font-weight: bold; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

  #fleet-status { margin-top: 10px; font-size: 12px; }
  #fleet-status .row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
  #fleet-status .dead { color: #ff7d6e; text-decoration: line-through; opacity: .7; }
  #fleet-status .pip {
    display: inline-block;
    width: 8px; height: 8px;
    margin-left: 3px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--ship-hi), var(--ship-dk));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.4);
  }

  /* ---------- victory / defeat overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: radial-gradient(1000px 700px at 50% 40%, rgba(10,26,44,.9), rgba(2,5,10,.96));
    backdrop-filter: blur(4px);
  }
  #overlay.show { display: flex; }
  #overlay:has(#overlay-title.win)  { background: radial-gradient(1000px 700px at 50% 40%, rgba(22,48,32,.92), rgba(3,8,5,.96)); }
  #overlay:has(#overlay-title.lose) { background: radial-gradient(1000px 700px at 50% 40%, rgba(58,14,10,.9), rgba(10,3,2,.96)); }
  #overlay-box {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #223040 0%, #101922 100%);
    border: 1px solid var(--brass-dk);
    border-radius: 14px;
    padding: 34px 48px;
    text-align: center;
    box-shadow: inset 0 0 0 1px rgba(201,164,92,.22), 0 20px 80px rgba(0,0,0,.8);
    animation: pop .35s cubic-bezier(.2,1.5,.4,1);
    max-width: 90vw;
  }
  #overlay-box::before {
    content: "";
    position: absolute;
    inset: -60%;
    pointer-events: none;
    background: repeating-conic-gradient(from 0deg, rgba(255,226,150,.05) 0deg 9deg, transparent 9deg 18deg);
    animation: rays 36s linear infinite;
  }
  #overlay:has(#overlay-title.lose) #overlay-box::before {
    background: repeating-conic-gradient(from 0deg, rgba(255,90,70,.04) 0deg 9deg, transparent 9deg 18deg);
  }
  @keyframes rays { to { transform: rotate(360deg); } }
  #overlay-box > * { position: relative; }

</style>

<!-- arcade-shared:start -->
<script>
/* Arcade shared runtime.
   Single source of truth for cross-game boilerplate. build-arcade.py injects
   this into every game between the arcade-shared markers (and keeps the copies
   in sync on each run) — edit THIS file, then run: python3 build-arcade.py */
(function () {
  "use strict";

  /* ---- safe storage: never throws (Safari private mode, disabled storage) ---- */
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, String(v)); return true; } catch (e) { return false; } },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} },
    num: function (k) { var n = parseFloat(store.get(k)); return isFinite(n) ? n : 0; },
    json: function (k) { try { return JSON.parse(store.get(k)); } catch (e) { return null; } }
  };

  /* ---- audio: one wrap of the AudioContext constructor gives us both
     a tab-hidden auto-suspend and an arcade-wide master volume ----
     Every context's .destination is rerouted through a shared gain node, so
     the settings panel's master volume applies to every game with no per-game
     wiring; the games' own volume sliders keep working underneath it.
     Only contexts *we* suspended are resumed, so a game's own
     mute-by-suspend behaviour is left alone. */
  var contexts = [];
  var autoSuspended = [];
  var masters = [];
  function masterLevel() {
    if (store.get("arcade_master_muted") === "1") return 0;
    var v = parseFloat(store.get("arcade_master"));
    return isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1;
  }
  function applyMaster() {
    var lvl = masterLevel();
    masters.forEach(function (g) {
      try { g.gain.setTargetAtTime(lvl, g.context.currentTime, 0.02); } catch (e) {}
    });
  }
  ["AudioContext", "webkitAudioContext"].forEach(function (name) {
    var Orig = window[name];
    if (!Orig) return;
    function Patched() {
      var ctx = arguments.length
        ? new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))()
        : new Orig();
      contexts.push(ctx);
      try {
        var realDest = ctx.destination;
        var master = ctx.createGain();
        master.gain.value = masterLevel();
        master.connect(realDest);
        Object.defineProperty(ctx, "destination", {
          get: function () { return master; },
          configurable: true
        });
        masters.push(master);
      } catch (e) { /* master volume is best-effort */ }
      return ctx;
    }
    Patched.prototype = Orig.prototype;
    window[name] = Patched;
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      contexts.forEach(function (ctx) {
        if (ctx.state === "running") {
          autoSuspended.push(ctx);
          ctx.suspend().catch(function () {});
        }
      });
    } else {
      autoSuspended.splice(0).forEach(function (ctx) {
        if (ctx.state === "suspended") ctx.resume().catch(function () {});
      });
    }
  });

  /* ---- reduced motion: tame decorative CSS animation, expose a flag the
     games consult for canvas effects (shake, flashes, particles). The OS
     setting is the default; the settings panel can override it either way
     (arcade_rm: "auto" | "on" | "off"). ---- */
  var rmQuery = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reducedMotion() {
    var o = store.get("arcade_rm");
    if (o === "on") return true;
    if (o === "off") return false;
    return !!(rmQuery && rmQuery.matches);
  }
  var rmStyle = document.createElement("style");
  (document.head || document.documentElement).appendChild(rmStyle);
  function syncRMStyle() {
    rmStyle.textContent = reducedMotion()
      ? "*,*::before,*::after{animation-duration:.01ms !important;" +
        "animation-iteration-count:1 !important;transition-duration:.01ms !important;" +
        "scroll-behavior:auto !important}"
      : "";
  }
  syncRMStyle();
  if (rmQuery && rmQuery.addEventListener) rmQuery.addEventListener("change", syncRMStyle);

  /* ---- on-screen touch controls ----
     Created on demand by a game calling arcade.touch.* at the end of its own
     script. Nothing is shown unless the pointer is coarse (or ?touch=1 forces
     them for testing). Key buttons synthesize keydown/keyup on window+document
     with both .key and .code set, so games keep their existing handlers. */
  var touchOn = (window.matchMedia && matchMedia("(pointer: coarse)").matches) ||
                /[?&]touch=1\b/.test(location.search);
  var touchLayer = null;
  function ensureLayer() {
    if (!touchLayer) {
      touchLayer = document.createElement("div");
      touchLayer.id = "arcade-touch";
      touchLayer.style.cssText =
        "position:fixed;inset:0;z-index:15000;pointer-events:none;" +
        "user-select:none;-webkit-user-select:none";
      (document.body || document.documentElement).appendChild(touchLayer);
    }
    return touchLayer;
  }
  function mkEl(style, size) {
    var el = document.createElement("div");
    el.style.cssText =
      "position:absolute;pointer-events:auto;touch-action:none;box-sizing:border-box;" +
      "width:" + size + "px;height:" + size + "px;border-radius:50%;" +
      "background:rgba(140,160,210,.13);border:1px solid rgba(140,160,210,.45);" +
      "color:rgba(232,236,248,.85);display:flex;align-items:center;justify-content:center;" +
      "font:700 13px/1 system-ui,sans-serif;letter-spacing:1px;" + (style || "");
    return el;
  }
  function sendKey(type, key, code) {
    var ev = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true });
    window.dispatchEvent(ev);
    document.dispatchEvent(ev);
  }
  function touchButton(o) {
    if (!touchOn) return null;
    var el = mkEl(o.style, o.size || 54);
    el.textContent = o.label || "";
    if (o.label) el.dataset.k = o.label;
    var timer = 0;
    function down(e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.style.background = "rgba(140,160,210,.34)";
      if (o.onDown) o.onDown();
      if (o.repeat) timer = setInterval(function () { if (o.onDown) o.onDown(); }, o.repeat);
    }
    function up() {
      el.style.background = "rgba(140,160,210,.13)";
      if (timer) { clearInterval(timer); timer = 0; }
      if (o.onUp) o.onUp();
    }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    ensureLayer().appendChild(el);
    return el;
  }
  function keyButton(o) {
    var held = false;
    return touchButton({
      label: o.label, style: o.style, size: o.size, repeat: o.repeat,
      onDown: function () { held = true; sendKey("keydown", o.key, o.code || o.key); },
      onUp: function () { if (held) { held = false; sendKey("keyup", o.key, o.code || o.key); } }
    });
  }
  function dpad(o) {
    if (!touchOn) return;
    var s = o.size || 52, g = o.gap || 6;
    var bx = o.left != null ? o.left : 16, by = o.bottom != null ? o.bottom : 16;
    function at(cx, cy) { return "left:" + cx + "px;bottom:" + cy + "px"; }
    var m = o.map;
    keyButton({ label: "▲", key: m.up.key, code: m.up.code, size: s, repeat: o.repeat, style: at(bx + s + g, by + 2 * (s + g)) });
    keyButton({ label: "◀", key: m.left.key, code: m.left.code, size: s, repeat: o.repeat, style: at(bx, by + s + g) });
    keyButton({ label: "▶", key: m.right.key, code: m.right.code, size: s, repeat: o.repeat, style: at(bx + 2 * (s + g), by + s + g) });
    keyButton({ label: "▼", key: m.down.key, code: m.down.code, size: s, repeat: o.repeat, style: at(bx + s + g, by) });
  }
  function arrowDpad(o) {
    o = o || {};
    o.map = {
      up: { key: "ArrowUp", code: "ArrowUp" }, down: { key: "ArrowDown", code: "ArrowDown" },
      left: { key: "ArrowLeft", code: "ArrowLeft" }, right: { key: "ArrowRight", code: "ArrowRight" }
    };
    return dpad(o);
  }
  function stick(o) {
    if (!touchOn) return null;
    var size = o.size || 124;
    var base = mkEl(o.style, size);
    if (o.label) base.dataset.k = o.label;
    var knob = document.createElement("div");
    knob.style.cssText =
      "position:absolute;width:44%;height:44%;border-radius:50%;pointer-events:none;" +
      "background:rgba(140,160,210,.4);left:50%;top:50%;transform:translate(-50%,-50%)";
    base.appendChild(knob);
    var active = false;
    function setKnob(nx, ny) {
      knob.style.left = (50 + nx * 32) + "%";
      knob.style.top = (50 + ny * 32) + "%";
    }
    function report(e) {
      var r = base.getBoundingClientRect();
      var dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      var dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      var mag = Math.hypot(dx, dy);
      if (mag > 1) { dx /= mag; dy /= mag; }
      setKnob(dx, dy);
      if (o.onMove) o.onMove(dx, dy, true);
    }
    base.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { base.setPointerCapture(e.pointerId); } catch (err) {}
      active = true;
      report(e);
    });
    base.addEventListener("pointermove", function (e) { if (active) report(e); });
    function end() {
      if (!active) return;
      active = false;
      setKnob(0, 0);
      if (o.onMove) o.onMove(0, 0, false);
    }
    base.addEventListener("pointerup", end);
    base.addEventListener("pointercancel", end);
    ensureLayer().appendChild(base);
    return base;
  }

  /* ---- play-time heartbeat: the hub sorts and labels cards from this ----
     Standalone pages identify themselves by filename; inside the all-in-one
     bundle the overlay stamps data-arcade-game on the iframe. The smoke
     harness's srcdoc frames carry no stamp, so test runs never pollute it. */
  var GAME_ID = (function () {
    try {
      if (window.frameElement && window.frameElement.dataset.arcadeGame)
        return window.frameElement.dataset.arcadeGame;
      if (window.frameElement) return null; /* unstamped frame (smoke harness) */
    } catch (e) { return null; }
    var p = location.pathname.split("/").pop();
    return /\.html$/.test(p) && ["index.html", "arcade.html", "smoke.html"].indexOf(p) === -1 ? p : null;
  })();
  if (GAME_ID) {
    var visSince = document.hidden ? 0 : Date.now();
    var metaFlush = function () {
      var add = 0, now = Date.now();
      if (visSince) { add = (now - visSince) / 1000; visSince = document.hidden ? 0 : now; }
      else if (add === 0) return; /* hidden and idle: not "playing" */
      var meta = store.json("arcade_meta_v1") || {};
      var g = meta[GAME_ID] || (meta[GAME_ID] = { secs: 0 });
      g.secs = Math.round((g.secs || 0) + add);
      g.last = now;
      store.set("arcade_meta_v1", JSON.stringify(meta));
    };
    metaFlush();
    setInterval(metaFlush, 15000);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { metaFlush(); visSince = 0; }
      else visSince = Date.now();
    });
    window.addEventListener("pagehide", metaFlush);
  }

  /* ---- settings panel: gear chip on the right edge; Escape closes.
     Master volume and motion apply to every game through the shared
     runtime, so this is the same panel with the same behaviour everywhere. */
  var panel = null, chip = null;
  function settingsOpen() { return !!(panel && panel.style.display !== "none"); }
  function motionLabel() {
    var o = store.get("arcade_rm");
    return o === "on" ? "MOTION: REDUCED" : o === "off" ? "MOTION: FULL" : "MOTION: AUTO";
  }
  function buildPanel() {
    if (panel) return;
    panel = document.createElement("div");
    panel.id = "arcade-settings";
    panel.style.cssText =
      "position:fixed;inset:0;z-index:16000;display:none;" +
      "background:rgba(4,6,12,.55);user-select:none;-webkit-user-select:none";
    var card = document.createElement("div");
    card.style.cssText =
      "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);" +
      "min-width:260px;padding:22px 26px;border-radius:14px;" +
      "background:rgba(14,17,30,.96);border:1px solid rgba(140,160,210,.4);" +
      "color:#e8ecf8;font:13px/1.5 system-ui,sans-serif";
    card.innerHTML =
      '<div style="font:700 13px/1 system-ui;letter-spacing:3px;margin-bottom:16px">ARCADE SETTINGS</div>' +
      '<label style="font-size:11px;letter-spacing:2px;color:#8b94b0">MASTER VOLUME</label><br>' +
      '<input id="arc-set-vol" type="range" min="0" max="100" style="width:100%;margin:6px 0 14px">' +
      '<button id="arc-set-mute" style="' + btnCss() + '"></button> ' +
      '<button id="arc-set-rm" style="' + btnCss() + '"></button>' +
      '<div style="font-size:11px;color:#8b94b0;margin-top:14px">Applies to every game. ' +
      'Per-game volume controls still work underneath.<br>Esc closes.</div>';
    panel.appendChild(card);
    panel.addEventListener("pointerdown", function (e) { if (e.target === panel) toggleSettings(false); });
    (document.body || document.documentElement).appendChild(panel);

    var vol = card.querySelector("#arc-set-vol");
    var mute = card.querySelector("#arc-set-mute");
    var rm = card.querySelector("#arc-set-rm");
    function syncUI() {
      var v = parseFloat(store.get("arcade_master"));
      vol.value = Math.round((isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1) * 100);
      mute.textContent = store.get("arcade_master_muted") === "1" ? "UNMUTE" : "MUTE";
      rm.textContent = motionLabel();
    }
    vol.addEventListener("input", function () {
      store.set("arcade_master", vol.value / 100);
      store.set("arcade_master_muted", "0");
      applyMaster(); syncUI();
    });
    mute.addEventListener("click", function () {
      store.set("arcade_master_muted", store.get("arcade_master_muted") === "1" ? "0" : "1");
      applyMaster(); syncUI();
    });
    rm.addEventListener("click", function () {
      var o = store.get("arcade_rm");
      store.set("arcade_rm", o === "on" ? "off" : o === "off" ? "auto" : "on");
      syncRMStyle(); syncUI();
    });
    panel.syncUI = syncUI;
  }
  function btnCss() {
    return "font:700 11px/1 system-ui;letter-spacing:2px;color:#cfd8ea;cursor:pointer;" +
      "background:rgba(140,160,210,.12);border:1px solid rgba(140,160,210,.4);" +
      "padding:8px 12px;border-radius:999px";
  }
  function toggleSettings(show) {
    buildPanel();
    var to = show != null ? show : !settingsOpen();
    panel.style.display = to ? "block" : "none";
    if (to) panel.syncUI();
  }
  function mountChip() {
    if (chip || !document.body) return;
    chip = document.createElement("div");
    chip.id = "arcade-settings-chip";
    chip.title = "Arcade settings";
    chip.textContent = "⚙";
    chip.style.cssText =
      "position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:15990;" +
      "width:30px;height:30px;border-radius:50%;display:flex;align-items:center;" +
      "justify-content:center;cursor:pointer;font-size:15px;color:#cfd8ea;" +
      "background:rgba(10,12,20,.6);border:1px solid rgba(140,160,210,.35);" +
      "opacity:.4;transition:opacity .15s;user-select:none;-webkit-user-select:none";
    chip.addEventListener("mouseenter", function () { chip.style.opacity = "1"; });
    chip.addEventListener("mouseleave", function () { chip.style.opacity = ".4"; });
    chip.addEventListener("click", function () { toggleSettings(); });
    document.body.appendChild(chip);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountChip);
  } else {
    mountChip();
  }
  /* capture-phase: while the panel is open, keys belong to the panel */
  window.addEventListener("keydown", function (e) {
    if (!settingsOpen()) return;
    if (e.key === "Escape") toggleSettings(false);
    e.stopImmediatePropagation();
    e.preventDefault();
  }, true);
  window.addEventListener("keyup", function (e) {
    if (settingsOpen()) e.stopImmediatePropagation();
  }, true);

  window.arcade = {
    store: store,
    reducedMotion: reducedMotion,
    settings: { open: function () { toggleSettings(true); }, close: function () { toggleSettings(false); } },
    /* clamp a rAF delta so a backgrounded tab doesn't produce a huge step */
    clampDt: function (dt, max) { return Math.min(Math.max(dt, 0), max || 0.1); },
    /* daily-challenge helpers: one date key and one seed, stable all day,
       shared by every game so "today's run" means the same thing everywhere */
    dailyKey: function () {
      var d = new Date(), m = d.getMonth() + 1, da = d.getDate();
      return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (da < 10 ? "0" : "") + da;
    },
    dailySeed: function () {
      var d = new Date();
      return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    },
    /* mulberry32: tiny deterministic PRNG for seeded runs */
    seededRand: function (seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    touch: {
      available: touchOn,
      sendKey: sendKey,
      button: touchButton,
      key: keyButton,
      dpad: dpad,
      arrowDpad: arrowDpad,
      stick: stick
    },
    /* Run recorder — shared by the ghost racer and replay trophies.

       A game calls start()/sample()/finish() and gets both a local ghost and,
       when the arcade server happens to be serving the page, a shared one.
       Every server call is best-effort: these games are static files that must
       keep working opened straight off the disk, so a failed fetch is silently
       ignored rather than surfaced. */
    run: (function () {
      var RATE_MS = 100;            // 10 Hz is plenty to interpolate a ghost
      var MAX_FRAMES = 4000;        // ~6.5 minutes; matches the server cap
      var cur = null;

      function localKey(game) { return 'arcade_ghost_' + game; }

      function post(path, body) {
        try {
          return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' },
                               body: JSON.stringify(body) })
            .then(function (r) { return r.json(); })
            .catch(function () { return null; });
        } catch (e) { return Promise.resolve(null); }
      }

      return {
        start: function (game, seed) {
          cur = { game: game, seed: seed === undefined ? null : seed, frames: [], last: -1e9 };
        },
        /* Call every frame; it throttles itself. Pass the few numbers needed to
           redraw the ghost — position, lane, whatever the game interpolates. */
        sample: function (t) {
          if (!cur || cur.frames.length >= MAX_FRAMES) return;
          if (t - cur.last < RATE_MS / 1000) return;
          cur.last = t;
          cur.frames.push(Array.prototype.slice.call(arguments, 1).map(function (v) {
            return Math.round((Number(v) || 0) * 100) / 100;   // 2dp keeps ghosts small
          }));
        },
        recording: function () { return !!cur; },
        /* Keep the run if it beat the stored ghost, and offer it to the server. */
        finish: function (score, name) {
          if (!cur || !cur.frames.length) { cur = null; return Promise.resolve(null); }
          var ghost = { game: cur.game, seed: cur.seed, frames: cur.frames,
                        score: Number(score) || 0,
                        name: name || localStorage.getItem('arcade_name_v1') || 'player' };
          cur = null;
          try {
            var prevRaw = localStorage.getItem(localKey(ghost.game));
            var prev = prevRaw ? JSON.parse(prevRaw) : null;
            if (!prev || ghost.score > prev.score) {
              localStorage.setItem(localKey(ghost.game), JSON.stringify(ghost));
            }
          } catch (e) { /* quota or bad JSON — the server copy still matters */ }
          return post('/api/ghost', ghost);
        },
        discard: function () { cur = null; },
        /* Best available ghost: the server's if reachable, else the local one. */
        best: function (game) {
          var local = null;
          try {
            var raw = localStorage.getItem(localKey(game));
            if (raw) local = JSON.parse(raw);
          } catch (e) {}
          try {
            return fetch('/api/ghosts?game=' + encodeURIComponent(game))
              .then(function (r) { return r.json(); })
              .then(function (d) {
                var remote = d && d.list && d.list[0];
                if (remote && (!local || remote.score > local.score)) return remote;
                return local;
              })
              .catch(function () { return local; });
          } catch (e) { return Promise.resolve(local); }
        },
        /* Read a ghost at an arbitrary time, interpolating between samples. */
        at: function (ghost, t) {
          if (!ghost || !ghost.frames || !ghost.frames.length) return null;
          var f = ghost.frames, i = Math.floor(t / (RATE_MS / 1000));
          if (i >= f.length - 1) return f[f.length - 1];
          if (i < 0) return f[0];
          var a = f[i], b = f[i + 1], k = (t / (RATE_MS / 1000)) - i, out = [];
          for (var j = 0; j < a.length; j++) out.push(a[j] + (b[j] - a[j]) * k);
          return out;
        }
      };
    })()
  };
})();
</script>

<script>
(function () {
  "use strict";

  var SIZE = 10;
  var FLEET = [
    { name: "Carrier",    len: 5 },
    { name: "Battleship", len: 4 },
    { name: "Cruiser",    len: 3 },
    { name: "Submarine",  len: 3 },
    { name: "Destroyer",  len: 2 }
  ];
  var DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

  // ---------- state ----------
  var player, enemy, ai, phase, placingIndex, horizontal, lastHover, stats;
  // --- commander powers: hits earn intel, spent on information or firepower ---
  var RADAR_COST = 3, SALVO_COST = 5;
  var pIntel = 0, aiIntel = 0, armedPower = null, salvoLeft = 0;
  var contacts = null;            // contacts[r][c] = ship-cells in that 3x3, or null
  var difficulty = "normal";
  try {
    var savedDiff = localStorage.getItem("bs_difficulty");
    if (savedDiff === "hard" || savedDiff === "normal") difficulty = savedDiff;
  } catch (e) { /* storage unavailable */ }

  var playerCells = [], enemyCells = [];
  var playerBoardEl = document.getElementById("player-board");
  var enemyBoardEl  = document.getElementById("enemy-board");
  var phaseMsgEl    = document.getElementById("phase-msg");
  var logEl         = document.getElementById("log");
  var setupPanelEl  = document.getElementById("setup-panel");
  var shipToPlaceEl = document.getElementById("ship-to-place");
  var fleetStatusEl = document.getElementById("fleet-status");
  var overlayEl     = document.getElementById("overlay");

  // ---------- helpers ----------
  function grid2d(fill) {
    var g = [];
    for (var r = 0; r < SIZE; r++) { g.push([]); for (var c = 0; c < SIZE; c++) g[r].push(fill); }
    return g;
  }
  function inBounds(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }
  function coordName(r, c) { return String.fromCharCode(65 + r) + (c + 1); }
  function rnd(n) { return Math.floor(Math.random() * n); }

  function newBoard() {
    return { grid: grid2d(null), shots: grid2d(false), ships: [] };
  }

  function shipCells(r, c, len, horiz) {
    var cells = [];
    for (var i = 0; i < len; i++) cells.push({ r: horiz ? r : r + i, c: horiz ? c + i : c });
    return cells;
  }

  function canPlace(board, cells) {
    for (var i = 0; i < cells.length; i++) {
      var p = cells[i];
      if (!inBounds(p.r, p.c) || board.grid[p.r][p.c] !== null) return false;
    }
    return true;
  }

  function placeShip(board, spec, cells) {
    var idx = board.ships.length;
    board.ships.push({ name: spec.name, len: spec.len, cells: cells, hits: 0, sunk: false });
    for (var i = 0; i < cells.length; i++) board.grid[cells[i].r][cells[i].c] = idx;
  }

  function randomFleet(board, specs) {
    for (var s = 0; s < specs.length; s++) {
      var spec = specs[s], placed = false;
      while (!placed) {
        var horiz = Math.random() < 0.5;
        var r = rnd(horiz ? SIZE : SIZE - spec.len + 1);
        var c = rnd(horiz ? SIZE - spec.len + 1 : SIZE);
        var cells = shipCells(r, c, spec.len, horiz);
        if (canPlace(board, cells)) { placeShip(board, spec, cells); placed = true; }
      }
    }
  }

  function fire(board, r, c) {
    board.shots[r][c] = true;
    var idx = board.grid[r][c];
    if (idx === null) return { hit: false, sunk: null };
    var ship = board.ships[idx];
    ship.hits++;
    if (ship.hits === ship.len) { ship.sunk = true; return { hit: true, sunk: ship }; }
    return { hit: true, sunk: null };
  }

  function allSunk(board) {
    return board.ships.length === FLEET.length &&
           board.ships.every(function (s) { return s.sunk; });
  }

  // ---------- AI (hunt / target with parity) ----------
  function aiUntried(r, c) { return inBounds(r, c) && !player.shots[r][c]; }

  function aiPickShot() {
    var hits = ai.targetHits, cand = [], i;
    if (hits.length >= 2) {
      var sameRow = hits.every(function (h) { return h.r === hits[0].r; });
      var sameCol = hits.every(function (h) { return h.c === hits[0].c; });
      if (sameRow) {
        var cs = hits.map(function (h) { return h.c; });
        var r0 = hits[0].r;
        var lo = Math.min.apply(null, cs) - 1, hi = Math.max.apply(null, cs) + 1;
        if (aiUntried(r0, lo)) cand.push({ r: r0, c: lo });
        if (aiUntried(r0, hi)) cand.push({ r: r0, c: hi });
      } else if (sameCol) {
        var rs = hits.map(function (h) { return h.r; });
        var c0 = hits[0].c;
        var lo2 = Math.min.apply(null, rs) - 1, hi2 = Math.max.apply(null, rs) + 1;
        if (aiUntried(lo2, c0)) cand.push({ r: lo2, c: c0 });
        if (aiUntried(hi2, c0)) cand.push({ r: hi2, c: c0 });
      }
    }
    if (!cand.length && hits.length) {
      for (i = 0; i < hits.length; i++) {
        for (var d = 0; d < DIRS.length; d++) {
          var nr = hits[i].r + DIRS[d][0], nc = hits[i].c + DIRS[d][1];
          if (aiUntried(nr, nc)) cand.push({ r: nr, c: nc });
        }
      }
    }
    if (cand.length) return cand[rnd(cand.length)];

    // hunt mode: parity search
    var pool = [], any = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!player.shots[r][c]) {
          any.push({ r: r, c: c });
          if ((r + c) % 2 === ai.parity) pool.push({ r: r, c: c });
        }
      }
    }
    if (!pool.length) pool = any;
    return pool[rnd(pool.length)];
  }

  // ---------- AI (hard: probability-density targeting) ----------
  // For every unsunk player ship, count all placements consistent with known
  // misses and sunk cells; fire at the unknown cell covered by the most
  // placements. With unresolved hits, only placements covering those hits
  // contribute, weighted by how many hits they explain.
  function aiDensityShot() {
    var hits = ai.targetHits, i, j, rr, cc;
    var hitKey = {};
    for (i = 0; i < hits.length; i++) hitKey[hits[i].r * SIZE + hits[i].c] = true;
    var targetMode = hits.length > 0;
    var density = grid2d(0);

    function blockedCell(r, c) { return player.shots[r][c] && !hitKey[r * SIZE + c]; }

    for (var s = 0; s < player.ships.length; s++) {
      var ship = player.ships[s];
      if (ship.sunk) continue;
      var len = ship.len;
      for (var horiz = 0; horiz < 2; horiz++) {
        var maxR = horiz ? SIZE : SIZE - len + 1;
        var maxC = horiz ? SIZE - len + 1 : SIZE;
        for (var r = 0; r < maxR; r++) {
          for (var c = 0; c < maxC; c++) {
            var ok = true, covered = 0;
            for (j = 0; j < len; j++) {
              rr = horiz ? r : r + j;
              cc = horiz ? c + j : c;
              if (blockedCell(rr, cc)) { ok = false; break; }
              if (hitKey[rr * SIZE + cc]) covered++;
            }
            if (!ok) continue;
            if (targetMode && covered === 0) continue;
            var w = targetMode ? covered * covered : 1;
            for (j = 0; j < len; j++) {
              rr = horiz ? r : r + j;
              cc = horiz ? c + j : c;
              if (!player.shots[rr][cc]) density[rr][cc] += w;
            }
          }
        }
      }
    }

    var best = -1, cand = [];
    for (var r2 = 0; r2 < SIZE; r2++) {
      for (var c2 = 0; c2 < SIZE; c2++) {
        if (player.shots[r2][c2]) continue;
        var d = density[r2][c2];
        if (d > best) { best = d; cand = [{ r: r2, c: c2 }]; }
        else if (d === best) cand.push({ r: r2, c: c2 });
      }
    }
    return cand[rnd(cand.length)];
  }

  function aiAfterShot(shot, result) {
    if (result.hit) ai.targetHits.push({ r: shot.r, c: shot.c });
    if (result.sunk) {
      var cells = result.sunk.cells;
      ai.targetHits = ai.targetHits.filter(function (h) {
        return !cells.some(function (p) { return p.r === h.r && p.c === h.c; });
      });
    }
  }

  // ---------- rendering ----------
  function buildBoard(el, cellStore, onClick, onHover, onLeave) {
    el.innerHTML = "";
    cellStore.length = 0;
    el.appendChild(label(""));
    for (var c = 0; c < SIZE; c++) el.appendChild(label(String(c + 1)));
    for (var r = 0; r < SIZE; r++) {
      el.appendChild(label(String.fromCharCode(65 + r)));
      var row = [];
      for (var c2 = 0; c2 < SIZE; c2++) {
        var cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.r = r;
        cell.dataset.c = c2;
        if (onClick) cell.addEventListener("click", onClick);
        if (onHover) cell.addEventListener("mouseenter", onHover);
        if (onLeave) cell.addEventListener("mouseleave", onLeave);
        el.appendChild(cell);
        row.push(cell);
      }
      cellStore.push(row);
    }
  }
  function label(t) {
    var d = document.createElement("div");
    d.className = "lbl";
    d.textContent = t;
    return d;
  }

  // purely visual: orientation + bow/stern segment classes for hull silhouettes
  function shipSegClasses(ship, r, c) {
    if (ship.cells.length === 1) return " single";
    var cls = ship.cells[0].r === ship.cells[1].r ? " h" : " v";
    var i;
    for (i = 0; i < ship.cells.length; i++)
      if (ship.cells[i].r === r && ship.cells[i].c === c) break;
    if (i === 0) cls += " seg-first";
    else if (i === ship.cells.length - 1) cls += " seg-last";
    else cls += " seg-mid";
    return cls;
  }

  function cellClasses(board, r, c, hideShips) {
    var cls = "cell";
    var idx = board.grid[r][c];
    var ship = idx === null ? null : board.ships[idx];
    if (ship && (!hideShips || ship.sunk)) cls += " ship" + shipSegClasses(ship, r, c);
    if (board.shots[r][c]) {
      if (ship) { cls += " hit"; if (ship.sunk) cls += " sunk"; }
      else cls += " miss";
    }
    return cls;
  }

  function renderBoards() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var pc = cellClasses(player, r, c, false);
        if (playerCells[r][c].className !== pc) playerCells[r][c].className = pc;
        var ec = cellClasses(enemy, r, c, true);
        if (enemyCells[r][c].className !== ec) enemyCells[r][c].className = ec;
        if (contacts) {
          var cell = enemyCells[r][c], badge = cell.querySelector(".contact");
          var want = contacts[r][c];
          if (want !== null && want !== undefined && !enemy.shots[r][c]) {
            if (!badge) { badge = document.createElement("span"); badge.className = "contact"; cell.appendChild(badge); }
            badge.textContent = want;
          } else if (badge) { cell.removeChild(badge); }
        }
      }
    }
    enemyBoardEl.classList.toggle("active", phase === "player");
    playerBoardEl.classList.toggle("placing", phase === "setup");
  }

  function renderFleetStatus() {
    if (phase === "setup") { fleetStatusEl.innerHTML = ""; return; }
    var html = '<div class="row" style="color:var(--label);letter-spacing:2px;margin-bottom:3px;">ENEMY FLEET</div>';
    for (var i = 0; i < enemy.ships.length; i++) {
      var s = enemy.ships[i];
      var pips = "";
      for (var k = 0; k < s.len; k++) pips += '<i class="pip"></i>';
      html += '<div class="row' + (s.sunk ? " dead" : "") + '"><span>' + s.name +
              '</span><span>' + (s.sunk ? "SUNK" : pips) + "</span></div>";
    }
    fleetStatusEl.innerHTML = html;
  }

  function setPhaseMsg(html) { phaseMsgEl.innerHTML = html; }

  // ---------- commander powers ----------
  function grantIntel(who, result) {
    var gain = result.hit ? 1 : 0;
    if (result.sunk) gain += 2;
    if (!gain) return;
    if (who === "player") pIntel += gain; else aiIntel += gain;
  }
  function renderPowers() {
    var ro = document.getElementById("intel-readout");
    var rb = document.getElementById("pw-radar"), sb = document.getElementById("pw-salvo");
    var hint = document.getElementById("pw-hint");
    if (!ro) return;
    var live = (phase === "player" || phase === "enemy");
    document.getElementById("power-bar").style.display = live ? "flex" : "none";
    ro.textContent = "INTEL " + pIntel;
    var usable = phase === "player" && !salvoLeft;
    rb.disabled = !usable || pIntel < RADAR_COST;
    sb.disabled = !usable || pIntel < SALVO_COST;
    rb.classList.toggle("armed", armedPower === "radar");
    sb.classList.toggle("armed", salvoLeft > 0);
    hint.textContent = armedPower === "radar" ? "Pick a square to scan its 3x3."
      : salvoLeft > 0 ? ("SALVO: " + salvoLeft + " shot" + (salvoLeft === 1 ? "" : "s") + " left")
      : "";
  }
  function countShipsAround(board, r, c) {
    var n = 0;
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      var rr = r + dr, cc = c + dc;
      if (inBounds(rr, cc) && board.grid[rr][cc] !== null) n++;
    }
    return n;
  }
  function doRadar(r, c) {
    pIntel -= RADAR_COST;
    armedPower = null;
    var n = countShipsAround(enemy, r, c);
    contacts[r][c] = n;
    logMsg("RADAR sweep at " + coordName(r, c) + " — " + n +
           " ship cell" + (n === 1 ? "" : "s") + " in range.", "sys");
    renderBoards();
    renderPowers();
    endPlayerTurn();
  }
  function endPlayerTurn() {
    if (allSunk(enemy)) { endGame(true); return; }
    phase = "enemy";
    enemyBoardEl.classList.remove("active");
    setPhaseMsg("Enemy is returning fire\u2026");
    renderPowers();
    setTimeout(aiTurn, 750);
  }

  function logMsg(text, cls) {
    var div = document.createElement("div");
    div.className = "entry " + (cls || "sys");
    var d = new Date();
    function p2(n) { return (n < 10 ? "0" : "") + n; }
    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
    var body = document.createElement("span");
    body.textContent = text;
    div.appendChild(ts);
    div.appendChild(body);
    logEl.insertBefore(div, logEl.firstChild);
    while (logEl.children.length > 40) logEl.removeChild(logEl.lastChild);
  }

  // ---------- setup phase ----------
  function clearPreview() {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        playerCells[r][c].classList.remove("preview-ok", "preview-bad");
  }

  function showPreview(r, c) {
    clearPreview();
    if (phase !== "setup" || placingIndex >= FLEET.length) return;
    var spec = FLEET[placingIndex];
    var cells = shipCells(r, c, spec.len, horizontal);
    var valid = canPlace(player, cells);
    for (var i = 0; i < cells.length; i++) {
      var p = cells[i];
      if (inBounds(p.r, p.c))
        playerCells[p.r][p.c].classList.add(valid ? "preview-ok" : "preview-bad");
    }
  }

  function updateSetupPanel() {
    if (phase !== "setup") { setupPanelEl.style.display = "none"; return; }
    setupPanelEl.style.display = "";
    var spec = FLEET[placingIndex];
    var squares = "";
    for (var i = 0; i < spec.len; i++) squares += "<span></span>";
    shipToPlaceEl.innerHTML =
      'Place your <span class="ship-name">' + spec.name + "</span> (" + spec.len + ") — " +
      (horizontal ? "horizontal" : "vertical") +
      '<div class="ship-preview" style="' + (horizontal ? "" : "flex-direction:column;align-items:center;") + '">' +
      squares + "</div>";
  }

  function onPlayerCellClick(e) {
    if (phase !== "setup") return;
    var r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;
    var spec = FLEET[placingIndex];
    var cells = shipCells(r, c, spec.len, horizontal);
    if (!canPlace(player, cells)) return;
    placeShip(player, spec, cells);
    logMsg("You positioned the " + spec.name + " at " + coordName(r, c) + ".", "you");
    placingIndex++;
    clearPreview();
    if (placingIndex >= FLEET.length) startBattle();
    else { updateSetupPanel(); if (lastHover) showPreview(lastHover.r, lastHover.c); }
    renderBoards();
  }

  function onPlayerCellHover(e) {
    lastHover = { r: +e.currentTarget.dataset.r, c: +e.currentTarget.dataset.c };
    showPreview(lastHover.r, lastHover.c);
  }
  function onPlayerCellLeave() { lastHover = null; clearPreview(); }

  function rotate() {
    if (phase !== "setup") return;
    horizontal = !horizontal;
    updateSetupPanel();
    if (lastHover) showPreview(lastHover.r, lastHover.c);
  }

  function randomPlacement() {
    if (phase !== "setup") return;
    randomFleet(player, FLEET.slice(placingIndex));
    placingIndex = FLEET.length;
    clearPreview();
    logMsg("Fleet deployed at random positions.", "you");
    startBattle();
    renderBoards();
  }

  // ---------- battle ----------
  function startBattle() {
    phase = "player";
    updateSetupPanel();
    renderFleetStatus();
    renderPowers();
    setPhaseMsg("<strong>Battle stations!</strong> Click the enemy waters to fire.");
    logMsg("All ships deployed. Battle begins — you fire first!", "sys");
  }

  function onEnemyCellClick(e) {
    if (phase !== "player") return;
    var r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;

    if (armedPower === "radar") { doRadar(r, c); return; }
    if (enemy.shots[r][c]) return;

    var result = fire(enemy, r, c);
    stats.playerShots++;
    if (result.hit) stats.playerHits++;
    grantIntel("player", result);

    if (result.sunk) {
      logMsg("You fired at " + coordName(r, c) + " — HIT! Enemy " + result.sunk.name + " SUNK!", "you sunk-msg");
    } else {
      logMsg("You fired at " + coordName(r, c) + (result.hit ? " — HIT!" : " — miss."), "you");
    }
    renderBoards();
    renderFleetStatus();

    if (allSunk(enemy)) { endGame(true); return; }

    if (salvoLeft > 0) {
      salvoLeft--;
      renderPowers();
      if (salvoLeft > 0) {
        setPhaseMsg("<strong>SALVO:</strong> " + salvoLeft + " shot" +
                    (salvoLeft === 1 ? "" : "s") + " remaining.");
        return;
      }
    }
    renderPowers();
    endPlayerTurn();
  }

  function aiTurn() {
    if (phase !== "enemy") return;
    // the enemy commander banks intel as well and spends it on a salvo
    // once it has a wounded ship to finish off
    var volley = 1;
    if (aiIntel >= SALVO_COST && ai.targetHits.length) {
      aiIntel -= SALVO_COST; volley = 3;
      logMsg("Enemy commander orders a SALVO!", "foe");
    }
    for (var v = 0; v < volley; v++) {
      if (phase !== "enemy") break;
      if (aiShoot()) return;      // game ended
    }
    phase = "player";
    enemyBoardEl.classList.add("active");
    setPhaseMsg("<strong>Your turn.</strong> Click the enemy waters to fire.");
    renderPowers();
  }

  function aiShoot() {
    var shot = difficulty === "hard" ? aiDensityShot() : aiPickShot();
    if (!shot) return false;
    var result = fire(player, shot.r, shot.c);
    stats.enemyShots++;
    if (result.hit) stats.enemyHits++;
    grantIntel("enemy", result);
    aiAfterShot(shot, result);

    if (result.sunk) {
      logMsg("Enemy fired at " + coordName(shot.r, shot.c) + " — HIT! Your " + result.sunk.name + " was SUNK!", "foe sunk-msg");
    } else {
      logMsg("Enemy fired at " + coordName(shot.r, shot.c) + (result.hit ? " — HIT!" : " — miss."), "foe");
    }
    renderBoards();

    if (allSunk(player)) { endGame(false); return true; }
    return false;
  }

  // ---------- end / reset ----------
  function endGame(playerWon) {
    phase = "over";
    armedPower = null; salvoLeft = 0;
    renderBoards();
    renderPowers();
    setPhaseMsg(playerWon ? "<strong>Victory!</strong>" : "<strong>Defeat.</strong>");

    // reveal remaining enemy ships
    for (var i = 0; i < enemy.ships.length; i++) {
      var s = enemy.ships[i];
      if (!s.sunk) for (var j = 0; j < s.cells.length; j++) {
        var p = s.cells[j];
        var el2 = enemyCells[p.r][p.c];
        el2.classList.add("ship");
        var segs = shipSegClasses(s, p.r, p.c).trim().split(" ");
        for (var k2 = 0; k2 < segs.length; k2++) if (segs[k2]) el2.classList.add(segs[k2]);
      }
    }

    if (playerWon) {
      try {
        var best = parseInt(localStorage.getItem("bs_best_shots"), 10) || 0;
        if (!best || stats.playerShots < best) localStorage.setItem("bs_best_shots", String(stats.playerShots));
        localStorage.setItem("bs_wins", String((parseInt(localStorage.getItem("bs_wins"), 10) || 0) + 1));
      } catch (e) { /* storage unavailable */ }
    }

    var acc = stats.playerShots ? Math.round(100 * stats.playerHits / stats.playerShots) : 0;
    var eacc = stats.enemyShots ? Math.round(100 * stats.enemyHits / stats.enemyShots) : 0;
    var title = document.getElementById("overlay-title");
    title.textContent = playerWon ? "VICTORY" : "DEFEAT";
    title.className = playerWon ? "win" : "lose";
    document.getElementById("overlay-sub").textContent = playerWon
      ? "The enemy fleet rests on the ocean floor."
      : "Your fleet has been sent to the depths.";
    document.getElementById("overlay-stats").innerHTML =
      "Difficulty: <b>" + (difficulty === "hard" ? "HARD" : "NORMAL") + "</b><br>" +
      "Your shots fired: <b>" + stats.playerShots + "</b> &nbsp;(hits: " + stats.playerHits + ", accuracy " + acc + "%)<br>" +
      "Enemy shots fired: <b>" + stats.enemyShots + "</b> &nbsp;(hits: " + stats.enemyHits + ", accuracy " + eacc + "%)";
    setTimeout(function () { overlayEl.classList.add("show"); }, 900);
    logMsg(playerWon ? "VICTORY — the enemy fleet is destroyed!" : "DEFEAT — your fleet is lost.", "sys sunk-msg");
  }

  function newGame() {
    player = newBoard();
    enemy = newBoard();
    randomFleet(enemy, FLEET);
    ai = { parity: rnd(2), targetHits: [] };
    phase = "setup";
    placingIndex = 0;
    horizontal = true;
    lastHover = null;
    stats = { playerShots: 0, playerHits: 0, enemyShots: 0, enemyHits: 0 };
    pIntel = 0; aiIntel = 0; armedPower = null; salvoLeft = 0;
    contacts = [];
    for (var ci = 0; ci < SIZE; ci++) {
      contacts.push([]);
      for (var cj = 0; cj < SIZE; cj++) contacts[ci].push(null);
    }
    logEl.innerHTML = "";
    overlayEl.classList.remove("show");
    buildBoard(playerBoardEl, playerCells, onPlayerCellClick, onPlayerCellHover, onPlayerCellLeave);
    buildBoard(enemyBoardEl, enemyCells, onEnemyCellClick, null, null);
    updateSetupPanel();
    renderFleetStatus();
    renderBoards();
    renderPowers();
    setPhaseMsg("Deploy your fleet — click your grid to place ships. <strong>R</strong> rotates.");
    logMsg("Admiral on deck. Position your fleet to begin.", "sys");
  }

  // ---------- power buttons ----------
  document.getElementById("pw-radar").addEventListener("click", function () {
    if (phase !== "player" || pIntel < RADAR_COST || salvoLeft) return;
    armedPower = armedPower === "radar" ? null : "radar";
    setPhaseMsg(armedPower ? "<strong>RADAR armed.</strong> Click a square to sweep its 3x3."
                           : "<strong>Your turn.</strong> Click the enemy waters to fire.");
    renderPowers();
  });
  document.getElementById("pw-salvo").addEventListener("click", function () {
    if (phase !== "player" || pIntel < SALVO_COST || salvoLeft) return;
    pIntel -= SALVO_COST;
    salvoLeft = 3;
    armedPower = null;
    logMsg("SALVO authorised — three shots this turn.", "you");
    setPhaseMsg("<strong>SALVO:</strong> 3 shots remaining.");
    renderPowers();
  });

  // ---------- difficulty ----------
  function updateDifficultyUI() {
    document.getElementById("diff-normal").classList.toggle("sel", difficulty === "normal");
    document.getElementById("diff-hard").classList.toggle("sel", difficulty === "hard");
    document.getElementById("difficulty-ind").textContent =
      "AI: " + (difficulty === "hard" ? "HARD" : "NORMAL");
  }

  function setDifficulty(d) {
    difficulty = d;
    try { localStorage.setItem("bs_difficulty", d); } catch (e) { /* storage unavailable */ }
    updateDifficultyUI();
    logMsg("AI difficulty set to " + (d === "hard" ? "HARD" : "NORMAL") + ".", "sys");
  }

  // ---------- wiring ----------
  document.getElementById("diff-normal").addEventListener("click", function () { setDifficulty("normal"); });
  document.getElementById("diff-hard").addEventListener("click", function () { setDifficulty("hard"); });
  document.getElementById("rotate-btn").addEventListener("click", rotate);
  document.getElementById("random-btn").addEventListener("click", randomPlacement);
  document.getElementById("new-game-btn").addEventListener("click", newGame);
  document.getElementById("play-again").addEventListener("click", newGame);
  document.addEventListener("keydown", function (e) {
    if (e.key === "r" || e.key === "R") rotate();
  });

  updateDifficultyUI();
  newGame();
})();
</script>
