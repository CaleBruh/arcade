<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SWARM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04050d; }
  canvas { display: block; cursor: crosshair; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font-family: "Courier New", monospace; color: #e8f6ff;
    text-shadow: 0 0 8px rgba(80, 220, 255, 0.9);
  }
  #hud { position: absolute; top: 18px; left: 22px; font-size: 20px; line-height: 1.6; }
  #wave { position: absolute; top: 18px; right: 22px; font-size: 20px; text-align: right; line-height: 1.6; }
  #combo {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    font-size: 26px; color: #ffe66d; text-shadow: 0 0 10px rgba(255, 230, 109, 0.9);
    opacity: 0; transition: opacity 0.15s;
  }
  #combo.pop { animation: comboPop 0.38s cubic-bezier(0.2, 2.6, 0.4, 1); }
  @keyframes comboPop {
    0% { transform: translateX(-50%) scale(2.4) rotate(-4deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); }
  }
  #combo.max {
    color: #ff5c8a;
    text-shadow: 0 0 14px rgba(255, 92, 138, 1), 0 0 44px rgba(255, 92, 138, 0.65);
    animation: maxPulse 0.5s ease-in-out infinite alternate, comboPop 0.38s cubic-bezier(0.2, 2.6, 0.4, 1);
  }
  @keyframes maxPulse { from { filter: brightness(1); } to { filter: brightness(1.5); } }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(5, 6, 15, 0.82); pointer-events: auto;
  }
  .screen h1 {
    font-size: 64px; letter-spacing: 12px; color: #5ce1ff;
    text-shadow: 0 0 24px rgba(92, 225, 255, 0.95), 0 0 60px rgba(92, 225, 255, 0.5);
  }
  .screen h2 { font-size: 34px; letter-spacing: 6px; color: #ff5c8a; text-shadow: 0 0 20px rgba(255, 92, 138, 0.9); }
  .screen p { font-size: 18px; letter-spacing: 2px; color: #9fb8c8; text-shadow: none; }
  .screen .stat { font-size: 24px; color: #ffe66d; text-shadow: 0 0 12px rgba(255, 230, 109, 0.8); }
  .blink { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud"></div>
  <div id="wave"></div>
  <div id="combo"></div>
  <div id="title" class="screen">
    <h1>NEON SWARM</h1>
    <p>WASD / ARROWS — move &nbsp;·&nbsp; MOUSE — aim &nbsp;·&nbsp; HOLD CLICK — fire</p>
    <p>SHIFT or SPACE — dash through danger</p>
  <p>P — pause &nbsp;·&nbsp; M — mute</p>
    <p class="stat" id="title-best"></p>
    <p class="blink">CLICK TO START</p>
  </div>
  <div id="gameover" class="screen hidden">
    <h2>SHIP DESTROYED</h2>
    <p class="stat" id="final-score"></p>
    <p class="stat" id="final-best"></p>
    <p id="final-wave"></p>
    <p class="blink">CLICK TO RETRY</p>
  </div>
  <div id="volbox" style="position:absolute;bottom:14px;right:16px;pointer-events:auto;font-size:11px;letter-spacing:2px;color:#9fb8c8;display:flex;align-items:center;gap:8px;opacity:0.75;text-shadow:none;">
    <span id="volstate" style="color:#ff5c8a"></span>
    <span>VOL</span>
    <input id="vol" type="range" min="0" max="1" step="0.05" style="width:90px;accent-color:#5ce1ff;cursor:pointer">
  </div>
</div>
<!-- arcade-shared:start -->
<script>
/* Arcade shared runtime.
   Single source of truth for cross-game boilerplate. build-arcade.py injects
   this into every game between the arcade-shared markers (and keeps the copies
   in sync on each run) — edit THIS file, then run: python3 build-arcade.py */
(function () {
  "use strict";

  /* ---- safe storage: never throws (Safari private mode, disabled storage) ---- */
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, String(v)); return true; } catch (e) { return false; } },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} },
    num: function (k) { var n = parseFloat(store.get(k)); return isFinite(n) ? n : 0; },
    json: function (k) { try { return JSON.parse(store.get(k)); } catch (e) { return null; } }
  };

  /* ---- audio: one wrap of the AudioContext constructor gives us both
     a tab-hidden auto-suspend and an arcade-wide master volume ----
     Every context's .destination is rerouted through a shared gain node, so
     the settings panel's master volume applies to every game with no per-game
     wiring; the games' own volume sliders keep working underneath it.
     Only contexts *we* suspended are resumed, so a game's own
     mute-by-suspend behaviour is left alone. */
  var contexts = [];
  var autoSuspended = [];
  var masters = [];
  function masterLevel() {
    if (store.get("arcade_master_muted") === "1") return 0;
    var v = parseFloat(store.get("arcade_master"));
    return isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1;
  }
  function applyMaster() {
    var lvl = masterLevel();
    masters.forEach(function (g) {
      try { g.gain.setTargetAtTime(lvl, g.context.currentTime, 0.02); } catch (e) {}
    });
  }
  ["AudioContext", "webkitAudioContext"].forEach(function (name) {
    var Orig = window[name];
    if (!Orig) return;
    function Patched() {
      var ctx = arguments.length
        ? new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))()
        : new Orig();
      contexts.push(ctx);
      try {
        var realDest = ctx.destination;
        var master = ctx.createGain();
        master.gain.value = masterLevel();
        master.connect(realDest);
        Object.defineProperty(ctx, "destination", {
          get: function () { return master; },
          configurable: true
        });
        masters.push(master);
      } catch (e) { /* master volume is best-effort */ }
      return ctx;
    }
    Patched.prototype = Orig.prototype;
    window[name] = Patched;
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      contexts.forEach(function (ctx) {
        if (ctx.state === "running") {
          autoSuspended.push(ctx);
          ctx.suspend().catch(function () {});
        }
      });
    } else {
      autoSuspended.splice(0).forEach(function (ctx) {
        if (ctx.state === "suspended") ctx.resume().catch(function () {});
      });
    }
  });

  /* ---- reduced motion: tame decorative CSS animation, expose a flag the
     games consult for canvas effects (shake, flashes, particles). The OS
     setting is the default; the settings panel can override it either way
     (arcade_rm: "auto" | "on" | "off"). ---- */
  var rmQuery = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reducedMotion() {
    var o = store.get("arcade_rm");
    if (o === "on") return true;
    if (o === "off") return false;
    return !!(rmQuery && rmQuery.matches);
  }
  var rmStyle = document.createElement("style");
  (document.head || document.documentElement).appendChild(rmStyle);
  function syncRMStyle() {
    rmStyle.textContent = reducedMotion()
      ? "*,*::before,*::after{animation-duration:.01ms !important;" +
        "animation-iteration-count:1 !important;transition-duration:.01ms !important;" +
        "scroll-behavior:auto !important}"
      : "";
  }
  syncRMStyle();
  if (rmQuery && rmQuery.addEventListener) rmQuery.addEventListener("change", syncRMStyle);

  /* ---- on-screen touch controls ----
     Created on demand by a game calling arcade.touch.* at the end of its own
     script. Nothing is shown unless the pointer is coarse (or ?touch=1 forces
     them for testing). Key buttons synthesize keydown/keyup on window+document
     with both .key and .code set, so games keep their existing handlers. */
  var touchOn = (window.matchMedia && matchMedia("(pointer: coarse)").matches) ||
                /[?&]touch=1\b/.test(location.search);
  var touchLayer = null;
  function ensureLayer() {
    if (!touchLayer) {
      touchLayer = document.createElement("div");
      touchLayer.id = "arcade-touch";
      touchLayer.style.cssText =
        "position:fixed;inset:0;z-index:15000;pointer-events:none;" +
        "user-select:none;-webkit-user-select:none";
      (document.body || document.documentElement).appendChild(touchLayer);
    }
    return touchLayer;
  }
  function mkEl(style, size) {
    var el = document.createElement("div");
    el.style.cssText =
      "position:absolute;pointer-events:auto;touch-action:none;box-sizing:border-box;" +
      "width:" + size + "px;height:" + size + "px;border-radius:50%;" +
      "background:rgba(140,160,210,.13);border:1px solid rgba(140,160,210,.45);" +
      "color:rgba(232,236,248,.85);display:flex;align-items:center;justify-content:center;" +
      "font:700 13px/1 system-ui,sans-serif;letter-spacing:1px;" + (style || "");
    return el;
  }
  function sendKey(type, key, code) {
    var ev = new KeyboardEvent(type, { key: key, code: code, bubbles: true, cancelable: true });
    window.dispatchEvent(ev);
    document.dispatchEvent(ev);
  }
  function touchButton(o) {
    if (!touchOn) return null;
    var el = mkEl(o.style, o.size || 54);
    el.textContent = o.label || "";
    if (o.label) el.dataset.k = o.label;
    var timer = 0;
    function down(e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.style.background = "rgba(140,160,210,.34)";
      if (o.onDown) o.onDown();
      if (o.repeat) timer = setInterval(function () { if (o.onDown) o.onDown(); }, o.repeat);
    }
    function up() {
      el.style.background = "rgba(140,160,210,.13)";
      if (timer) { clearInterval(timer); timer = 0; }
      if (o.onUp) o.onUp();
    }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    ensureLayer().appendChild(el);
    return el;
  }
  function keyButton(o) {
    var held = false;
    return touchButton({
      label: o.label, style: o.style, size: o.size, repeat: o.repeat,
      onDown: function () { held = true; sendKey("keydown", o.key, o.code || o.key); },
      onUp: function () { if (held) { held = false; sendKey("keyup", o.key, o.code || o.key); } }
    });
  }
  function dpad(o) {
    if (!touchOn) return;
    var s = o.size || 52, g = o.gap || 6;
    var bx = o.left != null ? o.left : 16, by = o.bottom != null ? o.bottom : 16;
    function at(cx, cy) { return "left:" + cx + "px;bottom:" + cy + "px"; }
    var m = o.map;
    keyButton({ label: "▲", key: m.up.key, code: m.up.code, size: s, repeat: o.repeat, style: at(bx + s + g, by + 2 * (s + g)) });
    keyButton({ label: "◀", key: m.left.key, code: m.left.code, size: s, repeat: o.repeat, style: at(bx, by + s + g) });
    keyButton({ label: "▶", key: m.right.key, code: m.right.code, size: s, repeat: o.repeat, style: at(bx + 2 * (s + g), by + s + g) });
    keyButton({ label: "▼", key: m.down.key, code: m.down.code, size: s, repeat: o.repeat, style: at(bx + s + g, by) });
  }
  function arrowDpad(o) {
    o = o || {};
    o.map = {
      up: { key: "ArrowUp", code: "ArrowUp" }, down: { key: "ArrowDown", code: "ArrowDown" },
      left: { key: "ArrowLeft", code: "ArrowLeft" }, right: { key: "ArrowRight", code: "ArrowRight" }
    };
    return dpad(o);
  }
  function stick(o) {
    if (!touchOn) return null;
    var size = o.size || 124;
    var base = mkEl(o.style, size);
    if (o.label) base.dataset.k = o.label;
    var knob = document.createElement("div");
    knob.style.cssText =
      "position:absolute;width:44%;height:44%;border-radius:50%;pointer-events:none;" +
      "background:rgba(140,160,210,.4);left:50%;top:50%;transform:translate(-50%,-50%)";
    base.appendChild(knob);
    var active = false;
    function setKnob(nx, ny) {
      knob.style.left = (50 + nx * 32) + "%";
      knob.style.top = (50 + ny * 32) + "%";
    }
    function report(e) {
      var r = base.getBoundingClientRect();
      var dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
      var dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
      var mag = Math.hypot(dx, dy);
      if (mag > 1) { dx /= mag; dy /= mag; }
      setKnob(dx, dy);
      if (o.onMove) o.onMove(dx, dy, true);
    }
    base.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { base.setPointerCapture(e.pointerId); } catch (err) {}
      active = true;
      report(e);
    });
    base.addEventListener("pointermove", function (e) { if (active) report(e); });
    function end() {
      if (!active) return;
      active = false;
      setKnob(0, 0);
      if (o.onMove) o.onMove(0, 0, false);
    }
    base.addEventListener("pointerup", end);
    base.addEventListener("pointercancel", end);
    ensureLayer().appendChild(base);
    return base;
  }

  /* ---- play-time heartbeat: the hub sorts and labels cards from this ----
     Standalone pages identify themselves by filename; inside the all-in-one
     bundle the overlay stamps data-arcade-game on the iframe. The smoke
     harness's srcdoc frames carry no stamp, so test runs never pollute it. */
  var GAME_ID = (function () {
    try {
      if (window.frameElement && window.frameElement.dataset.arcadeGame)
        return window.frameElement.dataset.arcadeGame;
      if (window.frameElement) return null; /* unstamped frame (smoke harness) */
    } catch (e) { return null; }
    var p = location.pathname.split("/").pop();
    return /\.html$/.test(p) && ["index.html", "arcade.html", "smoke.html"].indexOf(p) === -1 ? p : null;
  })();
  if (GAME_ID) {
    var visSince = document.hidden ? 0 : Date.now();
    var metaFlush = function () {
      var add = 0, now = Date.now();
      if (visSince) { add = (now - visSince) / 1000; visSince = document.hidden ? 0 : now; }
      else if (add === 0) return; /* hidden and idle: not "playing" */
      var meta = store.json("arcade_meta_v1") || {};
      var g = meta[GAME_ID] || (meta[GAME_ID] = { secs: 0 });
      g.secs = Math.round((g.secs || 0) + add);
      g.last = now;
      store.set("arcade_meta_v1", JSON.stringify(meta));
    };
    metaFlush();
    setInterval(metaFlush, 15000);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { metaFlush(); visSince = 0; }
      else visSince = Date.now();
    });
    window.addEventListener("pagehide", metaFlush);
  }

  /* ---- settings panel: gear chip on the right edge; Escape closes.
     Master volume and motion apply to every game through the shared
     runtime, so this is the same panel with the same behaviour everywhere. */
  var panel = null, chip = null;
  function settingsOpen() { return !!(panel && panel.style.display !== "none"); }
  function motionLabel() {
    var o = store.get("arcade_rm");
    return o === "on" ? "MOTION: REDUCED" : o === "off" ? "MOTION: FULL" : "MOTION: AUTO";
  }
  function buildPanel() {
    if (panel) return;
    panel = document.createElement("div");
    panel.id = "arcade-settings";
    panel.style.cssText =
      "position:fixed;inset:0;z-index:16000;display:none;" +
      "background:rgba(4,6,12,.55);user-select:none;-webkit-user-select:none";
    var card = document.createElement("div");
    card.style.cssText =
      "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);" +
      "min-width:260px;padding:22px 26px;border-radius:14px;" +
      "background:rgba(14,17,30,.96);border:1px solid rgba(140,160,210,.4);" +
      "color:#e8ecf8;font:13px/1.5 system-ui,sans-serif";
    card.innerHTML =
      '<div style="font:700 13px/1 system-ui;letter-spacing:3px;margin-bottom:16px">ARCADE SETTINGS</div>' +
      '<label style="font-size:11px;letter-spacing:2px;color:#8b94b0">MASTER VOLUME</label><br>' +
      '<input id="arc-set-vol" type="range" min="0" max="100" style="width:100%;margin:6px 0 14px">' +
      '<button id="arc-set-mute" style="' + btnCss() + '"></button> ' +
      '<button id="arc-set-rm" style="' + btnCss() + '"></button>' +
      '<div style="font-size:11px;color:#8b94b0;margin-top:14px">Applies to every game. ' +
      'Per-game volume controls still work underneath.<br>Esc closes.</div>';
    panel.appendChild(card);
    panel.addEventListener("pointerdown", function (e) { if (e.target === panel) toggleSettings(false); });
    (document.body || document.documentElement).appendChild(panel);

    var vol = card.querySelector("#arc-set-vol");
    var mute = card.querySelector("#arc-set-mute");
    var rm = card.querySelector("#arc-set-rm");
    function syncUI() {
      var v = parseFloat(store.get("arcade_master"));
      vol.value = Math.round((isFinite(v) ? Math.min(Math.max(v, 0), 1) : 1) * 100);
      mute.textContent = store.get("arcade_master_muted") === "1" ? "UNMUTE" : "MUTE";
      rm.textContent = motionLabel();
    }
    vol.addEventListener("input", function () {
      store.set("arcade_master", vol.value / 100);
      store.set("arcade_master_muted", "0");
      applyMaster(); syncUI();
    });
    mute.addEventListener("click", function () {
      store.set("arcade_master_muted", store.get("arcade_master_muted") === "1" ? "0" : "1");
      applyMaster(); syncUI();
    });
    rm.addEventListener("click", function () {
      var o = store.get("arcade_rm");
      store.set("arcade_rm", o === "on" ? "off" : o === "off" ? "auto" : "on");
      syncRMStyle(); syncUI();
    });
    panel.syncUI = syncUI;
  }
  function btnCss() {
    return "font:700 11px/1 system-ui;letter-spacing:2px;color:#cfd8ea;cursor:pointer;" +
      "background:rgba(140,160,210,.12);border:1px solid rgba(140,160,210,.4);" +
      "padding:8px 12px;border-radius:999px";
  }
  function toggleSettings(show) {
    buildPanel();
    var to = show != null ? show : !settingsOpen();
    panel.style.display = to ? "block" : "none";
    if (to) panel.syncUI();
  }
  function mountChip() {
    if (chip || !document.body) return;
    chip = document.createElement("div");
    chip.id = "arcade-settings-chip";
    chip.title = "Arcade settings";
    chip.textContent = "⚙";
    chip.style.cssText =
      "position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:15990;" +
      "width:30px;height:30px;border-radius:50%;display:flex;align-items:center;" +
      "justify-content:center;cursor:pointer;font-size:15px;color:#cfd8ea;" +
      "background:rgba(10,12,20,.6);border:1px solid rgba(140,160,210,.35);" +
      "opacity:.4;transition:opacity .15s;user-select:none;-webkit-user-select:none";
    chip.addEventListener("mouseenter", function () { chip.style.opacity = "1"; });
    chip.addEventListener("mouseleave", function () { chip.style.opacity = ".4"; });
    chip.addEventListener("click", function () { toggleSettings(); });
    document.body.appendChild(chip);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountChip);
  } else {
    mountChip();
  }
  /* capture-phase: while the panel is open, keys belong to the panel */
  window.addEventListener("keydown", function (e) {
    if (!settingsOpen()) return;
    if (e.key === "Escape") toggleSettings(false);
    e.stopImmediatePropagation();
    e.preventDefault();
  }, true);
  window.addEventListener("keyup", function (e) {
    if (settingsOpen()) e.stopImmediatePropagation();
  }, true);

  window.arcade = {
    store: store,
    reducedMotion: reducedMotion,
    settings: { open: function () { toggleSettings(true); }, close: function () { toggleSettings(false); } },
    /* clamp a rAF delta so a backgrounded tab doesn't produce a huge step */
    clampDt: function (dt, max) { return Math.min(Math.max(dt, 0), max || 0.1); },
    /* daily-challenge helpers: one date key and one seed, stable all day,
       shared by every game so "today's run" means the same thing everywhere */
    dailyKey: function () {
      var d = new Date(), m = d.getMonth() + 1, da = d.getDate();
      return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (da < 10 ? "0" : "") + da;
    },
    dailySeed: function () {
      var d = new Date();
      return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    },
    /* mulberry32: tiny deterministic PRNG for seeded runs */
    seededRand: function (seed) {
      var a = seed >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    touch: {
      available: touchOn,
      sendKey: sendKey,
      button: touchButton,
      key: keyButton,
      dpad: dpad,
      arrowDpad: arrowDpad,
      stick: stick
    },
    /* Run recorder — shared by the ghost racer and replay trophies.

       A game calls start()/sample()/finish() and gets both a local ghost and,
       when the arcade server happens to be serving the page, a shared one.
       Every server call is best-effort: these games are static files that must
       keep working opened straight off the disk, so a failed fetch is silently
       ignored rather than surfaced. */
    run: (function () {
      var RATE_MS = 100;            // 10 Hz is plenty to interpolate a ghost
      var MAX_FRAMES = 4000;        // ~6.5 minutes; matches the server cap
      var cur = null;

      function localKey(game) { return 'arcade_ghost_' + game; }

      function post(path, body) {
        try {
          return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' },
                               body: JSON.stringify(body) })
            .then(function (r) { return r.json(); })
            .catch(function () { return null; });
        } catch (e) { return Promise.resolve(null); }
      }

      return {
        start: function (game, seed) {
          cur = { game: game, seed: seed === undefined ? null : seed, frames: [], last: -1e9 };
        },
        /* Call every frame; it throttles itself. Pass the few numbers needed to
           redraw the ghost — position, lane, whatever the game interpolates. */
        sample: function (t) {
          if (!cur || cur.frames.length >= MAX_FRAMES) return;
          if (t - cur.last < RATE_MS / 1000) return;
          cur.last = t;
          cur.frames.push(Array.prototype.slice.call(arguments, 1).map(function (v) {
            return Math.round((Number(v) || 0) * 100) / 100;   // 2dp keeps ghosts small
          }));
        },
        recording: function () { return !!cur; },
        /* Keep the run if it beat the stored ghost, and offer it to the server. */
        finish: function (score, name) {
          if (!cur || !cur.frames.length) { cur = null; return Promise.resolve(null); }
          var ghost = { game: cur.game, seed: cur.seed, frames: cur.frames,

  } else {
    player.vx += (ax / mag) * ACCEL * dt;
    player.vy += (ay / mag) * ACCEL * dt;
    player.vx -= player.vx * FRICTION * dt;
    player.vy -= player.vy * FRICTION * dt;
    const v = Math.hypot(player.vx, player.vy);
    if (v > MAXV) { player.vx = player.vx / v * MAXV; player.vy = player.vy / v * MAXV; }
  }
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + player.vx * dt));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + player.vy * dt));
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.invuln = Math.max(0, player.invuln - dt);

  // banking tilt from lateral velocity relative to aim (visual only)
  const latv = (Math.cos(player.angle) * player.vy - Math.sin(player.angle) * player.vx) / MAXV;
  bank += (Math.max(-1, Math.min(1, latv)) - bank) * Math.min(1, dt * 9);

  // --- weapon timer
  if (weapon) {
    weapon.t -= dt;
    if (weapon.t <= 0) weapon = null;
  }

  // --- shooting
  player.fireCd -= dt;
  const wtype = weapon ? weapon.type : "basic";
  if (mouse.down && player.fireCd <= 0 && wtype !== "laser") {
    if (wtype === "spread") {
      player.fireCd = 0.17;
      for (let k = -2; k <= 2; k++) {
        const a = player.angle + k * 0.14 + (Math.random() - 0.5) * 0.03;
        bullets.push({
          x: player.x + Math.cos(a) * 18, y: player.y + Math.sin(a) * 18,
          vx: Math.cos(a) * 680 + player.vx * 0.3, vy: Math.sin(a) * 680 + player.vy * 0.3,
          life: 1.0, kind: "spread",
        });
      }
      sfx.shoot(); shake = Math.max(shake, 1.6);
    } else if (wtype === "rocket") {
      player.fireCd = 0.45;
      const a = player.angle;
      bullets.push({
        x: player.x + Math.cos(a) * 20, y: player.y + Math.sin(a) * 20,
        vx: Math.cos(a) * 330 + player.vx * 0.3, vy: Math.sin(a) * 330 + player.vy * 0.3,
        life: 2.4, kind: "rocket",
      });
      sfx.rocket(); shake = Math.max(shake, 2);
    } else {
      player.fireCd = 0.13;
      const a = player.angle + (Math.random() - 0.5) * 0.06;
      bullets.push({
        x: player.x + Math.cos(a) * 18, y: player.y + Math.sin(a) * 18,
        vx: Math.cos(a) * 720 + player.vx * 0.3, vy: Math.sin(a) * 720 + player.vy * 0.3,
        life: 1.1, kind: "basic",
      });
      sfx.shoot(); shake = Math.max(shake, 1.2);
    }
  }

  // --- bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === "rocket") {
      // smoke-glow trail
      particles.push({
        x: b.x - b.vx * 0.02, y: b.y - b.vy * 0.02,
        vx: (Math.random() - 0.5) * 36, vy: (Math.random() - 0.5) * 36,
        life: 0.45, maxLife: 0.45, color: "#ff9f5c", r: Math.random() * 3 + 2, kind: "smoke",
      });
      if (b.life <= 0) { explodeAt(b.x, b.y); bullets.splice(i, 1); continue; }
    }
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) bullets.splice(i, 1);
  }

  // --- enemy bullets
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { ebullets.splice(i, 1); continue; }
    if (player.invuln <= 0 && (b.x - player.x) ** 2 + (b.y - player.y) ** 2 < (player.r + b.r - 2) ** 2) {
      ebullets.splice(i, 1);
      if (hurtPlayer(b.x, b.y)) return gameOver();
    }
  }

  // --- wave management
  if (enemies.length === 0 && spawnQueue === 0) {
    waveTimer -= dt;
    if (waveTimer <= 0) { startWave(); waveTimer = 2.5; }
  }
  if (spawnQueue > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnTimer = Math.max(0.12, 0.65 - wave * 0.04);
      spawnEnemy(pickType());
      spawnQueue--;
    }
  }

  // --- enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.flash = Math.max(0, e.flash - dt * 8);
    e.wobble += dt * 3;
    if (e.type === "boss") {
      updateBoss(e, dt);
    } else {
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      let sp = e.speed;
      if (e.type === "darter") sp *= (Math.sin(e.wobble * 1.7) > 0 ? 1.6 : 0.3); // lunge rhythm
      const px = -dy / d, py = dx / d; // perpendicular drift
      let drift = (e.type === "chaser" || e.type === "mini") ? Math.sin(e.wobble) * 40 : 0;
      let radial = sp;
      if (e.type === "orbiter") {
        // hold a ring around the player: close if far, back off if too near
        const want = 190;
        radial = Math.max(-1, Math.min(1, (d - want) / 90)) * sp;
        drift = 150;                       // and keep circling
      } else if (e.type === "warden") {
        e.face = Math.atan2(dy, dx);       // armour tracks the player
        drift = Math.sin(e.wobble * 0.6) * 70;
      }
      e.vx += ((dx / d) * radial + px * drift - e.vx) * Math.min(1, dt * 4);
      e.vy += ((dy / d) * radial + py * drift - e.vy) * Math.min(1, dt * 4);
      e.x += e.vx * dt; e.y += e.vy * dt;
    }

    // bullet hits
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < (e.r + (b.kind === "rocket" ? 9 : 4)) ** 2) {
        bullets.splice(j, 1);
        if (b.kind === "rocket") {
          explodeAt(b.x, b.y);
        } else if (e.type === "warden" && e.face !== undefined &&
                   Math.abs(angDiff(Math.atan2(b.y - e.y, b.x - e.x), e.face)) < 1.05) {
          // hit the shielded arc: deflect, no damage
          e.flash = 1;
          burst(b.x, b.y, "#dff6ff", 4, 200);
          sfx.hit();
        } else {
          e.hp--; e.flash = 1;
          burst(b.x, b.y, e.color, 5, 160);
          if (e.hp > 0) sfx.hit();
        }
        break;
      }
    }

    // player collision
    if (e.hp > 0 && player.invuln <= 0 && (player.x - e.x) ** 2 + (player.y - e.y) ** 2 < (e.r + player.r - 4) ** 2) {
      if (hurtPlayer(e.x, e.y)) return gameOver();
    }
  }

  // --- laser beam (instant piercing while held)
  if (weapon && weapon.type === "laser" && mouse.down) {
    weapon.tick = (weapon.tick || 0) - dt;
    if (weapon.tick <= 0) {
      weapon.tick = 0.08;
      sfx.laser();
      shake = Math.max(shake, 1.5);
      const ca = Math.cos(player.angle), sa = Math.sin(player.angle);
      for (const e of enemies) {
        const rx = e.x - player.x, ry = e.y - player.y;
        const proj = rx * ca + ry * sa;
        if (proj > 0 && Math.abs(rx * sa - ry * ca) < e.r + 6) {
          e.hp--; e.flash = 1;
          burst(player.x + ca * proj, player.y + sa * proj, "#b36bff", 3, 140);
          if (e.hp > 0) sfx.hit();
        }
      }
    }
  }

  // --- dead sweep
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].hp <= 0) killEnemy(i);
  }

  // --- combo decay / multiplier chain
  comboTimer -= dt;
  if (comboTimer <= 0) combo = 0;
  const comboEl = document.getElementById("combo");
  const multUi = multNow();
  if (multUi >= 2) {
    comboEl.textContent = "x" + multUi;
    comboEl.style.opacity = 1;
  } else comboEl.style.opacity = 0;
  if (multUi > lastMult) {
    comboEl.classList.remove("pop");
    void comboEl.offsetWidth; // restart pop animation
    comboEl.classList.add("pop");
  }
  comboEl.classList.toggle("max", multUi >= 8);
  lastMult = multUi;

  // --- pickups (hearts + weapons)
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t += dt;
    if (p.t > 9) { pickups.splice(i, 1); continue; }
    if ((p.x - player.x) ** 2 + (p.y - player.y) ** 2 < (player.r + 14) ** 2) {
      if (p.kind === "heart") {
        if (player.hp < player.maxHp) player.hp++;
        score += 250;
        burst(p.x, p.y, "#ff5c8a", 14, 180);
        addShock(p.x, p.y, "#ff5c8a", 60);
        addPopup(p.x, p.y, "+250", "#ff5c8a", false);
      } else {
        weapon = { type: p.kind, t: WEAPON_TIME, tick: 0 };
        score += 150;
        burst(p.x, p.y, WEAPON_INFO[p.kind].color, 16, 200);
        addShock(p.x, p.y, WEAPON_INFO[p.kind].color, 70);
        announce = { text: WEAPON_INFO[p.kind].label + " ONLINE", t: 1.1, t0: 1.1 };
      }
      sfx.pickup();
      pickups.splice(i, 1);
    }
  }

  if (announce) { announce.t -= dt; if (announce.t <= 0) announce = null; }

  // --- HUD
  document.getElementById("hud").innerHTML =
    "SCORE " + score + (multUi > 1 ? " <span style='color:#ffe66d;text-shadow:0 0 10px rgba(255,230,109,0.9)'>x" + multUi + "</span>" : "") + "<br>" +
    "BEST&nbsp; " + best + "<br>" +
    "HULL&nbsp; " + "#".repeat(player.hp) + "<span style='opacity:0.25'>" + "#".repeat(Math.max(0, player.maxHp - player.hp)) + "</span>";
  document.getElementById("wave").innerHTML =
    "WAVE " + wave + "<br><span style='font-size:14px;color:#9fb8c8'>" +
    (player.dashCd <= 0 ? "DASH READY" : "dash " + player.dashCd.toFixed(1)) + "</span>";
}

function killEnemy(i) {
  const e = enemies[i];
  enemies.splice(i, 1);
  combo++;
  comboTimer = 2.2;
  const gained = Math.round(e.score * multNow());
  score += gained;
  shake = Math.max(shake, e.type === "boss" ? 18 : 5);
  sfx.kill();
  burst(e.x, e.y, e.color, e.type === "boss" ? 70 : 18, e.type === "boss" ? 420 : 220);
  addPopup(e.x, e.y, "+" + gained, e.color, multNow() >= 4 || e.type === "boss");
  if (e.type !== "boss") boom(e.x, e.y, e.color, e.type === "tank" ? 1.5 : 1);
  if (e.type === "splitter") {
    for (let k = 0; k < 3; k++) spawnEnemy("mini", e.x + (Math.random() - 0.5) * 30, e.y + (Math.random() - 0.5) * 30);
  }
  if (e.type === "boss") {
    boss = null;
    sfx.boom();
    announce = { text: "BOSS DOWN", t: 1.8, t0: 1.8 };
    // multi-stage death chain
    for (let k = 0; k < 7; k++) {
      fxQueue.push({
        t: 0.11 * k,
        x: e.x + (Math.random() - 0.5) * e.r * 2.2,
        y: e.y + (Math.random() - 0.5) * e.r * 2.2,
        color: k % 2 ? "#ffe66d" : "#ff5c8a",
        power: 1.5,
      });
    }
    fxQueue.push({ t: 0.85, x: e.x, y: e.y, color: "#ffffff", power: 3.4 });
    // guaranteed weapon pickup
    pickups.push({ x: e.x, y: e.y, t: 0, kind: WEAPON_KINDS[Math.floor(Math.random() * WEAPON_KINDS.length)] });
  } else if (Math.random() < 0.055) {
    pickups.push({ x: e.x, y: e.y, t: 0, kind: WEAPON_KINDS[Math.floor(Math.random() * WEAPON_KINDS.length)] });
  } else if (Math.random() < 0.06 && player.hp < player.maxHp) {
    pickups.push({ x: e.x, y: e.y, t: 0, kind: "heart" });
  }
}

function gameOver() {
  state = "gameover";
  paused = false;
  sfx.die();
  burst(player.x, player.y, "#5ce1ff", 60, 380);
  boom(player.x, player.y, "#5ce1ff", 3);
  if (score > best) { best = score; arcade.store.set(BEST_KEY, best); }
  document.getElementById("final-score").textContent = "SCORE " + score;
  document.getElementById("final-best").textContent = "BEST " + best;
  document.getElementById("final-wave").textContent = "made it to wave " + wave;
  document.getElementById("gameover").classList.remove("hidden");
}

// ---------- updateFx (visual-only, runs on every screen) ----------
function updateFx(dt) {
  vtime += dt;
  shake = Math.max(0, shake - dt * 30);
  flashA = Math.max(0, flashA - dt * 2.4);
  const hypeTarget = (state === "playing" && multNow() >= 8) ? 1 : 0;
  hypeA += (hypeTarget - hypeA) * Math.min(1, dt * 3);

  // star parallax drift
  for (const s of stars) {
    s.x -= s.z * dt * 6;
    if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // ripples / shockwaves / popups / ghosts
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].t += dt;
    if (ripples[i].t >= ripples[i].life) ripples.splice(i, 1);
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    shocks[i].t += dt;
    if (shocks[i].t >= shocks[i].life) shocks.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += dt;
    if (popups[i].t >= popups[i].life) popups.splice(i, 1);
  }
  for (let i = ghosts.length - 1; i >= 0; i--) {
    ghosts[i].life -= dt;
    if (ghosts[i].life <= 0) ghosts.splice(i, 1);
  }

  // delayed explosion chain (boss death)
  for (let i = fxQueue.length - 1; i >= 0; i--) {
    const q = fxQueue[i];
    q.t -= dt;
    if (q.t <= 0) {
      boom(q.x, q.y, q.color, q.power);
      burst(q.x, q.y, q.color, 16, 280);
      beep(90 + Math.random() * 60, 0.3, "sawtooth", 0.12, -50);
      shake = Math.max(shake, 7);
      fxQueue.splice(i, 1);
    }
  }

  // enemy spawn materialization countdown (visual only)
  if (enemies) {
    for (const e of enemies) {
      if (e.mat > 0) e.mat = Math.max(0, e.mat - dt);
    }
  }
}

// ---------- render helpers ----------
function tracePoly(n, r, rot) {
  ctx.beginPath();
  for (let k = 0; k <= n; k++) {
    const a = rot + (k / n) * Math.PI * 2;
    if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
}
function traceHull(g) {
  g.beginPath();
  g.moveTo(17, 0);
  g.lineTo(3, 4.5); g.lineTo(-6, 12); g.lineTo(-10, 6); g.lineTo(-5, 0);
  g.lineTo(-10, -6); g.lineTo(-6, -12); g.lineTo(3, -4.5);
  g.closePath();
}

function drawEnemyBody(e) {
  const m = e.mat > 0 ? e.mat / MAT_T : 0;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.globalAlpha = 1 - m * 0.6;
  const scl = 1 - m * 0.65;
  ctx.scale(scl, scl);
  const c = e.flash > 0.5 ? "#ffffff" : e.color;
  ctx.strokeStyle = c;
  ctx.lineWidth = 2.4;
  if (e.type === "chaser") {
    ctx.save(); ctx.rotate(e.wobble * 0.9);
    tracePoly(4, e.r, 0); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.rotate(-e.wobble * 1.6);
    ctx.lineWidth = 1.5;
    tracePoly(4, e.r * 0.45, 0); ctx.stroke();
    ctx.restore();
  } else if (e.type === "tank") {
    ctx.lineWidth = 3.2;
    ctx.save(); ctx.rotate(e.wobble * 0.35);
    tracePoly(6, e.r, 0); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.rotate(-e.wobble * 0.7);
    ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 0.6, k * 2.094, k * 2.094 + 1.25);
      ctx.stroke();
    }
    ctx.restore();
  } else if (e.type === "darter") {
    const ang = Math.atan2(e.vy, e.vx);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(e.r * 1.6, 0);
    ctx.lineTo(-e.r, e.r * 0.85);
    ctx.lineTo(-e.r * 0.4, 0);
    ctx.lineTo(-e.r, -e.r * 0.85);
    ctx.closePath();
    ctx.stroke();
    // flickering tail fin
    ctx.lineWidth = 1.4;
    ctx.globalAlpha *= 0.4 + Math.abs(Math.sin(e.wobble * 4)) * 0.6;
    ctx.beginPath();
    ctx.moveTo(-e.r * 0.6, 0);
    ctx.lineTo(-e.r * 1.9, 0);
    ctx.stroke();
  } else if (e.type === "splitter") {
    ctx.save(); ctx.rotate(e.wobble * 0.5);
    tracePoly(5, e.r * (1 + Math.sin(e.wobble * 2) * 0.06), 0); ctx.stroke();
    ctx.restore();
    // orbiting shards hinting at the minis inside
    ctx.lineWidth = 1.6;
    for (let k = 0; k < 3; k++) {
      const a = e.wobble * 1.8 + k * 2.094;
      ctx.save();
      ctx.translate(Math.cos(a) * e.r * 0.52, Math.sin(a) * e.r * 0.52);
      ctx.rotate(a + e.wobble);
      tracePoly(3, 4.5, 0); ctx.stroke();
      ctx.restore();
    }
  } else if (e.type === "orbiter") {
    ctx.save(); ctx.rotate(-e.wobble * 1.4);
    tracePoly(6, e.r, 0); ctx.stroke();
    ctx.restore();
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.5, e.wobble, e.wobble + 2.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.5, e.wobble + Math.PI, e.wobble + Math.PI + 2.2); ctx.stroke();
  } else if (e.type === "warden") {
    ctx.save(); ctx.rotate(e.wobble * 0.3);
    tracePoly(4, e.r, 0); ctx.stroke();
    ctx.restore();
    // the armoured arc, drawn facing the player
    if (e.face !== undefined) {
      ctx.save();
      ctx.rotate(e.face);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#dff6ff";
      ctx.beginPath(); ctx.arc(0, 0, e.r * 1.25, -1.05, 1.05); ctx.stroke();
      ctx.restore();
    }
  } else { // mini
    ctx.save(); ctx.rotate(e.wobble * 2.4);
    tracePoly(3, e.r, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // materialization: converging lines
  if (e.mat > 0) {
    ctx.globalAlpha = m;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = k * 1.047 + e.wobble;
      const d1 = e.r * (1 + m * 4.5), d2 = e.r * (1 + m * 2.2);
      ctx.moveTo(e.x + Math.cos(a) * d1, e.y + Math.sin(a) * d1);
      ctx.lineTo(e.x + Math.cos(a) * d2, e.y + Math.sin(a) * d2);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // hp bar
  if (e.type !== "boss" && e.maxHp > 1 && e.hp < e.maxHp && e.mat <= 0) {
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillRect(e.x - e.r, e.y - e.r - 8, (e.r * 2) * (e.hp / e.maxHp), 3);
  }
}

function drawBossBody(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const bc = e.flash > 0.5 ? "#ffffff" : e.color;
  // outer hex hull
  ctx.save();
  ctx.rotate(e.spin * 0.6);
  ctx.strokeStyle = bc;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  for (let k = 0; k <= 6; k++) {
    const a = (k / 6) * Math.PI * 2;
    const rr = e.r * (1 + Math.sin(e.spin * 2 + k) * 0.05);
    if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.stroke();
  // hull plating lines
  ctx.lineWidth = 1.4;
  ctx.globalAlpha = 0.5;
  tracePoly(6, e.r * 0.78, 0.26); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
  // counter-rotating inner core triangle
  ctx.save();
  ctx.rotate(-e.spin * 1.4);
  ctx.strokeStyle = e.flash > 0.5 ? "#ffffff" : "#b36bff";
  ctx.lineWidth = 2.5;
  tracePoly(3, e.r * 0.5, 0); ctx.stroke();
  ctx.lineWidth = 1.5;
  tracePoly(3, e.r * 0.3, Math.PI); ctx.stroke();
  ctx.restore();
  // orbiting pods
  ctx.strokeStyle = "#ffe66d";
  ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    const a = e.spin * 2 + (k / 3) * Math.PI * 2;
    const ox = Math.cos(a) * (e.r + 14), oy = Math.sin(a) * (e.r + 14);
    ctx.strokeRect(ox - 5, oy - 5, 10, 10);
  }
  ctx.restore();
}

// ---------- render ----------
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  // --- deep space base + drifting nebula (two blended layers)
  ctx.fillStyle = "#04050d";
  ctx.fillRect(0, 0, W, H);
  const nx = Math.sin(vtime * 0.05) * 30, ny = Math.cos(vtime * 0.04) * 24;
  ctx.globalAlpha = 0.9 + hypeA * 0.1;
  ctx.drawImage(nebA, -70 + nx, -70 + ny, W + 140, H + 140);
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = 0.55 + hypeA * 0.3;
  ctx.drawImage(nebB, -90 - nx * 1.6, -90 + ny * 1.3, W + 180, H + 180);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  const rm = arcade.reducedMotion();
  const sx = rm ? 0 : (Math.random() - 0.5) * shake, sy = rm ? 0 : (Math.random() - 0.5) * shake;
  ctx.translate(sx, sy);

  // --- grid floor with ripple displacement
  {
    const gA = 0.09 + hypeA * 0.08;
    const gr = Math.round(70 + hypeA * 150);
    const gg = Math.round(130 - hypeA * 55);
    const gb = Math.round(255 - hypeA * 50);
    ctx.strokeStyle = "rgba(" + gr + "," + gg + "," + gb + "," + gA + ")";
    ctx.lineWidth = 1;
    const G = 56;
    if (ripples.length === 0) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += G) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = 0; y <= H; y += G) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();
    } else {
      ctx.beginPath();
      for (let x = 0; x <= W; x += G) {
        for (let y = 0; y <= H + G; y += G) {
          rippleDisp(x, y);
          if (y === 0) ctx.moveTo(x + dspX, y + dspY);
          else ctx.lineTo(x + dspX, y + dspY);
        }
      }
      for (let y = 0; y <= H; y += G) {
        for (let x = 0; x <= W + G; x += G) {
          rippleDisp(x, y);
          if (x === 0) ctx.moveTo(x + dspX, y + dspY);
          else ctx.lineTo(x + dspX, y + dspY);
        }
      }
      ctx.stroke();
    }
  }

  // --- stars (parallax + twinkle, bright ones get a cached sparkle)
  for (const s of stars) {
    const a = (0.25 + 0.55 * Math.abs(Math.sin(vtime * 1.5 + s.tw))) * s.z;
    ctx.fillStyle = "rgba(170,215,255," + a.toFixed(3) + ")";
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalCompositeOperation = "lighter";
  for (const s of stars) {
    if (s.bright) drawGlow(orbSprite("#aef3ff"), s.x, s.y, 7 + Math.sin(vtime * 2 + s.tw) * 2.5, 0.5);
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  // --- pickups
  for (const p of pickups) {
    const pulse = 1 + Math.sin(p.t * 6) * 0.15;
    const fade = p.t > 7 ? (Math.sin(p.t * 20) > 0 ? 1 : 0.3) : 1;
    const col = p.kind === "heart" ? "#ff5c8a" : WEAPON_INFO[p.kind].color;
    ctx.globalCompositeOperation = "lighter";
    drawGlow(glowSprite(col), p.x, p.y, 58 * pulse, 0.8 * fade);
    ctx.globalCompositeOperation = "source-over";
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(pulse, pulse);
    ctx.globalAlpha = fade;
    ctx.strokeStyle = col;
    if (p.kind === "heart") {
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-5, 0); ctx.lineTo(5, 0);
      ctx.moveTo(0, -5); ctx.lineTo(0, 5);
      ctx.stroke();
    } else {
      ctx.lineWidth = 2;
      ctx.save();
      ctx.rotate(p.t * 1.2);
      ctx.beginPath();
      ctx.moveTo(0, -13); ctx.lineTo(13, 0); ctx.lineTo(0, 13); ctx.lineTo(-13, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = col;
      ctx.font = "bold 12px 'Courier New', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(p.kind.charAt(0).toUpperCase(), 0, 1);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // --- additive pass: particles, shockwaves, glows ---
  ctx.globalCompositeOperation = "lighter";

  // particles (pre-rendered sprites, no shadowBlur)
  for (const p of particles) {
    const k = Math.max(0, p.life / p.maxLife);
    if (p.kind === "smoke") {
      drawGlow(glowSprite(p.color), p.x, p.y, p.r * 7 * (1.8 - k), 0.3 * k);
    } else {
      drawGlow(orbSprite(p.color), p.x, p.y, p.r * 4.5, k);
    }
  }
  ctx.globalAlpha = 1;

  // shockwave rings
  for (const s of shocks) {
    const k = s.t / s.life;
    const rr = s.maxR * (1 - (1 - k) * (1 - k));
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.lineWidth = 3.5 * (1 - k) + 0.8;
    ctx.strokeStyle = s.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.45;
    ctx.lineWidth *= 0.5;
    ctx.strokeStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(s.x, s.y, rr * 0.9, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // enemy glow halos + pulsing cores
  for (const e of enemies) {
    const m = e.mat > 0 ? e.mat / MAT_T : 0;
    const pulse = 1 + Math.sin(e.wobble * 2) * 0.12;
    drawGlow(glowSprite(e.color), e.x, e.y, e.r * 5.2 * pulse * (1 - m * 0.5), (0.55 + e.flash * 0.45) * (1 - m * 0.6));
    drawGlow(orbSprite(e.color), e.x, e.y, e.r * 1.1 * pulse, 0.85 * (1 - m));
    if (e.type === "boss") {
      drawGlow(glowSprite("#b36bff"), e.x, e.y, e.r * 3.2, 0.5 + Math.sin(e.spin * 3) * 0.15);
      drawGlow(orbSprite("#ff5c8a"), e.x, e.y, e.r * 0.9 + Math.sin(e.spin * 4) * 6, 0.9);
    }
  }
  ctx.globalAlpha = 1;

  // enemy bullets: hot orbs with pulse
  {
    const eorb = orbSprite("#ff5c8a");
    let bi = 0;
    for (const b of ebullets) {
      const pr = (b.r + 3) * 2.4 * (1 + Math.sin(vtime * 9 + bi++) * 0.12);
      drawGlow(eorb, b.x, b.y, pr, 1);
    }
    ctx.globalAlpha = 1;
  }

  // player bullets: bright core + halo, stretched by speed
  ctx.lineCap = "round";
  for (const b of bullets) {
    if (b.kind === "rocket") {
      drawGlow(orbSprite("#ff9f5c"), b.x, b.y, 26, 1);
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = "#ffcf9f";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * 0.045, b.y - b.vy * 0.045);
      ctx.stroke();
    } else {
      const col = b.kind === "spread" ? "#ffe66d" : "#5ce1ff";
      const v = Math.hypot(b.vx, b.vy) || 1;
      const st = Math.min(0.035, 10 / v + 0.014); // stretch factor grows with speed
      drawGlow(glowSprite(col), b.x, b.y, 30, 0.7);
      drawGlow(orbSprite(col), b.x, b.y, 13, 1);
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * st, b.y - b.vy * st);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * st * 0.5, b.y - b.vy * st * 0.5);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // laser beam: layered core + crackling edges
  if (state === "playing" && !paused && weapon && weapon.type === "laser" && mouse.down) {
    const a = player.angle;
    const ca = Math.cos(a), sa = Math.sin(a);
    const x0 = player.x + ca * 18, y0 = player.y + sa * 18;
    // wide soft halo
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = "#b36bff";
    ctx.lineWidth = 16 + Math.sin(vtime * 50) * 3;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + ca * 2400, y0 + sa * 2400); ctx.stroke();
    // main beam
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 5 + Math.sin(vtime * 60) * 1.5;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + ca * 2400, y0 + sa * 2400); ctx.stroke();
    // white-hot core
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + ca * 2400, y0 + sa * 2400); ctx.stroke();
    // crackling edge: jittered polylines
    ctx.strokeStyle = "#e3c6ff";
    ctx.lineWidth = 1;
    for (let pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = 0.3 + Math.random() * 0.3;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      const reach = Math.max(W, H) * 1.5;
      for (let t = 50; t < reach; t += 46) {
        const j = (Math.random() - 0.5) * 13;
        ctx.lineTo(x0 + ca * t - sa * j, y0 + sa * t + ca * j);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // muzzle flare
    drawGlow(orbSprite("#b36bff"), x0, y0, 34 + Math.random() * 10, 1);
  }

  // dash afterimages
  for (const g of ghosts) {
    const k = g.life / g.maxLife;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.angle);
    ctx.globalAlpha = k * 0.45;
    ctx.strokeStyle = "#5ce1ff";
    ctx.lineWidth = 2;
    traceHull(ctx);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // player glow + engine
  if (state === "playing" || state === "title") {
    const p = player;
    const blink = p.invuln > 0 && Math.sin(vtime * 40) > 0;
    if (!blink) {
      const sp = Math.hypot(p.vx, p.vy);
      drawGlow(glowSprite("#5ce1ff"), p.x, p.y, 92, 0.55 + hypeA * 0.2);
      // exhaust bloom scales with speed
      if (sp > 30 || p.dashTime > 0) {
        const ex = p.x - Math.cos(p.angle) * 14, ey = p.y - Math.sin(p.angle) * 14;
        drawGlow(orbSprite("#ffe66d"), ex, ey, 14 + sp * 0.05 + Math.random() * 6, 0.8);
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle + bank * 0.12);
      ctx.scale(1, 1 - Math.abs(bank) * 0.28); // banking tilt
      // engine flame (additive, scales with speed, flickers)
      if (sp > 30 || p.dashTime > 0) {
        const flen = 8 + (sp / 340) * 20 + Math.random() * 6 + (p.dashTime > 0 ? 14 : 0);
        ctx.fillStyle = "rgba(255,160,70,0.55)";
        ctx.beginPath();
        ctx.moveTo(-8, 4.5); ctx.lineTo(-8 - flen, 0); ctx.lineTo(-8, -4.5);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(255,240,185,0.85)";
        ctx.beginPath();
        ctx.moveTo(-8, 2.2); ctx.lineTo(-8 - flen * 0.55, 0); ctx.lineTo(-8, -2.2);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }

  // bloom flash from explosions
  if (flashA > 0.01) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(185,220,255," + (flashA * 0.22).toFixed(3) + ")";
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  // x8 hype shimmer
  if (hypeA > 0.02) {
    ctx.fillStyle = "rgba(255,80,190," + (hypeA * 0.035 * (1 + Math.sin(vtime * 6) * 0.5)).toFixed(4) + ")";
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  // --- enemy bodies (crisp strokes above their glow)
  for (const e of enemies) {
    if (e.type === "boss") drawBossBody(e);
    else drawEnemyBody(e);
  }

  // --- player hull (crisp above glow)
  if (state === "playing" || state === "title") {
    const p = player;
    const blink = p.invuln > 0 && Math.sin(vtime * 40) > 0;
    if (!blink) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle + bank * 0.12);
      ctx.scale(1, 1 - Math.abs(bank) * 0.28);
      ctx.strokeStyle = "#5ce1ff";
      ctx.lineWidth = 2.2;
      traceHull(ctx);
      ctx.stroke();
      ctx.fillStyle = "rgba(92,225,255,0.09)";
      ctx.fill();
      // cockpit diamond
      ctx.strokeStyle = "#d9f7ff";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(9, 0); ctx.lineTo(1.5, 3); ctx.lineTo(-2, 0); ctx.lineTo(1.5, -3);
      ctx.closePath();
      ctx.stroke();
      // wing tips
      ctx.strokeStyle = "rgba(92,225,255,0.65)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-6, 12); ctx.lineTo(-12, 14);
      ctx.moveTo(-6, -12); ctx.lineTo(-12, -14);
      ctx.stroke();
      ctx.restore();
    }
  }

  // --- score popups (juicy pop typography)
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const p of popups) {
    const k = p.t / p.life;
    const pop = 1 + Math.max(0, 1 - p.t * 6) * 0.9;
    ctx.globalAlpha = 1 - k * k;
    ctx.fillStyle = p.color;
    ctx.font = "bold " + Math.round((p.big ? 21 : 13) * pop) + "px 'Courier New', monospace";
    ctx.fillText(p.text, p.x, p.y - 16 - k * 28);
  }
  ctx.globalAlpha = 1;

  // wave announcement (scale-in pop)
  if (announce) {
    const k = 1 - announce.t / announce.t0;
    const scl = 1 + Math.exp(-k * 9) * 0.45;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 60);
    ctx.scale(scl, scl);
    ctx.globalAlpha = Math.min(1, announce.t * 2);
    ctx.font = "bold 52px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(92,225,255,0.35)";
    ctx.fillText(announce.text, 2, 2);
    ctx.fillStyle = "#5ce1ff";
    ctx.fillText(announce.text, 0, 0);
    ctx.restore();
  }

  // boss health bar
  if (boss && state === "playing") {
    const bw = Math.min(540, W * 0.6), bh = 12;
    const bx = W / 2 - bw / 2, by = 58;
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fillRect(bx, by, bw, bh);
    const frac = Math.max(0, boss.hp / boss.maxHp);
    const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
    grad.addColorStop(0, "#ff8aad");
    grad.addColorStop(1, "#ff5c8a");
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, bw * frac, bh);
    ctx.globalCompositeOperation = "lighter";
    drawGlow(glowSprite("#ff5c8a"), bx + bw * frac, by + bh / 2, 30, 0.8);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "rgba(255,92,138,0.6)"; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = "#ff5c8a";
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText("B O S S", W / 2, by - 4);
    ctx.restore();
  }

  // weapon timer bar
  if (weapon && state === "playing") {
    const info = WEAPON_INFO[weapon.type];
    const bw = 220, bh = 8;
    const bx = W / 2 - bw / 2, by = H - 46;
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(bx, by, bw, bh);
    const frac = Math.max(0, weapon.t / WEAPON_TIME);
    ctx.fillStyle = info.color;
    ctx.fillRect(bx, by, bw * frac, bh);
    ctx.globalCompositeOperation = "lighter";
    drawGlow(glowSprite(info.color), bx + bw * frac, by + bh / 2, 24, 0.8);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = info.color;
    ctx.font = "12px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(info.label, W / 2, by - 4);
    ctx.restore();
  }

  // --- vignette + chromatic edge (pre-rendered, untransformed)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(vig, 0, 0, W, H);

  // pause overlay
  if (paused && state === "playing") {
    ctx.fillStyle = "rgba(5, 6, 15, 0.62)";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.fillStyle = "#5ce1ff";
    ctx.font = "bold 46px 'Courier New', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("PAUSED", W / 2, H / 2 - 10);
    ctx.font = "16px 'Courier New', monospace";
    ctx.fillText("press P to resume", W / 2, H / 2 + 36);
    ctx.restore();
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  const frozen = state === "playing" && paused;
  if (state === "playing" && !paused) update(dt);
  if (!frozen) updateFx(dt);
  draw();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);

// ---------- volume UI ----------
const volSlider = document.getElementById("vol");
const volState = document.getElementById("volstate");
volSlider.value = String(masterVol);
function updateVolState() { volState.textContent = muted ? "MUTED" : ""; }
volSlider.addEventListener("input", () => {
  masterVol = parseFloat(volSlider.value);
  arcade.store.set(VOL_KEY, masterVol);
  if (muted) { muted = false; updateVolState(); }
  applyVolume();
});
updateVolState();

// ---------- flow ----------
document.getElementById("title-best").textContent = best > 0 ? "BEST " + best : "";
document.getElementById("title").addEventListener("click", () => {
  initAudio();
  reset();
  state = "playing";
  document.getElementById("title").classList.add("hidden");
});
document.getElementById("gameover").addEventListener("click", () => {
  initAudio();
  reset();
  state = "playing";
  document.getElementById("gameover").classList.add("hidden");
});

/* ---------- touch controls ---------- */
if (arcade.touch.available) {
  /* touch controls own the bottom corners: move the colliding chrome */
  var volbox = document.getElementById("volbox");
  if (volbox) volbox.style.cssText += ";bottom:14px;right:auto;left:50%;transform:translateX(-50%)";
  const fixHubLink = () => {
    const hubl = document.querySelector(".hub-link");
    if (hubl) hubl.style.cssText += ";bottom:auto;top:12px;left:50%;transform:translateX(-50%)";
  };
  // the hub link sits after this script in the body, so wait for the parser
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fixHubLink);
  else fixHubLink();

  arcade.touch.stick({ label: "MOVE", style: "left:20px;bottom:20px",
    onMove: (nx, ny) => {
      keys.KeyA = nx < -0.3; keys.KeyD = nx > 0.3;
      keys.KeyW = ny < -0.3; keys.KeyS = ny > 0.3;
    } });
  arcade.touch.stick({ label: "AIM", style: "right:20px;bottom:20px",
    onMove: (nx, ny, active) => {
      if (active && Math.hypot(nx, ny) > 0.25 && player) {
        mouse.x = player.x + nx * 220;
        mouse.y = player.y + ny * 220;
        mouse.down = true;
      } else {
        mouse.down = false;
      }
    } });
  arcade.touch.button({ label: "DASH", style: "right:52px;bottom:164px", size: 58,
    onDown: () => { keys.Space = true; },
    onUp: () => { keys.Space = false; } });
}
</script>
